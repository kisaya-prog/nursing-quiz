<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon.svg"><title>护理刷题</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f}.app{max-width:720px;margin:auto;padding:env(safe-area-inset-top) 14px calc(92px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;z-index:8;background:rgba(245,245,247,.92);backdrop-filter:blur(18px);padding:12px 0}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.chip,.mini{border:0;background:#e8e8ed;border-radius:11px;padding:9px 11px;font-weight:650}.chip.on,.mini.on{background:#1d1d1f;color:#fff}.muted{color:#6e6e73;font-size:13px}.bar{height:5px;background:#ddd;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#1d1d1f}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:5px}.stat{background:#fff;border-radius:10px;padding:4px;text-align:center}.stat b{display:block;font-size:13px}.stat span{font-size:9px;color:#777}.card{background:#fff;border-radius:20px;padding:19px;margin-top:12px;box-shadow:0 2px 12px #0000000a}.q{font-size:23px;line-height:1.6;font-weight:650;white-space:pre-wrap}.opt{width:100%;text-align:left;border:1px solid #ddd;background:#fff;border-radius:14px;padding:16px;margin-top:12px;font-size:18px;line-height:1.4}.opt.sel{border:2px solid #1d1d1f}.opt.correct{background:#eaf7ed;border-color:#48a85b}.opt.wrong{background:#fff0f0;border-color:#e45b5b}.actions{display:flex;gap:8px;margin-top:15px}.btn{border:0;border-radius:14px;padding:13px;font-size:16px;font-weight:650;flex:1}.primary{background:#1d1d1f;color:#fff}.secondary{background:#e8e8ed}.answer{display:none;margin-top:15px;border-top:1px solid #eee;padding-top:15px;line-height:1.6}.answer.show{display:block}.ans{font-size:18px;font-weight:750}.exp{margin-top:7px;white-space:pre-wrap}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);backdrop-filter:blur(18px);padding:9px 14px calc(9px + env(safe-area-inset-bottom));display:flex;gap:9px;z-index:9}.bottom>*{max-width:330px;margin:auto}.overlay{display:none;position:fixed;inset:0;background:#0006;z-index:20;padding:calc(20px + env(safe-area-inset-top)) 14px}.overlay.show{display:block}.panel{max-width:700px;height:min(86vh,760px);margin:auto;background:#fff;border-radius:22px;padding:16px;display:flex;flex-direction:column}.jump{display:flex;gap:8px}.jump input,.search{width:100%;border:1px solid #ddd;border-radius:12px;padding:12px;font-size:16px}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;overflow:auto;margin-top:12px}.num{border:0;border-radius:10px;padding:10px 4px;background:#eee;font-weight:650}.num.w{background:#fff0f0}.num.f{outline:2px solid #111}.num.cur{background:#111;color:#fff}.empty{text-align:center;color:#777;padding:30px 10px}</style></head><body>
<div class="app"><div class="top"><div class="row"><b>护理刷题</b><div style="display:flex;gap:6px"><a href="./simple.html" class="mini" style="text-decoration:none;color:inherit">极简版</a><button id="jumpOpen" class="mini">题号</button></div></div><div class="tools"><button data-mode="all" class="chip on">顺序</button><button data-mode="random" class="chip">随机</button><button data-mode="wrong" class="chip">错题</button><button data-mode="fav" class="chip">收藏</button><button id="searchOpen" class="chip">搜索</button></div><div class="bar"><i id="prog"></i></div><div class="stats"><div class="stat"><b id="done">0</b><span>已答</span></div><div class="stat"><b id="correctN">0</b><span>正确</span></div><div class="stat"><b id="wrongN">0</b><span>错题</span></div><div class="stat"><b id="rate">0%</b><span>正确率</span></div></div></div>
<div class="card"><div class="row"><span id="count" class="muted"></span><button id="favBtn" class="mini">收藏 ☆</button></div><div id="q" class="q"></div><div id="opts"></div><div class="actions"><button id="wrongBtn" class="mini">错题 ☆</button></div><div id="answer" class="answer"><div id="ans" class="ans"></div><div id="exp" class="exp"></div></div><div class="muted" style="text-align:center;margin-top:10px">进度保存在本机</div></div></div>
<div class="bottom"><button id="prev" class="btn secondary">上一题</button><button id="next" class="btn primary">下一题</button></div>
<div id="overlay" class="overlay"><div class="panel"><div class="row"><b id="panelTitle">选择题目</b><button id="close" class="mini">关闭</button></div><div class="jump"><input id="jumpInput" type="number" min="1" max="1100" placeholder="输入题号 1–1100"><button id="jumpGo" class="mini">跳转</button></div><input id="searchInput" class="search" style="margin-top:9px" placeholder="搜索题干关键词"><div id="grid" class="grid"></div></div></div>
<script src="./questions.js"></script><script>
const $=id=>document.getElementById(id),Q=window.Q;let idx=Math.min(+(localStorage.nq_idx||0),Q.length-1),selected=null,mode='all';let wrong=new Set(JSON.parse(localStorage.nq_wrong||'[]')),fav=new Set(JSON.parse(localStorage.nq_fav||'[]')),answered=JSON.parse(localStorage.nq_answered||'{}');
function save(){localStorage.nq_idx=idx;localStorage.nq_wrong=JSON.stringify([...wrong]);localStorage.nq_fav=JSON.stringify([...fav]);localStorage.nq_answered=JSON.stringify(answered)}
function pool(){if(mode==='wrong')return Q.map((x,i)=>i).filter(i=>wrong.has(Q[i].n));if(mode==='fav')return Q.map((x,i)=>i).filter(i=>fav.has(Q[i].n));return Q.map((x,i)=>i)}
function stats(){let v=Object.values(answered),c=v.filter(Boolean).length;$('done').textContent=v.length;$('correctN').textContent=c;$('wrongN').textContent=wrong.size;$('rate').textContent=v.length?Math.round(c/v.length*100)+'%':'0%'}
function render(){let x=Q[idx];selected=null;$('q').textContent=x.n+'. '+x.q;$('count').textContent='第 '+x.n+' 题 / '+Q.length;$('prog').style.width=(x.n/Q.length*100)+'%';$('opts').innerHTML='';x.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{
if($('answer').classList.contains('show')) return;
selected=o[0];
[...$('opts').children].forEach(z=>z.classList.remove('sel','correct','wrong'));
b.classList.add('sel');
let ok=selected===x.answer;
[...$('opts').children].forEach(z=>{
if(z.textContent[0]===x.answer)z.classList.add('correct');
if(z===b&&!ok)z.classList.add('wrong');
});
$('answer').className='answer show';
$('ans').textContent='你的选择：'+selected+(ok?' ✓':' ✗')+'  正确答案：'+x.answer;
$('exp').textContent=x.explanation?'解析：'+x.explanation:'';
answered[x.n]=ok;
if(ok) wrong.delete(x.n); else wrong.add(x.n);
stats();save();
};$('opts').appendChild(b)});$('answer').className='answer';$('ans').textContent='正确答案：'+x.answer;$('exp').textContent=x.explanation?'解析：'+x.explanation:'';$('wrongBtn').textContent=wrong.has(x.n)?'错题 ★':'错题 ☆';$('wrongBtn').className=wrong.has(x.n)?'mini on':'mini';$('favBtn').textContent=fav.has(x.n)?'收藏 ★':'收藏 ☆';$('favBtn').className=fav.has(x.n)?'mini on':'mini';stats();save()}
$('wrongBtn').onclick=()=>{let n=Q[idx].n;wrong.has(n)?wrong.delete(n):wrong.add(n);render()};$('favBtn').onclick=()=>{let n=Q[idx].n;fav.has(n)?fav.delete(n):fav.add(n);render()};
function move(d){let p=pool();if(!p.length)return alert(mode==='wrong'?'暂无错题':'暂无收藏题');if(mode==='random')idx=p[Math.floor(Math.random()*p.length)];else{let k=p.indexOf(idx);idx=p[(Math.max(0,k)+d+p.length)%p.length]}render()}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));if(mode==='random')idx=Math.floor(Math.random()*Q.length);else{let p=pool();if(p.length&&!p.includes(idx))idx=p[0]}render()});
function openPanel(search=false){$('overlay').classList.add('show');$('searchInput').value='';$('jumpInput').value='';$('panelTitle').textContent=search?'搜索题目':'按序号选择题目';drawGrid('');if(search)setTimeout(()=>$('searchInput').focus(),100)}
function drawGrid(term){let t=term.trim().toLowerCase(),arr=Q.filter(x=>!t||x.q.toLowerCase().includes(t));$('grid').innerHTML=arr.length?'':'<div class="empty">没有找到题目</div>';arr.forEach(x=>{let b=document.createElement('button');b.className='num'+(wrong.has(x.n)?' w':'')+(fav.has(x.n)?' f':'')+(Q[idx].n===x.n?' cur':'');b.textContent=x.n;b.title=x.q;b.onclick=()=>{idx=x.n-1;$('overlay').classList.remove('show');render()};$('grid').appendChild(b)})}
$('jumpOpen').onclick=()=>openPanel(false);$('searchOpen').onclick=()=>openPanel(true);$('close').onclick=()=>$('overlay').classList.remove('show');$('overlay').onclick=e=>{if(e.target===$('overlay'))$('overlay').classList.remove('show')};$('searchInput').oninput=e=>drawGrid(e.target.value);function jump(){let n=+$('jumpInput').value;if(n>=1&&n<=Q.length){idx=n-1;$('overlay').classList.remove('show');render()}else alert('请输入 1–'+Q.length+' 的题号')}$('jumpGo').onclick=jump;$('jumpInput').onkeydown=e=>{if(e.key==='Enter')jump()};
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>

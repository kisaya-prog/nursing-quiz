以“体检发现子宫肌瘤1个月”为主诉入院治疗，拟行经腹子宫肌瘤切除术。术前1日护理除外","options":["A.皮肤准备","B.交叉配血","C.镇静药使用","D.饮食管理","E.导尿"],"answer":"E","explanation":"手术前1日，护士应认真核对手术相关医嘱，规范完成术前准备内容：①皮肤准备；②肠道准备；镇静药使用；其他（与外科手术病人一致）。导尿是手术日护理内容。"},{"n":928,"q":"某学校一个班3周内相继有6位学生出现乏力、食欲缺乏、巩膜及皮肤出现黄染，ALT增高，经诊断为急性甲型肝炎。为保护易感人群，应对同班的其他同学进行的处理是","options":["A.立即疏散学生，单间隔离","B.立即口服蒙脱石散","C.立即注射HBIG","D.立即注射胸腺喷丁","E.立即注射人血清或胎盘球蛋白和甲肝疫苗"],"answer":"E","explanation":"甲型肝炎病人的接触者可在接触感染后7～10天接种人血清或胎盘球蛋白以防止发病。在甲型肝炎流行期间，易感人群都应注射甲型肝炎减毒活疫苗。"},{"n":929,"q":"某足月新生儿，出生后第5天脐带脱落，脐周有少许无色黏液。正确的护理措施是","options":["A.无须处理","B.碘伏消毒局部","C.硝酸银烧灼局部","D.紫外线照射局部","E.全身应用抗生素"],"answer":"B","explanation":"新生儿脐带脱落后，如有黏液用碘伏消毒；如有肉芽组织，用硝酸银烧灼；如有化脓性感染用碘伏或过氧化氢消毒，同时用抗生素。"},{"n":930,"q":"病人女，48岁。间断头痛2周入院，门诊行颅脑磁共振检查确诊为左侧颞叶胶质瘤。手术前日突发意识不清，左侧瞳孔散大，右侧肢体瘫痪，考虑为小脑幕切迹疝。关于该病人临床表现的描述，下列正确的是","options":["A.患侧瞳孔最初有短暂的散大，但多不易被发现","B.患侧瞳孔直接或间接对光反射不会消失","C.对侧上睑下垂及眼球外斜","D.病变对侧肢体瘫痪、肌张力增加、腱反射亢进","E.随病情进展病人对侧瞳孔不会逐渐散大"],"answer":"D","explanation":"病人发生小脑幕切迹疝时，患侧瞳孔先缩小后散大，随病情进展患侧动眼神经麻痹，患侧瞳孔逐渐散大，直接或间接对光反射消失，伴有患侧上睑下垂及眼球外斜。对侧肢体瘫痪。"},{"n":931,"q":"病人女，糖尿病多年。出现头晕、心悸、无力、出汗、强烈饥饿感等症状，主要原因最可能是发生了","options":["A.合并胃溃疡","B.低血糖","C.合并肾衰竭","D.胰岛素过敏","E.酸中毒"],"answer":"B","explanation":"低血糖反应是糖尿病病人用药的最主要的不良反应，主要表现为头晕、心悸、出汗、饥饿甚至昏迷。"},{"n":932,"q":"某市一所高校学生突然发生大范围食物中毒，应选择下列统计学指标进行评估的是","options":["A.发病率","B.现患率","C.感染率","D.罹患率","E.时点患病率"],"answer":"D","explanation":"罹患率是指在某一局限范围内、短时间内的发病率，适用于局部地区疾病暴发时，如食物中毒。"},{"n":933,"q":"病人女，52岁。患高血压3年，一直以来血压值波动在140～159/90～95mmHg范围内。该女士的血压水平属于","options":["A.临界高血压","B.1级高血压","C.2级高血压","D.3级高血压","E.单纯收缩期高血压"],"answer":"B","explanation":"1级高血压（轻度）为收缩压140～159mmHg和/或舒张压90～99mmHg。"},{"n":934,"q":"病人男，65岁。1周前出现右侧面部无汗、上眼睑下垂、瞳孔缩小、眼球内陷。胸片示右胸膜顶部可见一致密团块影。病人出现上述症状是由于病变损害了","options":["A.喉返神经","B.胸导管","C.臂丛神经","D.颈交感神经","E.上腔静脉"],"answer":"D","explanation":"病人出现面部无汗、上眼睑下垂、瞳孔缩小、眼球内陷，说明病人出现Horner综合征，为上叶顶部肺癌压迫或损害了颈交感神经所致。"},{"n":935,"q":"病人男，37岁。有消化性溃疡病史。近5天来，经常午夜腹痛。此病常见的发病部位为","options":["A.胃体","B.胃小弯","C.胃窦","D.十二指肠球部","E.十二指肠水平部"],"answer":"D","explanation":"病人有消化性溃疡病史，根据疼痛特点，初步诊断为十二指肠溃疡，好发部位为十二指肠球部。"},{"n":936,"q":"病人男，30岁。1周前确诊肺结核。2小时前突然出现喷射性大咯血，继而突然中断，表情恐怖，大汗淋漓，此时首要的护理措施是","options":["A.立即取中凹卧位","B.加压给氧","C.立即气管切开","D.立即清除血块","E.人工呼吸"],"answer":"D","explanation":"病人于咯血时出现咯血中断，表情恐怖，大汗淋漓，说明病人出现了血块滞留导致的窒息。此时应立即清除血块，保持呼吸道通畅。"},{"n":937,"q":"病人男，21岁。胸背部刀刺伤。护理体检：右前胸见2cm×1.5cm伤口，可闻及气体进出胸膜腔的声音；背部右肩胛骨处可见两处2.5cm长的伤口，可探及骨质。目前首要的处理措施为","options":["A.剖胸探查","B.迅速封闭前胸伤口","C.清创术","D.胸膜腔穿刺","E.吸氧"],"answer":"B","explanation":"病人为开放性气胸，急救措施为迅速封闭胸部伤口。"},{"n":938,"q":"病人女，63岁。拟在联合阻滞麻醉下行子宫全切术加阴道前后壁修补术，护士为其进行围手术期的护理措施中错误的是","options":["A.术前用0．2%的碘伏行阴道冲洗","B.术前日晚及术日晨行清洁灌肠","C.病人毛发稀少则无需常规剃毛","D.为避免排便困难，术后第3天给予轻泻药","E.术后尿道口每日行会阴护理2次"],"answer":"D","explanation":"会阴部手术病人肠道护理措施中为防止大便对伤口的污染及排便时对伤口的牵拉，应控制首次排便时间，常用药物为阿片酊。于术后第5天给予轻泻药，使大便软化，避免排便困难。"},{"n":939,"q":"病人男，46岁。在外就餐后1天内出现发热，腹痛，腹泻10余次，开始为稀水样便，后转为黏液脓血便，伴里急后重。血常规：WBC 19.9×109/L，便常规：WBC≥15个/HP，RBC 10～15个/HP，诊断为细菌性痢疾。该病人病原治疗的首选药为","options":["A.喹诺酮类药物","B.青霉素","C.红霉素","D.复方新诺明","E.头孢菌素"],"answer":"A","explanation":"细菌性痢疾病原治疗的首选药为喹诺酮类药物。未满18岁的病人可选用头孢菌素。"},{"n":940,"q":"病人男，32岁。电击伤后呼吸心搏骤停，初期复苏时正确的操作顺序是","options":["A.人工呼吸→开放气道→胸外按压","B.胸外叩击→开放气道→胸外按压","C.胸外按压→开放气道→人工呼吸","D.开放气道→人工呼吸→胸外按压","E.人工呼吸→胸外按压→静脉通道建立"],"answer":"C","explanation":"基础生命支持亦称初期复苏或现场急救，指专业或非专业人员进行徒手抢救，包括3个步骤，即胸外按压、开放气道、人工呼吸。"},{"n":941,"q":"医院积极研发“护理差错统计上报系统”和“护理人员网上培训系统”并投入试运行，是在顺应护理管理发展趋势中的","options":["A.管理思想现代化","B.管理手段信息化","C.管理方法科学化","D.管理人才专业化","E.管理内容趋向合理化"],"answer":"B","explanation":"信息技术的应用可实现管理手段自动化。随着信息技术的发展，网络管理的自动化程度将进一步普及和提高。"},{"n":942,"q":"病人女，29岁。妊娠8周，近期出现食欲缺乏，恶心、呕吐，嗜睡等症状。社区护士给予正确的饮食指导是","options":["A.摄入高糖、高脂肪食物","B.摄入辛辣食物刺激食欲","C.摄入高糖、高纤维素饮食","D.摄入富含色素食物增加食欲","E.摄入富含维生素食物"],"answer":"E","explanation":"病人处于妊娠早期，正确的饮食指导是摄入富含维生素食物。"},{"n":943,"q":"患儿女，8岁。诊断为幼年特发性关节炎。对该患儿的药物治疗原则不正确的是","options":["A.控制病变活动度","B.减轻或消除关节疼痛和肿胀","C.应用头孢类药物控制感染","D.预防关节功能不全和残疾","E.恢复关节功能和生活与劳动能力"],"answer":"C","explanation":"幼年特发性关节炎治疗原则：控制病变活动度，减轻或消除关节疼痛和肿胀，预防感染和关节炎的加重；预防关节功能不全和残疾，恢复关节功能和生活与劳动能力。其中药物疗法为应用水杨酸制剂与非甾体抗炎药等治疗。"},{"n":944,"q":"患儿男，7岁。尿少，眼睑及面部水肿2天，伴咽痛、咳嗽。体格检查：血压138/96mmHg。辅助检查：尿蛋白（+++），尿红细胞（+++）。该患儿可能的临床诊断是","options":["A.急性肾小球肾炎","B.单纯性肾病","C.急性泌尿系统感染","D.肾炎性肾病","E.急进性肾小球肾炎"],"answer":"A","explanation":"患儿以眼睑面部水肿、前驱感染、血尿、高血压为主要临床表现，符合急性肾小球肾炎的诊断。"},{"n":945,"q":"患儿女，6个月。发热4天，出现皮疹1天，有咳嗽、流涕症状，现初步诊断为麻疹。下列处理措施不恰当的是","options":["A.拉开窗帘保证室内有足够的光线","B.加强护理","C.给予降温治疗","D.监测体温变化","E.积极采取措施预防并发症"],"answer":"A","explanation":"麻疹患儿有畏光流泪的表现，所以尽量避免室内光线太足。"},{"n":946,"q":"病人男，40岁。中午在烈日下劳动，突然出现头晕、恶心、四肢无力，面色苍白，大汗淋漓，皮肤湿冷。体温38.5℃，心率120次/min，脉搏细速，血压70/50mmHg。考虑该病人发生了","options":["A.中暑","B.低血糖","C.食物中毒","D.有机磷农药中毒","E.热痉挛"],"answer":"A","explanation":"热痉挛主要出现肌肉痉挛和疼痛，体温一般正常。中暑的表现主要是体温高、全身皮肤湿冷、血压下降、脉率增快。"},{"n":947,"q":"若护士在给乙型肝炎病人采血后，不慎将针头扎在自己手臂上。为了防止感染乙型肝炎，除正确处理伤口外，恰当的措施是注射","options":["A.丙种球蛋白","B.高效价乙肝免疫球蛋白","C.乙肝疫苗","D.乙肝疫苗+丙种球蛋白","E.乙肝表面抗体"],"answer":"B","explanation":"若护士给乙型肝炎病人采血发生针刺伤后，为了防止感染乙型肝炎，除正确处理伤口外，还应尽快注射高效价乙肝免疫球蛋白。"},{"n":948,"q":"病人男，40岁。患急性白血病。在治疗中，因血小板减少而致严重出血。最有效的止血方法是","options":["A.酚磺乙胺","B.维生素K","C.输新鲜血","D.糖皮质激素","E.输注浓缩血小板"],"answer":"E","explanation":"急性白血病，当血小板减少为10×10"},{"n":949,"q":"对于符合溶栓治疗条件，且无禁忌证的心肌梗死病人，溶栓治疗应力争","options":["A.在2小时内完成","B.在90分钟内完成","C.在1小时内完成","D.在30分钟内完成","E.在15分钟内完成"],"answer":"D","explanation":"符合溶栓治疗条件病人若无禁忌证，应立即（接诊后30分钟内）予以溶栓治疗。"},{"n":950,"q":"某ICU病房的护士多为年资较高、经验丰富的护士，护士长允许护士根据个人需要选择工作班次，再由护士长协调确定。这种排班方法是","options":["A.周期性排班法","B.自我排班法","C.功能制护理排班法","D.整体护理排班法","E.弹性排班法"],"answer":"B","explanation":"自我排班法是一种班次固定，由护士根据个人需要选择具体工作班次的方法，一般先由护士长确定排班规则，再由护士自行排班，最后由护士长协商确定。"},{"n":951,"q":"病人女，61岁，某高校教授。自去年退休后一直感觉睡眠状况不良。社区护士了解到其退休前每日睡眠时间在7小时左右，目前夜间睡眠时间减少、多梦、早醒，为弥补夜间睡眠的不足，每日下午睡眠2～3小时。社区护士对该女士的最佳睡眠指导是","options":["A.养成良好的睡眠习惯","B.创造适宜的睡眠环境","C.积极面对衰老和疾病","D.尽快适应角色转变","E.保持心理平衡"],"answer":"A","explanation":"病人退休后，日常体力和脑力劳动相应减少，睡眠时间也相应减少，一般老年人每日睡眠时间在6小时左右。根据题中描述，该女士下午睡眠时间过长，以致影响了夜间睡眠质量，午睡不应超过1个小时，故最佳睡眠指导应为养成良好的睡眠习惯。"},{"n":952,"q":"病人女，26岁。自然分娩后2个月，母乳喂养中。指导她适宜的避孕方法是","options":["A.宫内节育器","B.安全期避孕","C.口服避孕药","D.哺乳期间不避孕","E.避孕套"],"answer":"E","explanation":"阴茎套是哺乳期选用的最佳避孕方式。"},{"n":953,"q":"病人男，56岁。诊断为原发性肝癌。能早期发现此疾病的检查是","options":["A.活化凝血时间（ACT）","B.谷草转氨酶","C.超声","D.肝动脉血管造影","E.AFP"],"answer":"E","explanation":"原发性肝癌起病隐匿，肝癌早期发现肝癌的检查是AFP。"},{"n":954,"q":"病人女，36岁。甲亢术后24小时，出现烦躁不安，大汗。查体：体温39℃，脉搏120次/min。发生以上症状的主要原因是","options":["A.术后出血","B.感染","C.精神紧张","D.术前准备不充分","E.术中补液不够"],"answer":"D","explanation":"该病人发生了甲状腺危象。甲亢危象是甲状腺功能亢进症术后的严重并发症，多发生于术后12～36小时。发生多与术前准备不充分、甲亢症状未能很好控制及手术应激有关。"},{"n":955,"q":"病人女，35岁。活动后心慌、气短5年，有咯血史。心率110次/min。查体：双肺呼吸音清，心尖区听诊可闻及舒张期隆隆样杂音。心电图示心律绝对不齐，心房颤动。胸片示肺淤血。超声心动图示二尖瓣叶增厚，交界粘连，瓣下结构融合、挛缩。左心房可见血栓。当病人突然抽搐、偏瘫时应首先考虑","options":["A.心力衰竭加重","B.洋地黄中毒","C.低钾血症","D.脑栓塞","E.蛛网膜下腔出血"],"answer":"D","explanation":"风湿性心脏病二尖瓣狭窄病程长者可见心房颤动，由心电图可证实病人有心房颤动的发生。另外，超声心动图可见左心房血栓，心房颤动可导致局部血栓脱落进而引起脑血管栓塞而致偏瘫。"},{"n":956,"q":"初孕妇，26岁。妊娠32周。近期常感疲乏、无力、心悸，诊断为妊娠合并缺铁性贫血。下列处理措施正确的是","options":["A.中度不必做任何处理","B.服用铁剂应在餐前服用","C.少量、多次输入新鲜血，提高全血细胞","D.产程中可并不用吸氧","E.应尽量行剖宫产终止妊娠"],"answer":"C","explanation":"缺铁性贫血的治疗措施主要以支持疗法为主，如注意休息，改变偏食等不良饮食习惯，加强营养，必要时在餐后或餐时补充铁剂，对于重度贫血可以少量、多次输入新鲜血，提高全血细胞。分娩期尽量注意缩短第二产程，避免发生产伤。"},{"n":957,"q":"患儿女，13个月。发热2天，体温38～38.5℃，流涕，鼻塞，烦躁不安，食欲差，呕吐，伴有腹泻、腹痛，血液化验结果白细胞正常。该患儿的诊断为","options":["A.急性上呼吸道感染","B.急性支气管炎","C.小儿腹泻","D.急性感染性喉炎","E.肠套叠"],"answer":"A","explanation":"急性上呼吸道感染，婴幼儿局部症状轻而全身症状重；年长儿全身症状轻，局部症状重。①局部症状：流涕、鼻塞、打喷嚏、咳嗽、咽部不适和咽痛等。②全身症状：发热、畏寒、头痛、烦躁不安、拒奶、乏力等，可伴有呕吐、腹泻、腹痛，甚至热性惊厥。部分患儿发病早期可有脐周阵发性腹痛，无压痛，与发热所致肠痉挛或肠系膜淋巴结炎有关。"},{"n":958,"q":"病人男，72岁。有50年吸烟史，行食管癌切除术后，为防止发生肺部感染，以下措施中错误的是","options":["A.术前锻炼深呼吸、戒烟","B.术后雾化吸入","C.术后尽量卧床休息","D.鼓励病人深呼吸咳痰","E.应用祛痰药物"],"answer":"C","explanation":"术后卧床期间鼓励病人每小时重复做深呼吸5～10次，协助其翻身、叩背，促进气道内分泌物排出；教会病人保护切口和有效咳嗽、咳痰的方法；病情许可尽早下床活动；痰液黏稠者予以雾化吸入；遵医嘱应用抗生素及祛痰药物。"},{"n":959,"q":"患儿男，9个月。因化脓性脑膜炎入院，现患儿意识丧失，面色发绀，四肢肌张力增高。下列措施正确的是","options":["A.立即静脉滴注甘露醇","B.立即通知医生","C.立即清除口鼻分泌物，头偏向一侧","D.用力按压水沟穴","E.用力按压患儿四肢，防止受伤"],"answer":"C","explanation":"患儿发生惊厥，立即清除口鼻分泌物，头偏向一侧，防止窒息。"},{"n":960,"q":"护士小吴上班经常迟到，每次都是晚两三分钟。护士长决定找小吴谈谈，对小吴的这种行为给予批评教育。在训导过程中，小吴总是伺机岔开话题，护士长始终不受干扰，针对小吴的错误予以批评教育。护士长运用的训导技巧是","options":["A.以平等、客观、严肃的态度对待下属","B.控制讨论","C.具体指明问题所在","D.对事不对人","E.允许下属表达自己的看法"],"answer":"B","explanation":"实施训导时，违规者会利用一切机会为自己开脱或干扰训导。控制讨论是管理者对下属从自己角度出发为自己开脱时进行控制的方式。"},{"n":961,"q":"幼儿男，1岁。以“呕吐、喂养困难1个月，湿疹”入院。护理体检：体温36.8℃，血压80/55mmHg，心率124次/min，皮肤干燥，肤白，头发呈棕色，有鼠尿味，生长发育滞后，不能独自站立，诊断为苯丙酮尿症。其主要的护理措施是","options":["A.饮食控制","B.保持皮肤清洁","C.预防窒息","D.健康教育","E.预防感染"],"answer":"A","explanation":"低苯丙氨酸饮食为苯丙酮尿症的主要治疗手段。"},{"n":962,"q":"病人男，54岁。上消化道出血后面色苍白，口唇发红，呼吸急促，皮肤湿冷。下列病情监测指标错误的是","options":["A.生命体征","B.精神和意识状态","C.保持尿量20ml/h","D.监测水、电解质","E.准确记录出入量"],"answer":"C","explanation":"上消化道出血病人应准确记录出入量，疑有休克时，测每小时尿量，应保持尿量>30ml/h。"},{"n":963,"q":"一位因车祸导致多个脏器损伤的病人术后入住ICU，适宜采取的护理工作模式是","options":["A.个案护理","B.功能制护理","C.小组护理","D.责任制整体护理","E.综合护理"],"answer":"A","explanation":"个案护理也称为特别护理或专人护理，是一名护士负责一位患者全部护理内容的护理工作模式，主要用于ICU、冠心病监护治疗病房（CCU）及危重、大手术后的病人。"},{"n":964,"q":"患儿男，26个月。出生后即出现喂养困难，吸吮时气急、苍白。2年来10余次肺部感染。查体见生长发育落后。透视下可见“肺门舞蹈”征。心脏听诊表现为","options":["A.胸骨左缘第2～3肋间可闻及Ⅱ～Ⅲ级收缩期喷射性杂音","B.胸骨左缘第3～4肋间可闻及Ⅲ～Ⅳ级全收缩期杂音","C.心尖部可闻及舒张早中期高流量杂音","D.胸骨左缘第2～4肋间可闻及Ⅱ～Ⅳ级收缩期机器样杂音","E.胸骨左缘第2～3肋间可闻及Ⅱ～Ⅲ级舒张期杂音"],"answer":"A","explanation":"临床表现及透视下可见“肺门舞蹈”征，考虑患儿为房间隔缺损，因此听诊应是胸骨左缘第2～3肋间可闻及Ⅱ～Ⅲ级收缩期喷射性杂音。"},{"n":965,"q":"孕妇，40岁，G1P1。妊娠35周，胎膜早破24小时，拟行剖宫产术。最适宜的剖宫产术式是","options":["A.古典式剖宫产术","B.腹膜内剖宫产术","C.子宫下段剖宫产术","D.子宫体剖宫产术","E.腹膜外剖宫产术"],"answer":"E","explanation":"腹膜外剖宫产术可明显减少剖宫产术后腹腔感染的危险，尤其适用于宫腔有感染者或有潜在感染者。"},{"n":966,"q":"病人女，27岁。产后50天，诊断为产后抑郁，时常讲述疾病的痛苦。情志护理方法首选的是","options":["A.以情胜情法","B.移情易性法","C.顺情从欲法","D.说理开导法","E.释疑解惑法"],"answer":"C","explanation":"顺情从欲法是指顺从病人的意志、意愿、情绪，满足其心身的需要，以解除病人心理病因的一种情志护理方法。"},{"n":967,"q":"社区护士小刘，以社区居民的身份参加了本小区开展的戒烟宣传知识讲座，并在讲座结束后把自己的体验分享给活动的组织者。这属于的社区护理评估方法是","options":["A.挡风玻璃式调查","B.重点人物访谈","C.参与式观察","D.社区讨论","E.现场调查"],"answer":"C","explanation":"参与式观察是指社区护士以社区成员的角色直接参与社区活动，通过观察，了解居民目前的健康状况资料。"},{"n":968,"q":"某孕妇，妊娠39周入院待产。查体：宫缩规律，枕左前位，胎心率150次/min，宫口开大4cm。下列护理措施错误的是","options":["A.提供安静无刺激的环境","B.鼓励产妇每2～4小时排尿1次","C.每隔2小时听取胎心音1次","D.鼓励产妇吃高热量、易消化的食物","E.若宫缩不强且未破膜可在室内走动"],"answer":"C","explanation":"该产妇宫缩规律，宫口扩张到4cm，进入第一产程的活跃期，胎心音应每15～30分钟听1次，每次听诊1分钟。"},{"n":969,"q":"病人女，26岁。3年前自然分娩一男活婴，现在健康。此次为计划外妊娠，该病人及家属自愿终止妊娠。如果对该病人实行负压吸引术，适宜的妊娠周数是","options":["A.9周","B.12周","C.15周","D.18周","E.21周"],"answer":"A","explanation":"人工流产负压吸引术适于妊娠6～10周。"},{"n":970,"q":"病人男，32岁。因发热、腰痛5天，无尿2天，诊断为流行性出血热入院。入院后曾利尿，纠正酸中毒等治疗未见好转。目前烦躁不安，眼睑水肿，静脉充盈，颜面潮红，血压170/90mmHg，心率120次/min。下列处理错误的是","options":["A.进食含钾丰富的食物","B.严格控制入水量","C.输液速度要慢，应24小时均匀补给","D.可口服甘露醇导泻","E.补液量为前1日尿量和呕吐量加500～700ml"],"answer":"A","explanation":"病人发生了高血容量综合征，此时最容易发生离子紊乱，补钾需要慎重。"},{"n":971,"q":"足月孕妇，出现无痛性阴道出血，入院后应立即采取","options":["A.X线检查","B.放射性同位素扫描法","C.肛门检查","D.超声波定位胎盘","E.输液备血阴道检查"],"answer":"D","explanation":"妊娠晚期无痛性阴道出血是前置胎盘典型的表现，疑为前置胎盘者，应行超声波定位胎盘以确诊，禁止做肛门检查，慎做阴道检查。"},{"n":972,"q":"某孕妇，侧切产后1天，护士在给予会阴擦洗时，下列护理措施错误的是","options":["A.注意观察产妇阴道分泌物的性状、颜色及气味","B.会阴部有切口者注意切口愈合情况","C.留置导尿管者应擦净导尿管","D.最后擦洗的部位为会阴部切口","E.会阴切口感染者应最后擦洗切口处"],"answer":"D","explanation":"会阴侧切的病人，护士做会阴护理时应先擦洗侧切口。切口感染的病人例外。"},{"n":973,"q":"患儿，18个月。住院后烦躁不安，哭闹不止。对该患儿的护理措施不妥的是","options":["A.多和患儿接触","B.呼唤其乳名","C.尽量保持患儿住院前的生活习惯","D.立即从母亲怀中将患儿抱起","E.多给予抚摸、微笑"],"answer":"D","explanation":"婴幼儿住院后烦躁不安、哭闹不只是由于与母亲、抚育者及熟悉的环境分离导致的情绪反应，护士应循序渐进和患儿接触，呼唤其乳名，尽量保持患儿住院前的生活习惯，可以把患儿喜欢的玩具或其他物品摆放床旁，多给予抚摸、微笑等，立即从母亲怀中将患儿抱起可能增加患儿恐惧焦虑情绪。"},{"n":974,"q":"病人男，58岁。诊断为急性胰腺炎，血钙测定低于2.0mmol/L。常提示","options":["A.病情严重","B.发生四肢抽搐","C.腹部体征加重","D.呕吐严重","E.胃肠道吸收功能障碍"],"answer":"A","explanation":"急性胰腺炎出现血钙下降与脂肪组织坏死后释放的脂肪酸和钙离子结合，形成钙化斑有关。若血钙低于2.0mmol/L，常提示病情严重。"},{"n":975,"q":"病人女，55岁。因胆囊结石诱发急性胰腺炎入院。此时的处理原则是","options":["A.立即手术","B.做好术前准备后再手术","C.抗感染，对症处理","D.如非手术治疗不缓解，应早期手术治疗","E.中西医结合治疗"],"answer":"D","explanation":"胆源性胰腺炎的治疗原则是先采取非手术治疗减少胰腺的分泌，防止感染和病情向重症发展，非手术治疗不缓解，应考虑手术治疗。"},{"n":976,"q":"患儿男，胎龄30周。监护提示呼吸停止不到15秒，但心率减慢<100次/min，并出现发绀及肌张力减低。考虑为","options":["A.呼吸衰竭","B.呼吸暂停","C.呼吸窘迫","D.周期样呼吸","E.潮式呼吸"],"answer":"B","explanation":"患儿为早产儿，呼吸中枢发育不完善，容易发生呼吸暂停。该患儿呼吸停止虽不到15秒，但心率减慢"},{"n":977,"q":"患儿男，出生后10小时即出现周身重度黄疸。对其采取的护理措施正确的是","options":["A.立即予以灌肠，促进胆红素的排出","B.禁食、水，减轻消化道症状","C.遵医嘱予以镇静，保护脑细胞","D.立即予以换血疗法，防止胆红素脑病的发生","E.处理感染灶，保护肝脏"],"answer":"D","explanation":"患儿黄疸出现早、程度重，考虑为病理性黄疸，换血疗法是最快速、有效降低血清胆红素的方法，从而防止胆红素脑病的发生。"},{"n":978,"q":"病人女，78岁。高血压20年。参加家庭聚会时突然出现剧烈头痛、头晕、呕吐，进而意识障碍。血压210/110mmHg；CT显示高密度影。治疗需要立刻降压和镇静，下列药物禁用的是","options":["A.地西泮","B.甘露醇","C.尼莫地平","D.硝苯地平缓释片","E.吗啡"],"answer":"C","explanation":"尼莫地平为扩血管药物，脑出血病人使用易加重出血。"},{"n":979,"q":"3个月男婴，出生体重为3.3kg，现体格发育在正常范围内。母亲因呼吸道感染暂停母乳喂养，以牛乳喂养代替，牛乳中每100ml所含能量为98kcal。此男婴每日所需牛乳及水的总量分别为","options":["A.673ml；227ml","B.606ml；384ml","C.740ml；245ml","D.800ml；250ml","E.800ml；245ml"],"answer":"B","explanation":"3个月的婴儿，其体重约为出生时的2倍，即6.6kg，每日需要的总能量为90kcal/kg，需水量为150ml/kg，根据公式计算：所需牛乳量=[（6.6×90）/98]×100～606ml；所需水量=（6.6×150）-606ml=384ml。"},{"n":980,"q":"7个月女婴，体格发育正常，近期身体无任何不适，无感染。在辅食的添加中应注意","options":["A.乳牙已萌出，应及时添加碎末状食物","B.辅食逐渐转为婴儿营养的主要来源","C.可添加肉末和肝泥","D.可以尝试软饭、肉末、碎菜","E.可以添豆制品及整个鸡蛋"],"answer":"C","explanation":"该月龄婴儿乳牙已萌出，为了促进牙齿生长及锻炼咀嚼能力应及时添加末状食物，如粥、烂面等，并逐渐引入豆制品和动物性食物，如鱼、蛋类和肉类。乳类仍为此期婴儿营养的主要来源。"},{"n":981,"q":"病人女，20岁。因发热，鼻、咽痛1周入院，初步诊断为急性白血病。为确诊建议病人做的最有价值的辅助检查是","options":["A.血常规检查","B.血细菌培养","C.骨髓穿刺检查","D.网织红细胞计数","E.血小板抗体测定"],"answer":"C","explanation":"急性白血病病人骨髓象中，骨髓增生活跃，原始细胞占全部骨髓有核细胞的30%以上即可作出诊断。"},{"n":982,"q":"病人女，85岁。患风湿性心脏病、心力衰竭，用地高辛、氢氯噻嗪治疗过程中出现气促加重。心电图显示：室性期前收缩，二联律。下列治疗措施错误的是","options":["A.停用地高辛","B.补钾","C.加用利多卡因","D.加用呋塞米","E.停用氢氯噻嗪"],"answer":"D","explanation":"根据病人表现判断出现了洋地黄中毒，呋塞米为排钾利尿药，不应使用。"},{"n":983,"q":"护理部为了提高全体护理人员的技术操作水平，举办了护理技能大赛，奖励了获奖的护理人员，并在全院职工大会上通报表扬，以此来提升护理人员提高技能水平的自觉性。护理部这么做的理论依据是","options":["A.期望理论","B.需要层次理论","C.强化理论","D.归因理论","E.公平理论"],"answer":"C","explanation":"强化理论认为，人们为了达到某种目的，都会采取一定的行为，这种行为将作用于环境。行为结果对他有利时，这种行为就会重复出现。护理部举办技能大赛，并奖励和表扬了获奖的选手，是一种正强化。"},{"n":984,"q":"病人女，53岁。高血压病史6年，拟于全身麻醉下行乳腺癌扩大根治术。可不必做特殊准备的条件是如果术前血压低于","options":["A.190/110mmHg","B.180/110mmHg","C.180/100mmHg","D.160/100mmHg","E.140/90mmHg"],"answer":"D","explanation":"如果血压在160/100mmHg以下者可不做特殊准备。若血压高于180/100mmHg，术前应选用合适的降压药，使血压稳定在一定的水平，但不要求降至正常后才做手术。若原有高血压病史，在进入手术室时血压急骤升高者，应及时告知手术医师和麻醉医师，根据病情和手术性质决定。"},{"n":985,"q":"患儿，2岁。接种疫苗10分钟后出现面色苍白，四肢湿冷，脉搏细弱，呼吸困难，大小便失禁，神志不清。此时应采取最关键的措施是","options":["A.静脉注射1∶1000肾上腺素0.5～1ml","B.保暖","C.吸氧","D.平卧位","E.镇静"],"answer":"A","explanation":"患儿接种疫苗后很可能发生了过敏性休克，此时应采取最关键的措施是静脉注射1∶1 000肾上腺素0.5～1ml。"},{"n":986,"q":"护士告知痰液黏稠的慢性阻塞性肺疾病病人应注意多饮水，因为多饮水","options":["A.可减轻肺内感染","B.可加速炎性分泌物的排出","C.可减轻咳嗽","D.可使痰液稀释易于排出","E.可有效补充丢失的水分"],"answer":"D","explanation":"痰液黏稠病人多饮水可使痰液稀释易于排出。"},{"n":987,"q":"病人男，45岁。诊断为急性肾损伤。经过间断血液透析等治疗半个月余，现尿量增加为3 000～4 000ml/d。针对该病人应给予的护理措施是","options":["A.准确记录24小时出入液量","B.严格控制入水量","C.提高蛋白质的摄入量","D.增加活动量","E.可增加含钾食物的摄入"],"answer":"A","explanation":"急性肾损伤恢复早期，肾小球滤过功能尚未完全恢复，肾小管浓缩功能仍较差，因此不应进食大量高蛋白及高钾食物，同时应记录24小时出入液量，维持水平衡，此期仍需注意休息。"},{"n":988,"q":"患儿男，2岁。精神状态差，反应低下，肌张力低下，全身呈皮包骨样，腹部皮下脂肪厚度消失。该患儿属于营养不良","options":["A.Ⅰ度（轻度）","B.Ⅱ度（中度）","C.Ⅲ度（重度）","D.Ⅳ极重度","E.正常偏瘦"],"answer":"C","explanation":"Ⅲ度（重度）营养不良患儿的临床表现是精神状态萎靡、抑制与烦躁交替，肌张力低下、肌肉萎缩，腹部皮下脂肪厚度消失。"},{"n":989,"q":"病人男，69岁。诊断为左肺癌，行左肺上叶切除、纵隔淋巴结扩清术后第7天，出现支气管胸膜瘘。下列处理正确的是","options":["A.病人左侧卧位","B.禁食水","C.无须放置胸腔闭式引流管","D.怀疑有支气管胸膜瘘时，让病人口服亚甲蓝","E.呼吸机辅助通气"],"answer":"A","explanation":"支气管胸膜瘘宜取患侧卧位，故应取左侧卧位。"},{"n":990,"q":"某病人，30岁。停经2个月后阴道出血，检查后发现子宫表面有多个紫色结节，子宫软，尿hCG阳性。最有可能的诊断为","options":["A.葡萄胎","B.侵蚀性葡萄胎","C.子宫肌瘤","D.先兆流产","E.子宫颈"],"answer":"B","explanation":"侵蚀性葡萄胎子宫表面可发现多个紫色结节。"},{"n":991,"q":"病人男，70岁。呼吸机辅助通气3天，现出现呼吸不规则、急促，手足抽搐。血气分析：pH 7.50，PaO2 90mmHg，PaCO2 16mmHg。病人最可能出现了","options":["A.代谢性酸中毒","B.代谢性碱中毒","C.呼吸性酸中毒","D.呼吸性碱中毒","E.呼吸性碱中毒合并代谢性酸中毒"],"answer":"D","explanation":"由病人症状判断为呼吸性碱中毒，因过度换气时血中PaCO"},{"n":992,"q":"初产妇，29岁。临产13小时入院。产科检查：胎膜未破，S-3，宫口开大1cm，胎心率142次/min，规律。下列处置不妥的是","options":["A.继续待产","B.行骨盆内外测量","C.B超检查，判断胎儿大小","D.给予心理及饮食指导","E.立即给予缩宫素静脉滴注"],"answer":"E","explanation":"该产妇进入第一产程，现胎儿先露未入盆，产程进展无异常，无给予缩宫素用药指征，不应过早干预。"},{"n":993,"q":"患儿男，3岁。体温39.2℃，呼吸35次/min，咳嗽，痰液黏稠，诊断为支气管肺炎。该患儿不宜采用","options":["A.祛痰药","B.雾化吸入","C.镇咳药","D.体位引流","E.解热药"],"answer":"C","explanation":"婴幼儿一般不用镇咳药，多采用祛痰药或雾化吸入，配合体位引流排痰。"},{"n":994,"q":"病人女，20岁。因车祸入院，血压72/49mmHg，脉搏136次/min，中心静脉压4cmH2O。该病人首要的治疗措施是","options":["A.充分补液","B.适当补液","C.给予强心药","D.给予扩 function render(){let x=Q[idx];selected=null;$('q').textContent=(idx+1)+'. '+x.q;$('count').textContent=(idx+1)+' / '+Q.length;$('prog').style.width=((idx+1)/Q.length*100)+'%';$('opts').innerHTML='';x.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{$$('opts','.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');selected=o[0]};$('opts').appendChild(b)});$('answer').className='answer';$('reveal').textContent='翻牌查看答案';$('ans').textContent='正确答案：'+x.answer;$('exp').textContent=x.explanation?('解析：'+x.explanation):'';$('wrongBtn').textContent=wrong.has(x.n)?'错题 ★':'错题 ☆';$('wrongBtn').className=wrong.has(x.n)?'mini fav':'mini';$('status').textContent='进度已自动保存在本机';save()}
function $$(id,sel){return [...$(id).querySelectorAll(sel)]}

$('wrongBtn').onclick=()=>{let n=Q[idx].n;wrong.has(n)?wrong.delete(n):wrong.add(n);save();render()};$('prev').onclick=()=>{idx=(idx-1+Q.length)%Q.length;render()};$('next').onclick=()=>{idx=(idx+1)%Q.length;render()};$('random').onclick=()=>{idx=Math.floor(Math.random()*Q.length);render()};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');render();</script></body></html>

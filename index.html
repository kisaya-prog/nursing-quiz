const Q=[{"n":1,"q":"诊断脑震荡的主要依据是","options":["A.头皮擦伤痕","B.颅骨骨折","C.短暂昏迷和逆行性遗忘","D.颅底骨质凹陷","E.颅神经损伤"],"answer":"C","explanation":""},{"n":2,"q":"使用紫外线消毒的机制是","options":["A.改变细胞膜通透性","B.使菌体蛋白发生光解，变性，导致细菌死亡","C.破坏结构，使其失去转化能力","D.降低菌体内氧化酶的活性，使其丧失氧化能力","E.使空气中的氧电离产生臭氧"],"answer":"B","explanation":""},{"n":3,"q":"引起早产儿缺氧缺血性脑病脑损伤的常见部位是","options":["A.脑皮质","B.下丘脑","C.矢状窦旁区","D.脑室周围白质","E.小脑"],"answer":"D","explanation":""},{"n":4,"q":"甲亢病人最常见的心律失常是","options":["A.房性期前收缩","B.心房扑动","C.室上性心动过速","D.心室颤动","E.房室传导阻滞"],"answer":"A","explanation":""},{"n":5,"q":"晚期产后出血最常见于产后","options":["A.1～2周","B.5～6周","C.24小时","D.3～4周","E.2～3周"],"answer":"A","explanation":""},{"n":6,"q":"关于肺癌的病因，下列描述正确的是","options":["A.长纤维的石棉粉尘是肺癌的诱发因素","B.汽车尾气、工业废气是肺癌的危险因素","C.小剂量的电离辐射便可引起肺癌","D.高维生素A饮食者易患肺癌","E.肺部急性炎症一定程度上导致肺癌"],"answer":"B","explanation":""},{"n":7,"q":"妊娠合并心脏病不宜妊娠者","options":["A.应在妊娠12周前行人工流产术","B.应在妊娠14周前行人工流产术","C.应在妊娠16周前行人工流产术","D.应在妊娠18周前行人工流产术","E.可以怀孕直至分娩"],"answer":"A","explanation":""},{"n":8,"q":"下列选项不属于护士安全给药原则的是","options":["A.严格执行查对制度","B.根据医嘱准确给药","C.嘱病人根据情况自行用药","D.密切观察用药反应","E.按需进行过敏试验"],"answer":"C","explanation":""},{"n":9,"q":"轻度营养不良小儿体重低于正常均值的","options":["A.5%～10%","B.10%～15%","C.15%～25%","D.25%～40%","E.40％以上"],"answer":"C","explanation":""},{"n":10,"q":"腰椎穿刺后6小时让患者取去枕仰卧位的目的是","options":["A.防止颅内压增高","B.防止脑缺血","C.防止颅内压降低","D.预防颅内感染","E.有利于脑部血液循环"],"answer":"C","explanation":""},{"n":11,"q":"吉兰-巴雷综合征首发症状常为","options":["A.腱反射消失","B.四肢对称性无力","C.多汗，皮肤潮红","D.四肢感觉障碍","E.一侧肢体无力"],"answer":"B","explanation":""},{"n":12,"q":"肿瘤常见的局部临床表现不包括","options":["A.肿块","B.疼痛","C.溃疡","D.出血","E.贫血"],"answer":"E","explanation":""},{"n":13,"q":"手术后出现尿潴留，以下不宜作为首选措施的是","options":["A.针刺穴位","B.流水冲洗会阴部","C.导尿术","D.腹部热敷","E.变换排尿姿势"],"answer":"C","explanation":""},{"n":14,"q":"腹痛加剧，医嘱做粪便隐血试验，检查前3天能给患者食用的菜谱是","options":["A.卷心菜，五香牛肉","B.菠菜，红烧青鱼","C.茭白，炒鸡蛋","D.油豆腐，鸡血汤","E.青菜，炒鸡肝"],"answer":"C","explanation":""},{"n":15,"q":"下列不是卵巢肿瘤的发生因素的是","options":["A.遗传和家族因素","B.高胆固醇饮食","C.环境因素","D.内分泌因素","E.精神因素"]," r":"B","explanation":""},{"n":143,"q":"异位妊娠最主要的症状是","options":["A.短期停经史","B.早孕反应","C.腹痛","D.阴道不规则流血","E.晕厥"],"answer":"C","explanation":""},{"n":144,"q":"关于协议期临终病人的表现，下列描述错误的是","options":["A.病人的愤怒心理消退","B.病人很和善，配合治疗","C.病人有侥幸心理，希望是误诊","D.病人认为做善事可以死里逃生","E.病人开始接受自己临终的事实"],"answer":"C","explanation":""},{"n":145,"q":"过期妊娠是指妊娠时间超过","options":["A.40周","B.38周","C.45周","D.43周","E.42周"],"answer":"E","explanation":""},{"n":146,"q":"关于传染病的基本特征，下列描述不正确的是","options":["A.有病原体","B.有可控性","C.有传染性","D.有流行性、季节性、地方性","E.有感染后免疫性"],"answer":"B","explanation":""},{"n":147,"q":"观察瞳孔要全面观察并要注意","options":["A.瞳孔的形状","B.对称性","C.边缘","D.大小及对光反应","E.形状，对称性，边缘，大小及对光反应"],"answer":"E","explanation":""},{"n":148,"q":"病人日常活动时，既需要他人的帮助，也需要使用器械辅助，临床评估其机体的活动能力为","options":["A.5级","B.4级","C.3级","D.2级","E.1级"],"answer":"C","explanation":""},{"n":149,"q":"受卵巢激素影响，发生周期性改变的子宫组织结构是","options":["A.黏膜层","B.肌层","C.浆膜层","D.基底层","E.功能层"],"answer":"E","explanation":""},{"n":150,"q":"缓解急性心肌梗死疼痛最有效的药物是","options":["A.地西泮","B.硝酸甘油","C.吗啡","D.硝酸异山梨酯","E.阿司匹林"],"answer":"C","explanation":"缓解急性心肌梗死疼痛最有效的药物是吗啡。 吗啡不仅具有强大的镇痛作用，还可以减轻患者的焦虑和紧张情绪，同时能扩张外周血管，减少回心血量，减轻心脏负担。 地西泮主要用于镇静、抗焦虑、催眠等，对急性心肌梗死的疼痛缓解作用不明显。 硝酸甘油和硝酸异山梨酯主要用于缓解心绞痛，对心肌梗死疼痛有一定缓解作用，但效果不如吗啡显著。 阿司匹林在急性心肌梗死中主要起到抗血小板聚集的作用，防止血栓进一步形成，但不是缓解疼痛的首选药物。"},{"n":151,"q":"反复发作的短暂性脑缺血发作将会引发","options":["A.脑出血","B.脑梗死","C.脑栓塞","D.蛛网膜下腔出血","E.脑膜炎"],"answer":"B","explanation":""},{"n":152,"q":"关于子宫复旧，下列描述错误的是","options":["A.产后4周，宫颈完全恢复至非孕形态","B.产后2～3天，宫颈口可容两指","C.产后10天，子宫降至骨盆腔内","D.产后4周，子宫恢复至非孕期大小","E.产后1周，子宫重量约为500g"],"answer":"D","explanation":""},{"n":153,"q":"确诊乳腺肿块性质最可靠的方法是","options":["A.乳腺X线检查","B.近红外线扫描","C.乳腺B超","D.乳腺触诊","E.病理切片检查"],"answer":"E","explanation":""},{"n":154,"q":"体外循环术术后，病人尿量应维持在","options":["A.0.5ml/（kg？h）以上","B.1.0ml/（kg？h）以上","C.1.5ml/（kg？h）以上","D.2.0ml/（kg？h）以上","E.2.5ml/（kg？h）以上"],"answer":"B","explanation":""},{"n":155,"q":"下列关于影响人的成长与发育的因素的描述，错误的是","options":["A.学校是提供正规教育及社会化的场所","B.遗传因素是影响人类成长的重要因素","C.学校是人自出生后与其接触最多、关系最密切的一个环境","D.个体的成长与发展受宗教、文化、生活经验等因素 机制是以氨中毒学说为核心，氨吸收的主要部位是","options":["A.胃","B.十二指肠","C.结肠","D.直肠","E.小肠"],"answer":"C","explanation":""},{"n":171,"q":"下列属于中期终止妊娠的方法是","options":["A.人工流产负压吸引术","B.人工流产钳刮术","C.药物流产","D.水囊引产","E.绝育术"],"answer":"D","explanation":""},{"n":172,"q":"最常见的输血反应是","options":["A.发热反应","B.过敏反应","C.溶血反应","D.急性肺水肿","E.枸橼酸钠中毒反应"],"answer":"A","explanation":""},{"n":173,"q":"病人没有进入病人角色，不愿承认自己是病人，此种心理防御为","options":["A.角色行为冲突","B.角色行为强化","C.角色行为消退","D.角色行为缺如","E.角色行为减弱"],"answer":"D","explanation":""},{"n":174,"q":"帕金森病最常见的首发症状是","options":["A.静止性震颤","B.铅管样强直","C.齿轮样增强","D.慌张步态","E.小步态"],"answer":"A","explanation":"帕金森病最常见的首发症状是静止性震颤。 静止性震颤多始于一侧上肢远端，静止时出现或明显，随意运动时减轻或停止，紧张或激动时加剧，入睡后消失。 铅管样强直和齿轮样增强是帕金森病的肌强直表现，但一般不是首发症状。慌张步态是帕金森病的一种运动症状，也通常不是首发出现。"},{"n":175,"q":"关于早期肺癌的临床表现，下列描述不正确的是","options":["A.无症状","B.刺激性咳嗽","C.痰中带血","D.咳血丝痰","E.胸痛"],"answer":"E","explanation":"胸痛提示肿瘤侵犯胸膜，为晚期肺癌的临床表现。"},{"n":176,"q":"治疗缺铁性贫血最佳的食物组合是","options":["A.豆浆和大虾","B.橙汁和羊肝","C.碳酸饮料和肉排","D.绿茶和鸡肉","E.酸奶和鸡蛋"],"answer":"B","explanation":"动物类食品铁的吸收率较高；同时可服用维生素C、乳酸或稀盐酸等酸性药物或食物促进铁的吸收。"},{"n":177,"q":"关于有机磷中毒的护理措施，下列描述不正确的是","options":["A.保持呼吸道通畅","B.遵医嘱定时静脉注射阿托品","C.如病人烦躁不安、谵妄，给予吗啡镇静","D.密切观察呼吸困难、咳粉红色泡沫样痰等表现","E.清醒病人可给予半卧位"],"answer":"C","explanation":"有机磷中毒会导致呼吸困难，甚至肺水肿，因此禁用吗啡等抑制呼吸中枢的药物，以免加重呼吸困难，引起病人窒息。"},{"n":178,"q":"下列护理诊断中，属于首优问题的是","options":["A.体温过高","B.气体交换受损","C.有感染的危险","D.社交孤立","E.睡眠型态紊乱"],"answer":"B","explanation":"护理诊断中的首优问题是直接威胁病人生命、需要立即行动去解决的问题。"},{"n":179,"q":"关于手术人员外科手消毒，下列描述错误的是","options":["A.用流动水和洗手液清洗双手、前臂和上臂下1/3","B.清除或杀灭手臂暂居菌并减少常居菌","C.先消毒后洗手","D.不同病人手术之间，应重新进行外科手消毒","E.如手套破损，应重新进行外科手消毒"],"answer":"C","explanation":"外科手消毒的原则为先洗手后消毒。"},{"n":180,"q":"医疗事故的构成要件不包括","options":["A.责任主体是取得执业资格的医务人员","B.主观上存在故意","C.对病人造成人身损害","D.行为具有违法性","E.危害行为与危害结果存在因果关系"],"answer":"B","explanation":"医疗事故的构成要件之一为医务人员过失造成人身损害，即要求医疗事故必须是医务人员的过失行为所致，而非故意伤害病人，故选项B错误。"},{"n":181,"q":"儿科护士的角色不包括","options":["A.健康协调者","B.专业照护者","C.健康咨询者","D.医学教育者","E.护理研究者"],"answer":"D","explanation":"儿科护士的角色包括：专业照护者、护理计划者、健康教育者、健康协调者、健康咨询者、儿童及其家庭代言人、护理研究者。"},{"n":182,"q":"继发性腹膜炎的腹痛特点是","options":["A.阵发性全腹痛","B.逐渐加重的阵发性腹痛","C.剧烈持续性全腹痛，原发部位显著","D.高热后全腹痛","E.疼痛与进食有关"],"answer":"C","explanation":"腹痛是继发性腹膜炎最主要的临床表现，一般都很剧烈，为持续性，且难以忍受。腹压增加及变换体位时疼痛加剧。疼痛多自原发病变部位开始，随炎症扩散而波及全腹。"},{"n":183,"q":"书写护理诊断时，下列做法错误的是","options":["A.应使用统一的护理诊断名称","B.应包括生理、心理、社会等方面的问题","C.一个护理诊断可以针对多个健康问题","D.明确每一个护理诊断的相关因素，作为制订护理措施的依据","E.有关“知识缺乏”的诊断，陈述为“知识缺乏：缺乏……的知识”"],"answer":"C","explanation":"一个护理诊断只针对一个健康问题，故选项C错误。"},{"n":184,"q":"为阿米巴痢疾病人进行保留灌肠时，采取右侧卧位的目的是","options":["A.减轻药物的毒副作用","B.加速药物的吸收","C.可提高治疗效果","D.减少对病人的局部刺激","E.使病人感到舒适、安全"],"answer":"C","explanation":"阿米巴痢疾病变多在回盲部，故取右侧卧位，以提高疗效。"},{"n":185,"q":"关于颅底骨折，下列描述正确的是","options":["A.由直接暴力引起","B.一般视为内闭合性骨折","C.颅前窝底骨折导致“熊猫眼征”“眼镜征”","D.颅中窝底骨折导致第Ⅸ～Ⅻ对脑神经损伤","E.颅后窝底骨折可导致脑脊液鼻漏"],"answer":"C","explanation":"颅底骨折时易撕裂硬脑膜，产生脑脊液外漏而成为开放性脑损伤。"},{"n":186,"q":"关于一氧化碳中毒的护理措施，下列描述正确的是","options":["A.观察病人的脑水肿征象","B.迅速给予高流量吸氧","C.高热惊厥者静脉注射或肌内注射地西泮","D.给予病人平卧位","E.备好抢救物品，配合医生抢救"],"answer":"D","explanation":"对于一氧化碳中毒病人，应保持其呼吸道通畅，取平卧位，头偏向一侧，及时清除口咽分泌物及呕吐物。"},{"n":187,"q":"关于昏迷的护理措施，下列描述错误的是","options":["A.密切观察生命体征、昏迷程度、瞳孔变化","B.保持呼吸道通畅","C.对张口呼吸的病人，给予每天漱口","D.保持皮肤清洁，定时翻身，防止压力性损伤","E.给予鼻饲高蛋白、高维生素的流质饮食"],"answer":"C","explanation":"昏迷病人禁忌漱口，防止漱口水误入气道，引起病人呛咳、窒息。"},{"n":188,"q":"用于住院病人的营养筛查工具是","options":["A.NRS","B.MUST","C.MNA-SF","D.SGA","E.PG-SGA"],"answer":"A","explanation":"营养风险筛查工具（nutritional risk screening tool 2002，NRS 2002）适用于成年住院病人（18～90岁）的营养风险筛查。"},{"n":189,"q":"关于正常产褥期的临床表现，下列描述错误的是","options":["A.产妇体温多数在正常范围内","B.产妇脉搏在正常范围内，略缓慢","C.产妇由胸式呼吸变为腹式呼吸，呼吸浅而快","D.产妇体温可在24h内稍升高，不超过38℃","E.产妇血压平稳，在正常范围内"],"answer":"C","explanation":"产褥期妇女呼吸深而慢，频率为14～16次/min。"},{"n":190,"q":"下列选项可怀疑为胸腔内有活动性出血的是","options":["A.血压120/80mmHg","B.中心静脉压10cmH2O","C.尿量每小时约50ml","D.胸腔闭式引流每小时引出血性液>200ml，连续3小时","E.胸腔穿刺抽出不凝血"],"answer":"D","explanation":"胸腔内活动性出血征象包括：①脉搏逐渐增快，血压持续下降；②血压虽有短暂回升又迅速下降；③血红蛋白、红细胞计数、血细胞比容持续降低；④胸腔闭式引流血量≥200ml/h，持续2h以上；⑤胸腔穿刺抽血很快凝固，或因血凝固抽不出，且胸部X线示胸腔阴影继续增大。本题选项中，血压120/80mmHg，中心静脉压为10cmH"},{"n":191,"q":"留置胸腔闭式引流的病人，如引流管脱落，护士应","options":["A.立即给病人吸氧","B.立即报告医生","C.送手术室手术","D.双手捏紧留置引流导管皮肤处","E.将脱出的引流管重新插入"],"answer":"D","explanation":"胸腔闭式引流，若引流管从胸腔滑脱，应立即用手捏闭伤口处皮肤，消毒处理后用凡士林纱布封闭伤口。"},{"n":192,"q":"在疾病治疗过程中需预防多器官功能障碍综合征，下列处理措施错误的是","options":["A.在治疗过程中需严密监测各个脏器的功能","B.为预防休克需积极补充液体量","C.需充分纠正水、电解质、酸碱代谢失衡","D.积极治疗已出现的脏器功能衰竭","E.积极改善病人的呼吸功能"],"answer":"B","explanation":"对于休克病人，应积极进行快速和充分的液体复苏，改善微循环状况，防止组织细胞缺血缺氧。"},{"n":193,"q":"沟通的基本要素不包括","options":["A.沟通的触发体","B.信息发出者和信息接收者","C.信息影响者","D.信息","E.信息传递途径"],"answer":"C","explanation":"沟通的基本要素包括：沟通的触发体、信息发出者和信息接收者、信息、信息传递途径、反馈、人际变量、环境。"},{"n":194,"q":"小潮气量通气最常见的并发症是","options":["A.高碳酸血症","B.低碳酸血症","C.气胸","D.肺不张","E.呼吸机相关性肺炎"],"answer":"A","explanation":"小潮气量通气最常见的并发症是高碳酸血症，严重的高碳酸血症可抑制心肌收缩力，降低心脏和血管对儿茶酚胺等药物的反应性。"},{"n":195,"q":"关于水痘的治疗要点，下列描述正确的是","options":["A.所有患儿均需居家隔离治疗","B.无特效治疗药物，可给予支持治疗，预防继发感染","C.可使用激素缓解炎症反应","D.如皮肤瘙痒，可适当抓挠减轻痒感","E.可使用阿昔洛韦清除病毒"],"answer":"B","explanation":"水痘感染严重的患儿需到医院就诊以免延误病情；本病无特效治疗药物，可给予支持治疗，预防继发感染；不可使用激素，会导致病情加重；皮肤瘙痒不可搔抓，以免引起感染，水痘病毒全称为水痘-带状疱疹病毒，有时不会完全被清除，可引起潜伏性感染。"},{"n":196,"q":"关于泌尿道感染的临床表现，下列描述不正确的是","options":["A.新生儿的临床症状极不典型，多以全身症状为主","B.新生儿的泌尿道感染可致体重不增、皮肤苍白","C.婴幼儿的临床症状不典型，常以发热最突出，排尿时哭闹不安","D.年长儿的主要表现为腹痛不伴发热，同时尿路刺激征明显","E.泌尿道感染的临床表现因患儿年龄不同存在较大差异"],"answer":"D","explanation":"儿童泌尿道感染的表现与成人相似，部分小儿以遗尿为首发症状，上尿路感染常有发热、腹痛、肾区叩痛、遗尿等，下尿路感染有尿频、尿急、尿痛。"},{"n":197,"q":"关于影响冷热疗法的因素，下列描述错误的是","options":["A.在同样的温度条件下，湿冷、湿热的效果强于干冷、干热","B.冷热疗法的效果与应用面积大小有关","C.冷热疗法的效果随着时间的增加而增强","D.皮肤较薄的区域，冷热疗法的效果较好","E.女性比男性对冷热刺激更为敏感"],"answer":"C","explanation":"在一定时间内，冷热疗法的效应随着时间的增加而增强，以达到最大的治疗效果。如果时间过长，则会产生继发效应而抵消治疗效应，甚至引起不良反应。"},{"n":198,"q":"阴道后穹隆穿刺术的穿刺深度是","options":["A.1～2cm","B.2～3cm","C.3～4cm","D.4～5cm","E.5～6cm"],"answer":"B","explanation":"阴道后穹隆穿刺，于宫颈后唇与阴道后壁黏膜交界处下方平行宫颈管进针2～3cm，有落空感后开始抽吸。"},{"n":199,"q":"糖尿病病人的饮食中，碳水化合物占总热量的比例为","options":["A.20%～35%","B.35%～50%","C.50%～65%","D.65%～80%","E.80%～95%"],"answer":"C","explanation":"在确定糖尿病病人每日饮食总热量的基础上，碳水化合物占总热量的50%～65%，蛋白质占总热量的10%～20%，脂肪占总热量的20%～25%。"},{"n":200,"q":"按照弗洛伊德的性心理学说，察觉到性别差异，恋慕异性父母的阶段是","options":["A.口欲期","B.肛门期","C.性蕾期","D.潜伏期","E.生殖期"],"answer":"C","explanation":"性蕾期时，孩子最初的性情感是向双亲发展的，男孩通过恋母情结而更喜欢母亲，而女孩则通过恋父情结偏爱父亲。此期孩子对异性父母的认识有助于日后建立自己正确的道德观与良好的两性关系。"},{"n":201,"q":"下列关于疼痛的描述，正确的是","options":["A.婴幼儿对疼痛最敏感","B.随着年龄的增长，对疼痛的敏感性逐渐减弱","C.成年人比婴幼儿对疼痛的敏感性更强","D.老年人对疼痛的敏感性逐渐增加","E.年龄对疼痛没有影响"],"answer":"C","explanation":"婴幼儿对疼痛的敏感性不如成年人，随着年龄的增长对疼痛的敏感性逐渐增加，老年人对疼痛的敏感性逐渐下降。"},{"n":202,"q":"猩红热的首选治疗药物是","options":["A.青霉素","B.红霉素","C.链霉素","D.氯霉素","E.四环素"],"answer":"A","explanation":"猩红热的病原体是A组乙型溶血性链球菌，对青霉素和头孢菌素类抗生素敏感。"},{"n":203,"q":"关于新生儿肺透明膜病的临床表现，下列描述错误的是","options":["A.出生时可正常","B.在生后24小时内出现呼吸窘迫","C.呼气时呻吟","D.吸气时胸廓凹陷","E.呼吸困难进行性加重"],"answer":"B","explanation":"新生儿肺透明膜病，在生后6小时内出现呼吸窘迫。"},{"n":204,"q":"关于营养性巨幼细胞贫血的血涂片表现，下列描述正确的是","options":["A.红细胞减少较血红蛋白减少显著","B.血红蛋白减少较红细胞减少显著","C.红细胞中央淡染区扩大","D.呈小细胞低色素性贫血","E.网织红细胞百分比明显增高"],"answer":"A","explanation":"营养性巨幼细胞贫血，DNA合成障碍，造血细胞内DNA减少，使红细胞分裂延迟，细胞核发育落后于细胞质；红细胞胞体变大，形成巨幼红细胞，血红蛋白减少不显著；红细胞中央淡染区不明显，血涂片可见红细胞大小不等，以大细胞为主，网织红细胞、白细胞、血小板计数常减少。"},{"n":205,"q":"下列关于社区的描述，正确的是","options":["A.社区的人口数在5万～30万，面积在5","B.社区服务是社区为满足其成员物质生活需要而进行的社会性福利活动","C.不同的社区条件下，社区服务的具体内容和项目应相同","D.社区卫生服务以个体健康为中心，以个体为单位，以社区为范围","E.社区卫生服务以妇女、儿童、老年人、慢性病人和残疾人为重点"],"answer":"E","explanation":"社区的人口数在10万～30万，面积在5 000～50 000km"},{"n":206,"q":"新鲜血在4℃酸性枸橼酸盐葡萄糖保养液中，可保存的时间为","options":["A.4周","B.3周","C.2周","D.1周","E.5天"],"answer":"E","explanation":"2～6℃保存5天内的酸性枸橼酸盐葡萄糖（ACD）全血或保存10天内的枸橼酸盐磷酸盐葡萄糖（CPD）全血视为新鲜血。"},{"n":207,"q":"单纯母乳喂养婴儿肠道主要的细菌是","options":["A.嗜酸杆菌","B.肠球菌","C.大肠埃希菌","D.空肠弯曲菌","E.双歧杆菌"],"answer":"E","explanation":"肠道菌群受食物成分影响，单纯母乳喂养婴儿以双歧杆菌占绝对优势。故选E。"},{"n":208,"q":"下列选项是影响病人舒适的心理因素的是","options":["A.角色适应不良","B.缺乏支持系统","C.面对压力","D.陌生的环境","E.活动受限"],"answer":"C","explanation":"影响病人舒适的心理因素包括：焦虑与恐惧、自尊受损和面对压力。"},{"n":209,"q":"输液时静脉炎的发生原因，不包括","options":["A.输入高浓度药液","B.输入刺激性强的药液","C.输液导管长时间留置","D.输液管连接不紧密","E.输液时无菌操作不严格"],"answer":"D","explanation":"输液管连接不紧密是空气栓塞的发生原因。"},{"n":210,"q":"关于急性肾衰竭少尿期的治疗原则，下列描述不正确的是","options":["A.严格控制水和钠的入量","B.高分解状态或不能口服者可予静脉营养支持","C.纠正酸中毒及电解质紊乱","D.及时处理低钾血症","E.纠正酸中毒时注意防止低钙惊厥"],"answer":"D","explanation":"急性肾衰竭少尿期会出现电解质紊乱，常表现为“三高三低”，即高钾、高磷、高镁，低钠、低钙、低氯血症，其中高钾血症多见。"},{"n":211,"q":"治疗贫血的首要原则是","options":["A.心电监护","B.休息与吸氧","C.反复多次输血","D.及时补充造血物质","E.积极寻找并去除病因"],"answer":"E","explanation":"积极寻找并去除病因是根治贫血的最关键环节。"},{"n":212,"q":"关于提高妇女妊娠率的技巧，下列描述不正确的是","options":["A.戒烟、酒，注重营养","B.减轻压力，增强体质","C.性交后不要立即如厕","D.性交前、中、后使用阴道润滑剂","E.排卵期增加性交次数"],"answer":"D","explanation":"提高妊娠率的技巧包括：保持健康状态，如戒烟、酒，注重营养、减轻压力、增强体质；在性交前、中、后勿使用阴道润滑剂或进行阴道灌洗，不要在性交后立即如厕，而应卧床，并抬高臀部，持续20～30分钟，以使精子进入子宫颈；选择适当的日期性交，注意性交次数适当，可在排卵期增加性交次数。"},{"n":213,"q":"护理诊断的组成部分不包括","options":["A.名称","B.定义","C.诊断依据","D.相关因素","E.目标"],"answer":"E","explanation":"护理诊断由名称、定义、诊断依据、相关因素四部分组成。"},{"n":214,"q":"病人辨证属寒证，其服药温度应为","options":["A.温服","B.热服","C.常温服","D.冷服","E.不限制"],"answer":"B","explanation":"寒证宜热药热服，属“寒者热之”。"},{"n":215,"q":"正常学龄前儿童的24小时尿量是","options":["A.200～400ml","B.400～600ml","C.600～800ml","D.800～1","E.1"],"answer":"C","explanation":"正常婴儿的每日尿量400～500ml，幼儿为500～600ml，学龄前儿童为600～800ml，学龄儿童为800～1400ml。"},{"n":216,"q":"腰椎结核的特殊体征是","options":["A.压头试验阳性","B.“4”字试验阳性","C.拾物试验阳性","D.托马斯试验阳性","E.直腿抬高试验阳性"],"answer":"C","explanation":"压头试验阳性提示神经根型颈椎病；“4”字试验阳性和托马斯试验阳性提示髋关节结核；直腿抬高试验阳性提示腰椎间盘突出症。"},{"n":217,"q":"缺铁性贫血的特异性表现是","options":["A.牙龈出血","B.疲乏无力","C.皮肤紫癜","D.面色苍白","E.反甲及皮肤无光泽"],"answer":"E","explanation":"缺铁性贫血的特殊表现包括：①组织缺铁表现，如皮肤干燥、角化、萎缩、无光泽，毛发干枯易脱落，甚至出现反甲；②神经精神系统异常：儿童较明显，如过度兴奋、易激惹、好动、难以集中注意力、发暖、体力下降等；少数病人可有异食癖，如喜吃生米、冰块、泥土、石子等。"},{"n":218,"q":"关于前列腺摘除术术后出血的护理措施，下列描述最重要的是","options":["A.遵医嘱静脉滴注氨甲苯酸","B.遵医嘱在膀胱冲洗液中加入止血药","C.采用低温膀胱冲洗液","D.避免便秘和灌肠","E.气囊尿管应持续牵拉固定在一侧大腿内侧"],"answer":"E","explanation":"前列腺摘除术术后，利用三腔气囊尿管控制止血，将30～50ml生理盐水注入气囊内，将水囊放置在前列腺窝上方，将导尿管固定在大腿内侧并稍加牵引，须告知病人不可自行移开，直至解除牵引为止。"},{"n":219,"q":"排尿中断，伴尿频、尿急和终末尿痛，最可能的诊断是","options":["A.前列腺增生","B.尿道结石","C.膀胱肿瘤","D.膀胱结石","E.输尿管下端结石"],"answer":"D","explanation":"膀胱结石的临床表现主要是膀胱刺激症状，如尿频，尿急和排尿终末疼痛，典型症状是排尿突然中断。"},{"n":220,"q":"判断贫血严重程度的重要指标是","options":["A.血红蛋白","B.红细胞计数","C.白细胞计数","D.血小板计数","E.血细胞比容"],"answer":"A","explanation":"在贫血的诊断及其严重程度判断中，由于某些病理因素可引起红细胞的形态和体积异常，导致其数目的减少与血红蛋白浓度的下降不成比例，因此以血红蛋白浓度降低作为贫血的诊断及其严重程度判断的依据更为可靠。"},{"n":221,"q":"系统性红斑狼疮最典型的面部损害是","options":["A.湿疹","B.紫癜","C.色素沉着","D.蝶形红斑","E.网状红斑"],"answer":"D","explanation":"蝶形红斑是系统性红斑狼疮最具特征性的面部损害，约40%的病人可见。"},{"n":222,"q":"为慢性细菌性痢疾病人行保留灌肠时，应采取的卧位是","options":["A.右侧卧位","B.左侧卧位","C.俯卧位","D.仰卧位","E.膝胸卧位"],"answer":"B","explanation":"慢性细菌性痢疾，病变部位多在直肠或乙状结肠，故取左侧卧位。"},{"n":223,"q":"系统性红斑狼疮最主要的治疗药物是","options":["A.抗疟药","B.免疫抑制剂","C.免疫增强剂","D.非甾体抗炎药","E.糖皮质激素"],"answer":"E","explanation":"激素是系统性红斑狼疮的主要治疗药物。"},{"n":224,"q":"下列临床表现符合绞窄性肠梗阻的是","options":["A.持续性腹痛，并有压痛、反跳痛、肌紧张","B.腹胀明显，而呕吐相对较轻","C.阵发性剧烈腹痛，可见肠型","D.呕吐出现早且严重，腹胀轻","E.持续性胀痛，肠鸣音减弱"],"answer":"A","explanation":"绞窄性肠梗阻表现为腹痛间歇期缩短，呈持续性剧烈腹痛，呕吐物为血性或棕褐色液体，有腹膜刺激征。"},{"n":225,"q":"关于肾癌的护理措施，下列描述正确的是","options":["A.卧床休息3～5天","B.给予高热量、高脂饮食","C.进行化疗指导","D.感染是术后最主要的并发症","E.观察并记录24小时尿量"],"answer":"E","explanation":"肾癌行肾切除术病人，如术后6小时生命体征平稳，应指导病人床上活动；给予低脂饮食。出血是术后主要的并发症。肾癌术后病人无须化疗。"},{"n":226,"q":"关于静脉注射失败的原因分析，下列描述正确的是","options":["A.抽吸无回血，推注药液局部隆起、疼痛，可判断针头刺破对侧血管壁","B.抽吸有回血，推注药液局部隆起、疼痛，可判断针头未刺入血管","C.抽吸有回血，部分药液溢出至深层组织，可判断针头斜面部分在血管内，部分尚在皮下","D.抽吸有回血，推注药液局部隆起、疼痛，可判断针头斜面部分在血管内，部分尚在皮下","E.抽吸有回血，推注药液局部隆起、疼痛，可判断针头刺破对侧血管壁"],"answer":"D","explanation":"A选项可判断为针头未刺入血管内；B选项可判断为针头斜面未完全进入血管内；C选项可判断为针头刺破对侧血管壁；E选项同B选项。故选D。"},{"n":227,"q":"蜘蛛痣形成的原因是","options":["A.脾功能亢进","B.肠道吸收障碍","C.肝合成凝血因子减少","D.肝对雄激素的灭活功能减弱","E.肝对雌激素的灭活功能减弱"],"answer":"E","explanation":"肝掌和蜘蛛痣的形成主要是由于肝脏对雌激素的灭活功能减弱所致。"},{"n":228,"q":"关于糖皮质激素治疗支气管哮喘，下列描述正确的是","options":["A.是目前控制哮喘最有效的抗炎药物","B.主要通过增强气道变应性炎症以降低气道高反应性","C.吸入制剂通常需规律吸入3日以上方可起效","D.吸药后应注意漱口，防止口咽部支原体感染","E.重症哮喘病人使用吸入糖皮质激素应>2"],"answer":"A","explanation":"糖皮质激素是目前控制哮喘最有效的抗炎药物；主要通过抑制气道变应性炎症以降低气道高反应性；吸入制剂通常需规律吸入1周以上方可起效。吸药后应注意漱口，防止口咽部真菌感染；重症哮喘病人使用氢化可的松琥珀酸钠。"},{"n":229,"q":"关于术前的一般准备，下列描述正确的是","options":["A.女性月经来潮，及时通知医生，必要时延期手术","B.小手术前需配血、备血","C.消化道手术术前不限制饮食种类","D.肠道手术术前1天晚行清洁灌肠","E.进入手术室后，一般给予病人留置导尿"],"answer":"A","explanation":"大、中手术者，术前做好血型鉴定和交叉配血试验；一般手术者，术前不限制饮食种类；消化道手术者，术前1～2天进流质饮食；肠道手术者，术前1天和术日晨行清洁灌肠。预计手术4小时以上、下腹部或盆腔手术者，留置导尿。"},{"n":230,"q":"胎盘剥离后疑有胎盘滞留导致产后出血，首先应采取的护理措施是","options":["A.按摩腹部","B.给予子宫收缩药物","C.徒手剥离胎盘","D.协助产妇排空膀胱","E.牵拉脐带"],"answer":"D","explanation":"胎盘剥离后滞留，首先应采取的措施是排空膀胱。原因如下：膀胱充盈可影响子宫收缩，导致胎盘滞留和产后出血。先协助产妇排空膀胱，可促进子宫收缩，有助于解决胎盘滞留问题和减少出血。"},{"n":231,"q":"糖尿病最基本的治疗措施是","options":["A.运动治疗","B.饮食治疗","C.药物治疗","D.血糖监测","E.糖尿病教育"],"answer":"B","explanation":"饮食治疗是糖尿病最基本的治疗措施，始终贯穿在治疗过程中。"},{"n":232,"q":"下列医院消毒工作中，属于终末消毒的是","options":["A.对隔离病室每日一次清扫和消毒","B.接触传染病病人后进行手的消毒","C.对传染病病人每日用物进行消毒","D.对传染病病人用过的器械进行消毒","E.传染病病人出院后对隔离病室进行消毒"],"answer":"E","explanation":"终末消毒指传染源离开疫源地后进行的彻底的消毒。"},{"n":233,"q":"尿道损伤中下列情况必须手术治疗的是","options":["A.排尿困难","B.尿道滴血","C.疼痛","D.尿管插入困难","E.局部皮下淤血、肿胀"],"answer":"D","explanation":"尿道闭合性损伤应首先在严格无菌条件下试插导尿管，如试插成功，应留置尿管作为支架，以利于尿道的愈合，可暂不采取手术治疗，如无法插入，则需手术治疗。"},{"n":234,"q":"关于生长发育的规律，下列描述错误的是","options":["A.自上到下","B.由近到远","C.由细到粗","D.由简单到复杂","E.由低级到高级"],"answer":"C","explanation":"生长发育的顺序性：由上而下、由近到远、由粗到细、由简单到复杂、由低级到高级。"},{"n":235,"q":"下列选项有助于原发免疫性血小板减少症（ITP）临床分型的是","options":["A.年龄","B.病程长短","C.骨髓检查","D.出凝血时间","E.血常规检查"],"answer":"B","explanation":"根据病人病程的长短和血小板减少的严重程度等，可将ITP分为以下5种类型。①新诊断ITP：确诊后3个月内的ITP病人；②持续性ITP：确诊后3～12个月，血小板持续减少的ITP病人；③慢性TIP：血小板减少持续超过12个月的ITP病人；④重症ITP：血小板<10×10"},{"n":236,"q":"关于Beck三联征的表现，下列描述正确的是","options":["A.静脉压升高","B.心音亢进","C.心搏骤停","D.脉压大","E.动脉压升高"],"answer":"A","explanation":"体外循环术术后急性心脏压塞时可出现Beck三联征，其表现为静脉压升高，心音遥远、心搏微弱，脉压小、动脉压降低。"},{"n":237,"q":"关于化学消毒剂的使用方法，下列描述错误的是","options":["A.严格掌握消毒剂的消毒时间和浓度","B.消毒液中禁放纱布，避免降低消毒效力","C.物品应全部浸泡在消毒液中","D.消毒后的物品使用前用3%盐水冲净，以免消毒剂刺激组织","E.浸泡时要打开器械的轴节"],"answer":"D","explanation":"消毒后的物品在使用前用无菌生理盐水冲净，以免消毒剂刺激人体组织。"},{"n":238,"q":"关于连枷胸，下列描述正确的是","options":["A.多发生于多根单处肋骨骨折","B.吸气时，软化区胸壁向外鼓出","C.胸壁可因失去完整肋骨的支撑而软化，吸气时软化区胸壁外凸","D.如软化区范围广泛，可产生纵隔扑动","E.可用多头胸带固定胸壁"],"answer":"D","explanation":"多根多处肋骨骨折，特别是前侧局部胸壁可因失去完整肋骨的支撑而软化，产生反常呼吸运动，即吸气时软化区胸壁内陷，呼气时胸壁向外鼓出；若软化区范围广泛，在呼吸时两侧胸膜腔内压力不平衡，可使纵隔左右扑动。可采用牵引固定或厚棉垫加压包扎以消除或减轻反常呼吸运动。"},{"n":239,"q":"中心静脉压反映人体某部位的压力，该部位是","options":["A.左心室","B.右心室","C.左心房","D.右心房","E.肺静脉"],"answer":"D","explanation":"中心静脉压（CVP）的正常值为5～12cmH"},{"n":240,"q":"预防乳头皲裂，最主要的措施是","options":["A.哺乳前清洁乳头","B.哺乳后乳头涂鱼肝油","C.哺乳前热敷、按摩乳房","D.妊娠晚期开始捻搓、牵拉乳头","E.婴儿吸吮时含住乳头及大部分乳晕"],"answer":"E","explanation":"乳头皲裂最主要的原因是婴儿吸吮时含接乳头的方法不正确。正确的方法是含住乳头的同时，还要含住大部分乳晕。"},{"n":241,"q":"预防小儿结核病传播的根本措施是","options":["A.隔离结核分枝杆菌涂片阳性的患儿","B.早期发现并合理治疗结核分枝杆菌涂片阳性的患儿","C.卡介苗接种","D.口服异烟肼","E.加强结核病防治知识的宣传教育"],"answer":"B","explanation":"结核分枝杆菌涂片阳性的患儿是儿童结核病的主要传染源，早期发现、合理治疗结核分枝杆菌涂片阳性的患儿是预防儿童结核病传播的根本措施。"},{"n":242,"q":"骨髓炎治疗，应用抗生素的原则是","options":["A.根据细菌培养结果选择抗生素","B.早期足量联合应用抗生素","C.退热后尽早停药","D.退热后3周内停药","E.为预防产生耐药性，严格选择抗生素"],"answer":"B","explanation":"骨髓炎治疗早期足量联合应用抗生素治疗。如应用48～72小时无效，须手术治疗。选用的抗生素多为广谱抗生素，待细菌培养和药物敏感试验结果出来后调整为敏感抗生素，并持续应用至少3周。为巩固疗效，体温恢复正常后3周内不应停药。"},{"n":243,"q":"输血前查对的内容不包括","options":["A.病人姓名","B.病人住院号","C.病人年龄","D.血液种类","E.血液剂量"],"answer":"C","explanation":"输血前需做好“三查八对”；“三查”即查血的有效期、血的质量和输血装置是否完好；“八对”即对姓名、床号、住院号、血瓶（袋）号、血型、交叉配血试验结果、血液种类和剂量。"},{"n":244,"q":"下列溶液肝性脑病病人灌肠禁用的是","options":["A.酸性溶液","B.高渗盐水","C.低渗盐水","D.肥皂水","E.生理盐水"],"answer":"D","explanation":"肝性脑病病人禁用碱性溶液灌肠，以免增加氨的吸收，加重病情。"},{"n":245,"q":"关于新生儿的护理措施，下列描述错误的是","options":["A.新生儿室床与床之间的距离为1m","B.保持呼吸道通畅","C.保持体温稳定","D.预防感染","E.尽早哺乳即在生后1小时给予哺乳"],"answer":"E","explanation":"新生儿出生后30分钟内即可抱至母亲处给予吸吮，鼓励母亲按需哺乳。"},{"n":246,"q":"作为一名护理计划者，为促进儿童的身心健康发展，护士应","options":["A.与医生联络，讨论有关治疗和护理方案","B.全面评估儿童的健康状况，找出健康问题","C.评估有碍儿童健康的问题和事件，提供给医院行政部门改进","D.解释疾病治疗和护理过程，纠正其不良行为","E.解答患儿及其家长的问题，给予健康指导"],"answer":"B","explanation":"作为一名护理计划者，为促进儿童身心健康发展，护士必须运用专业的知识和技能，收集儿童生理、心理、社会状况等方面资料，全面评估儿童的健康状况以及儿童家庭在面临疾病和伤害时所产生的反应，找出健康问题，并根据儿童生长发育不同阶段的特点，制订系统全面的、切实可行的护理计划，采取有效的护理措施，以减轻儿童的痛苦，帮助儿童适应医院、社区、家庭的生活。"},{"n":247,"q":"关于被动性ROM练习，下列描述错误的是","options":["A.病人面向并尽量靠近操作者","B.活动时对比两侧关节活动情况","C.病人出现疼痛时，应继续缓慢进行锻炼","D.每个关节每次做5～10次完整的ROM练习","E.对各关节依次做屈曲、伸展、内收、内旋、外展、外旋等练习"],"answer":"C","explanation":"对病人进行被动性ROM练习时，如病人出现疼痛、痉挛、疲劳或抵抗反应，应停止操作。"},{"n":248,"q":"无菌包打开后的有效期是","options":["A.4小时","B.24小时","C.8小时","D.12小时","E.6小时"],"answer":"B","explanation":"无菌包打开后，包内剩余物品24小时内可以使用，如包内物品被污染或包布受潮，需重新灭菌。"},{"n":249,"q":"下列选项违反隔离原则的是","options":["A.穿隔离衣后不得进入治疗室","B.病人用过的物品不得放于清洁区","C.隔离单位应有醒目的标志","D.脚垫应用消毒剂浸泡","E.排泄物2次培养结果均为阴性，医生开出医嘱后，可解除隔离"],"answer":"E","explanation":"传染性分泌物3次培养结果均为阴性，医生开出医嘱后，方可解除隔离。"},{"n":250,"q":"下列不属于全身麻醉术后的并发症是","options":["A.心律失常","B.尿潴留","C.反流与误吸","D.高血压","E.高热惊厥"],"answer":"B","explanation":"全身麻醉术后的并发症有很多，像心律失常，可能是麻醉药物影响心脏电生理等原因导致；反流与误吸，麻醉后患者的吞咽、咳嗽反射减弱，胃内容物易反流误吸；高血压，可能和麻醉药物作用消失后机体应激反应等有关；高热惊厥，也可能在全身麻醉术后出现。而尿潴留更多是和椎管内麻醉（比如腰麻、硬膜外麻醉）后，支配膀胱的神经功能恢复较慢等因素相关，不属于全身麻醉术后的并发症，所以选 B。"},{"n":251,"q":"对于生育期异常子宫出血病程较长者，首选的止血措施是","options":["A.大量止血药","B.刮宫术","C.单纯雌激素","D.单纯孕激素","E.子宫全切术"],"answer":"B","explanation":""},{"n":252,"q":"在控制结核病流行的各项原则中，管理传染源的最好措施是","options":["A.接种卡介苗","B.做好结核病人的登记管理","C.加强消毒隔离卫生制度，禁止随地吐痰","D.有效化学药物治疗已患病者，特别是开放性病人","E.加强社区宣传，避免家庭接触传播"],"answer":"D","explanation":""},{"n":253,"q":"有关纤维胃镜的护理，错误的是","options":["A.术前向患者介绍检查方法","B.检查前禁食、禁药、禁烟12小时","C.检查前10～15分钟，用2%利多卡因咽部喷雾麻醉咽部","D.当胃镜通过咽部后嘱患者做吞咽动作","E.术后禁食水2小时，继而可进温凉流食或半流食"],"answer":"D","explanation":""},{"n":254,"q":"下列表现提示哮喘发作病情非常严重的是","options":["A.胸部腹胀感","B.哮鸣音减弱或消失","C.大汗淋漓","D.发绀","E.精神烦躁"],"answer":"B","explanation":""},{"n":255,"q":"头皮损伤皮下血肿的特点，正确的是","options":["A.血肿大","B.血肿局限","C.疼痛不明显","D.血肿张力不高","E.血肿中心硬，周边软"],"answer":"B","explanation":""},{"n":256,"q":"鼻饲患者输注营养液过程中，导管的护理不包括","options":["A.妥善固定","B.防止扭曲、受压","C.保持清洁无菌","D.定时冲洗","E.每天更换鼻饲管"],"answer":"E","explanation":""},{"n":257,"q":"下列属于临终护理的实质的是","options":["A.提高临终病人的生存时间，延缓疾病进展","B.积极治疗疾病，努力延长病人的生命","C.帮助临终病人顺利度过临终期","D.解决临终病人及家属的临终护理需求","E.为临终病人及家属提供全方位、立体化的社区卫生服务"],"answer":"E","explanation":""},{"n":258,"q":"下列选项既是内分泌腺，又是外分泌腺的是","options":["A.胃","B.胰腺","C.大肠","D.肝脏","E.小肠"],"answer":"B","explanation":""},{"n":259,"q":"下壁心肌梗死容易发生的心律失常类型为","options":["A.窦性心动过速","B.室性期前收缩","C.房性期前收缩","D.房室传导阻滞","E.心房扑动"],"answer":"D","explanation":""},{"n":260,"q":"关于外阴鳞状细胞癌的说法，下列正确的是","options":["A.是最常见的外阴恶性肿瘤","B.主要发生于育龄期妇女","C.与HPV感染和吸烟无关","D.以血行转移为主","E.确诊主要依靠影像学检查"],"answer":"A","explanation":""},{"n":261,"q":"下列离子紊乱可造成体液渗透压下降、脱水或血容量不足的是","options":["A.高钾","B.低钾","C.高钠","D.低钠","E.低钙"],"answer":"D","explanation":""},{"n":262,"q":"妊娠末期，孕妇若长时间取仰卧位姿势，则易发生","options":["A.妊娠期高血压疾病","B.前置胎盘","C.胎膜早破","D.仰卧位低血压综合征","E.胎儿脐带绕颈"],"answer":"D","explanation":""},{"n":263,"q":"幼儿哮喘的重要诱发因素是","options":["A.食物过敏","B.药物过敏","C.呼吸道细菌感染","D.呼吸道病毒感染","E.寒冷刺激"],"answer":"D","explanation":""},{"n":264,"q":"区分五脏、六腑的最主要依据是","options":["A.位置","B.形态","C.功能特点","D.阴阳属性","E.表里联络"],"answer":"C","explanation":""},{"n":265,"q":"下列与溃疡性结肠炎发病无关的是","options":["A.免疫失衡","B.遗传因素","C.化学药物","D.肠道微生物","E.环境因素"],"answer":"C","explanation":""},{"n":266,"q":"下列均为急性脓胸的临床表现，除了","options":["A.发热","B.患侧胸腔积液","C.血液白细胞计数增高","D.患侧胸廓萎陷","E.胸腔穿刺可抽到脓液"],"answer":"D","explanation":""},{"n":267,"q":"对于已确诊为腹腔脏器损伤行非手术治疗的患者，以下均为转行手术探查的指征，除了","options":["A.腹部透视，发现胃泡明显扩大","B.腹痛和腹膜刺激征进行性加重","C.肠鸣音逐渐减弱、消失","D.全身情况恶化","E.血压有继续下降趋势"],"answer":"A","explanation":""},{"n":268,"q":"下列有关医院感染患病率的说法，正确的是","options":["A.常用于表示短时间和小范围内感染的暴发或流行情况","B.是一定时间和一定人群中新发生的医院感染的频率","C.患病率调查可完整、准确地呈现医院感染的基本情况","D.患病率调查强调实查率，要求实查率达到70%","E.根据观察时间，可分为时点患病率和期间患病率"],"answer":"E","explanation":""},{"n":269,"q":"骨肉瘤患者最常见的肿瘤转移部位是","options":["A.肺","B.肝","C.脑","D.肾","E.胰腺"],"answer":"A","explanation":"骨肉瘤是最常见的原发性恶性骨肿瘤。多见于10～20岁青少年，40岁以上发病多为继发性。男性发病率高于女性。好发于四肢长骨干骺端，如股骨远端、胫骨近端和肱骨近端的干骺端。切面呈多彩状。瘤体一般呈梭形，恶性程度高，预后差，易发生肺转移。截肢后3年生存率不高"},{"n":270,"q":"脑出血最常见的病因为","options":["A.高血压合并细小动脉硬化","B.脑动脉炎","C.梗死后出血","D.脑淀粉样血管病变","E.脑动脉粥样硬化"],"answer":"A","explanation":""},{"n":271,"q":"某孕妇，29岁，孕29周。产前检查正常，咨询自我监护胎儿的方法。正确的指导是","options":["A.自测宫高","B.自测腹围","C.自数胎动","D.胎教","E.胎儿电子监护"],"answer":"C","explanation":""},{"n":272,"q":"协调的作用有","options":["A.目标导向","B.勤于沟通","C.利益一致","D.整体优化","E.调动员工积极性"],"answer":"E","explanation":""},{"n":273,"q":"关于管理社会属性的描述，下列正确的是","options":["A.管理具有普遍性","B.管理具有共性","C.管理具有特殊性","D.管理具有艺术性","E.管理具有目的性"],"answer":"C","explanation":""},{"n":274,"q":"泌尿系统结核 "},{"n":383,"q":"阴道无痛性持续性漏尿，多见于","options":["A.产后或盆腔手术后","B.产道软组织受压所致的坏死型尿瘘","C.放射性损伤所致的尿瘘","D.手术直接损伤","E.膀胱子宫阴道瘘"],"answer":"A","explanation":""},{"n":384,"q":"肾病综合征患儿用激素治疗减量阶段的饮食宜选取","options":["A.高蛋白","B.高纤维素","C.高脂","D.低钾","E.低钙"],"answer":"A","explanation":""},{"n":385,"q":"影响护理人员编设的社会因素是","options":["A.床位数、床位周转率","B.护理人员的技术水平","C.医护人员数量比例","D.医院的自动化设备使用情况","E.病人的经济状况"],"answer":"E","explanation":""},{"n":386,"q":"孕妇末次月经第1日是公历2020年8月2日，则其预产期是","options":["A.2021年5月9日","B.2021年5月17日","C.2021年6月9日","D.2021年6月2日","E.2021年6月10日"],"answer":"A","explanation":""},{"n":387,"q":"阴阳中阴的特点描述正确的是","options":["A.温暖的","B.明亮的","C.无形的","D.抑制的","E.运动的"],"answer":"D","explanation":""},{"n":388,"q":"下列肋骨骨折病理生理变化正确的是","options":["A.多根多处肋骨骨折时，吸气时软化区胸壁外突","B.对呼吸功能影响小","C.不会引起血流动力学改变","D.对呼吸功能影响不大","E.若软化区范围广泛，可出现纵隔扑动"],"answer":"E","explanation":""},{"n":389,"q":"关于慢性化脓性骨髓炎的叙述，正确的是","options":["A.患肢肌肉萎缩变形","B.纤维包壳形成","C.术前患肢平放制动","D.死腔内有坏死的肉芽组织","E.以大剂量抗生素治疗为主"],"answer":"D","explanation":""},{"n":390,"q":"关于社区急救的基本原则，下列叙述正确的是","options":["A.先施救后排险","B.先固定后复苏","C.先运送后施救","D.急救重于呼救","E.转送与监护急救相结合"],"answer":"E","explanation":""},{"n":391,"q":"预防破伤风最可靠的方法是","options":["A.应用抗生素","B.彻底清除坏死组织和异物","C.注射破伤风类毒素","D.10%水合氯醛口服或灌肠","E.补充营养"],"answer":"C","explanation":""},{"n":392,"q":"肾结核的主要传播途径是","options":["A.呼吸道","B.消化道","C.血液循环","D.淋巴循环","E.接触传播"],"answer":"C","explanation":""},{"n":393,"q":"对于嵌顿性斜疝患者，如果不采取紧急手术，在保守治疗病情观察过程中，最可能发生","options":["A.腹腔脓肿","B.肠梗阻或肠穿孔","C.脓毒血症","D.水、电解质紊乱","E.休克甚至死亡"],"answer":"E","explanation":"嵌顿性斜疝若不及时手术，疝内容物（多为肠管等）会因受压而发生血运障碍，进而出现缺血坏死。随着病情进展，会引发严重的感染、毒素吸收等情况，最终可能导致休克，甚至死亡。而肠梗阻或肠穿孔（B 选项）、腹腔脓肿（A 选项）、脓毒血症（C 选项）、水和电解质紊乱（D 选项）虽然也可能发生，但休克甚至死亡是最严重、最可能出现的后果。"},{"n":394,"q":"关于伤寒杆菌的说法，下列不正确的是","options":["A.伤寒杆菌属沙门菌属","B.革兰氏染色阳性","C.在含胆汁的培养基中生长良好","D.产生的内毒素是致病的主要因素","E.对热及一般消毒剂敏感"],"answer":"B","explanation":""},{"n":395,"q":"急性血源性骨髓炎除制动外，局部治疗的一个重要措施是","options":["A.穿刺抽脓","B.穿刺抽脓注入抗生素","C.开窗引流术","D.外敷药物","E.理疗"],"answer":"C","explanation":""},{"n":396,"q":"下列不属于洋地黄中毒的处理方法是","options":["A.立即停用洋地黄","B.低钾者补充钾盐","C.停用利尿药","D.纠正心律失常","E.口服普萘洛尔"],"answer":"E","explanation":""},{"n":397,"q":"病人呕吐，护理诊断为有体液不足的危险。下列关于体液不足的危险的护理措施不正确的是","options":["A.测量生命体征","B.准确测量和记录每天出入量","C.观察病人有无失水现象","D.观察病人呕吐特点，记录呕吐次数，呕吐物的性质、量和颜色","E.给予口服补液时，应少次少量饮用，以免引起恶心、呕吐"],"answer":"E","explanation":""},{"n":398,"q":"生化检查对诊断病毒型心肌炎最特异性的是","options":["A.心肌同工酶","B.乳酸脱氢酶同工酶","C.心肌肌钙蛋白T","D.肌红蛋白","E.磷酸激酶"],"answer":"C","explanation":""},{"n":399,"q":"胎产式是指","options":["A.胎儿先露部指示点与母体骨盆的关系","B.胎体纵轴与母体纵轴之间的关系","C.胎体横轴与母体纵轴之间的关系","D.最先进入骨盆的胎儿部分","E.胎儿进入骨盆时的姿势"],"answer":"B","explanation":"胎产式指胎体纵轴与母体纵轴的关系。胎体纵轴与母体纵轴平行者，称为纵产式，占足月妊娠分娩总数的99.75%；胎体纵轴与母体纵轴垂直者，称为横产式，仅占足月分娩总数的0.25%；胎体纵轴与母体纵轴交叉者，称为斜产式。"},{"n":400,"q":"十二指肠消化性溃疡形成的原因是","options":["A.防御因素削弱","B.侵袭因素增强","C.胃酸分泌过多","D.胃酸分泌不足","E.十二指肠动力不足"],"answer":"B","explanation":""},{"n":401,"q":"以完成工作任务为目标，护士长按照护理工作内容分配护理人员的临床护理工作模式是","options":["A.个案护理","B.功能制护理","C.小组护理","D.责任制护理","E.综合护理"],"answer":"B","explanation":""},{"n":402,"q":"原发性生长激素缺乏症的患儿出现临床症状的年龄多在","options":["A.出生时","B.1岁以后","C.2岁以后","D.3岁以后","E.4岁以后"],"answer":"B","explanation":""},{"n":403,"q":"治疗一氧化碳中毒最有效的方法是","options":["A.利尿","B.氧疗","C.降低脑代谢","D.促进脑细胞功能恢复","E.保持呼吸道通畅"],"answer":"B","explanation":""},{"n":404,"q":"社区护士对2～3岁幼儿进行定期健康检查的时间是","options":["A.每个月1次","B.每季度1次","C.每半年1次","D.每年1次","E.每2年1次"],"answer":"C","explanation":""},{"n":405,"q":"护士指导孕妇行羊水穿刺进行染色体检查的最佳时间是","options":["A.12～16周","B.13～18周","C.14～20周","D.20～24周","E.20～28周"],"answer":"C","explanation":""},{"n":406,"q":"子宫内膜异位症最典型的症状是","options":["A.月经增多或经期延长","B.肛门坠胀","C.性交痛","D.不孕","E.继发性进行性痛经"],"answer":"E","explanation":""},{"n":407,"q":"对伤寒腹胀患者的护理，正确的是","options":["A.绝对卧床休息","B.可进食糖类饮食","C.可进食少量牛奶","D.适量使用新斯的明","E.用松节油热敷腹部"],"answer":"E","explanation":""},{"n":408,"q":"应用胸腔闭式引流时患者应取的卧位是","options":["A.头低足高位","B.平卧位","C.低坡卧位","D.侧卧位","E.半卧位"],"answer":"E","explanation":""},{"n":409,"q":"唯一能促进能量储存的激素是","options":["A.胰岛素","B.胰高糖素","C.肾上腺素","D.去甲肾上腺素","E.皮质醇"],"answer":"A","explanation":""},{"n":410,"q":"急性排斥反应多出现在移植后的","options":["A.24小时内","B.2～5日","C.5日～6个月","D.6个月～12个月","E.1～2年"],"answer":"C","explanation":""},{"n":411,"q":"倾倒综合征常发生于","options":["A.左半结肠切除术后","B.横结肠切除术后","C.右半结肠切除术后","D.胃大部切除术后","E.乙状结肠切除术后"],"answer":"D","explanation":""},{"n":412,"q":"胰腺癌病人预后较差的原因是","options":["A.早期症状不明显，发现和确诊晚","B.肿瘤细胞周围浸润","C.胰、十二指肠切除时间长，对病人创伤较大","D.病人消化不良，营养状况差","E.黄疸对肝功能影响大"],"answer":"A","explanation":""},{"n":413,"q":"阵发性室性心动过速最常见于","options":["A.健康人","B.风湿性心脏病","C.高血压心脏病","D.急性心肌梗死","E.甲状腺功能亢进性心脏病"],"answer":"D","explanation":""},{"n":414,"q":"引起外源性产褥感染的主要病原菌是","options":["A.大肠埃希菌","B.金黄色葡萄球菌","C.链球菌","D.假丝酵母菌","E.支原体"],"answer":"C","explanation":""},{"n":415,"q":"下列子宫复旧的相关描述，错误的是","options":["A.产后第1天子宫底平脐，以后每日下降1～2cm","B.产后10天，子宫降至骨盆腔内","C.产后2周，子宫重量约300g","D.产后3周，子宫颈完全恢复正常状态","E.产后6周子宫恢复到正常未孕期大小"],"answer":"D","explanation":""},{"n":416,"q":"布散于体表，渗入血脉之内起滋润作用的是 （ ）","options":["A.气","B.水","C.精","D.津","E.液"],"answer":"D","explanation":"“津”和“液”都是机体一切正常水液的总称，但其质地、分布、功能各有不同。“津”质地清稀，流动性较大，主要分布在体表皮肤、肌肉、孔窍，渗入血脉之内，起滋润作用；相对而言，“液”质地浓稠，流动性较小，主要分布在骨节、脏腑、脑髓等，起濡养作用。中医学中“水”的概念一般是指病理之水；“精”是人体的精华物质，主要分布在脏腑中。"},{"n":417,"q":"系统性红斑狼疮急性期药物治疗首选","options":["A.青霉素","B.泼尼松","C.布洛芬","D.硫唑嘌呤","E.环磷酰胺"],"answer":"B","explanation":""},{"n":418,"q":"下列属于健康教育过程评价的内容是","options":["A.用何种方法了解目标人群的特征","B.项目涉及哪些组织","C.各组织间有无沟通","D.如何建立信息反馈机制","E.项目执行所处环境的好坏"],"answer":"B","explanation":""},{"n":419,"q":"与1型糖尿病的发病因素有关的是","options":["A.遗传","B.劳累","C.年龄","D.情绪","E.营养不良"],"answer":"A","explanation":""},{"n":420,"q":"便秘是指排便困难，大便干结，1周内排便次数少于","options":["A.1次","B.2次","C.3次","D.4次","E.5次"],"answer":"C","explanation":""},{"n":421,"q":"防止精神分裂症复发的重要措施是","options":["A.坚持服药","B.营养充足","C.居住环境安静","D.有家属的照顾","E.使患者心情愉快"],"answer":"A","explanation":""},{"n":422,"q":"语言性健康教育不包括","options":["A.交谈","B.健康咨询","C.小组讨论","D.同伴教育","E.卫生专栏"],"answer":"E","explanation":""},{"n":423,"q":"下列属于区别急、慢性白血病的主要内容是","options":["A.贫血程度","B.出血程度","C.病程长短","D.白血病细胞数量","E.白血病细胞分化程度"],"answer":"E","explanation":""},{"n":424,"q":"胃癌的转移扩散途径不包括","options":["A.直接浸润","B.淋巴转移","C.血行转移","D.腹腔种植转移","E.胸腔种植转移"],"answer":"E","explanation":""},{"n":425,"q":"下列属于肺结核的一般症状是","options":["A.起病急骤","B.午后高热","C.体重减轻","D.2/3的病人有咯血","E.突发性呼吸困难"],"answer":"C","explanation":"肺结核的一般症状：起病缓慢，午后低热；体重减轻；1/3的病人有咯血；重症病人可有突发性呼吸困难。"},{"n":426,"q":"以下只能通过主观资料来评估患者疼痛的是","options":["A.疼痛的强度","B.患者说话语速","C.生命体征","D.睡眠状态","E.面部表情"],"answer":"A","explanation":""},{"n":427,"q":"下列不属于过敏性紫癜的主要临床表现的是","options":["A.皮肤紫癜","B.关节肿痛","C.腹痛及便血","D.血尿及蛋白尿","E.舞蹈病"],"answer":"E","explanation":"过敏性紫癜的主要临床表现：皮肤紫癜常为首发症状；胃肠道症状，一般以阵发性剧烈腹痛为主；关节症状，可出现大关节肿痛和活动受限；肾脏症状，多数患儿出现血尿、蛋白尿及管型尿。"},{"n":428,"q":"下列症状不适合使用灸法治疗的是","options":["A.实热","B.虚寒性胃痛","C.虚寒性泄泻","D.风寒湿痹","E.月经不调"],"answer":"A","explanation":"灸法的适应证及禁忌证：灸法常用于各种虚寒性病证，如胃脘痛、泄泻、风寒湿痹、疮疡久溃不敛、月经不调等。但凡属实热、阴虚阳亢、邪热内炽引起的发热、咳嗽等均不宜施灸。"},{"n":429,"q":"第1腰椎骨折可造成脊髓圆锥损伤，其临床表现不正确的是","options":["A.会阴部皮肤鞍状感觉缺失","B.大小便能控制","C.性功能障碍","D.括约肌功能丧失","E.双下肢感觉正常"],"answer":"B","explanation":"成人脊髓终止于第1腰椎椎体的下缘，第1腰椎骨折可损伤脊髓圆锥，表现为会阴部皮肤鞍状感觉消失、括约肌功能丧失导致大小便不能控制及性功能障碍，而双下肢的感觉及运动功能正常。"},{"n":430,"q":"列入乙类传染病，但按甲类传染病管理的是","options":["A.严重急性呼吸综合征（传染性非典型肺炎，SARS）","B.霍乱","C.肾综合征出血热","D.手足口病","E.登革热"],"answer":"A","explanation":"目前，对乙类传染病中SARS、炭疽中的肺炭疽采取甲类传染病的预防、控制措施。"},{"n":431,"q":"以下不属于婴儿腹泻病的非感染因素是","options":["A.侵袭性肠炎","B.受凉","C.过敏","D.喂养不当","E.乳糖酶缺乏"],"answer":"A","explanation":"引起婴儿腹泻病的非感染因素包括喂养不当、过敏因素、乳糖酶缺乏、气候因素，而侵袭性肠炎属于感染因素。"},{"n":432,"q":"下列不属于帕金森病的病因及发病机制的是","options":["A.随着年龄增长，黑质细胞多巴胺能神经元变性丢失","B.乙酰胆碱的兴奋性相对增强，出现震颤、麻痹症状","C.调查显示本病与工业和农业的毒素有关","D.有家族聚集现象，提示本病与遗传因素有关","E.主要见于青壮年人群，提示本病与免疫反应有关"],"answer":"E","explanation":"帕金森病主要见于中老年人，随着年龄增长，黑质细胞和纹状体中多巴胺受体减少。"},{"n":433,"q":"经中心静脉导管进行肠外营养1周的病人，出现高热、寒战，最可能的并发症是","options":["A.导管败血症","B.空气栓塞","C.血栓性静脉炎","D.肠源性感染","E.肝胆系统损伤"],"answer":"A","explanation":"肠外营养输注过程中可能出现高热，原因可能是营养液产热，也可能是营养物的过敏，还可能是导管感染，需查明原因予以处理。分析题中5个选项，导管败血症是最可能发生的并发症。"},{"n":434,"q":"对急性中毒患儿行催吐，一般在","options":["A.中毒后4～6小时","B.中毒后2小时内","C.中毒后2～4小时","D.中毒后6～8小时","E.中毒后8小时内"],"answer":"A","explanation":"对急性中毒患儿行催吐，一般在中毒后4～6小时进行，适用于神志清，年龄较大且合作者。"},{"n":435,"q":"下列不属于肾移植术后排斥反应临床表现的是","options":["A.体温升高","B.移植肾区自觉肿胀","C.血压升高","D.尿量>4","E.B超发现移植肾明显肿大"],"answer":"D","explanation":"肾移植术后急性排斥反应的表现为体温突然升高且持续高热，伴有血压升高、尿量减少，血清肌酐上升，移植肾区闷胀感、压痛等。"},{"n":436,"q":"下列不属于继发性气胸的常见病因是","options":["A.肺结核","B.肺癌","C.肺大疱","D.COPD","E.用力咳嗽、屏气"],"answer":"E","explanation":"继发性的自发性气胸是在肺疾病基础上发生的，肺结核、肺癌、肺大疱、COPD都是肺疾病，在此基础上可继发自发性气胸，而用力咳嗽、屏气是自发性气胸的诱因但不是病因。"},{"n":437,"q":"重度急性有机磷中毒血清胆碱酯酶活力为","options":["A.30%以下","B.31%～40%","C.41%～50%","D.51%～60%","E.61%～70%"],"answer":"A","explanation":""},{"n":438,"q":"下列属于辅助生殖技术的并发症的是","options":["A.巧克力囊肿","B.畸胎瘤","C.卵巢过度刺激综合征","D.早产","E.慢性宫颈炎"],"answer":"C","explanation":"辅助生殖常见的并发症有卵巢过度刺激综合征、多胎妊娠、流产和异位妊娠、卵巢或乳腺肿瘤。"},{"n":439,"q":"肝炎病人出现意识障碍、行为异常时禁止用于灌肠的液体是","options":["A.弱酸溶液","B.清水","C.肥皂水","D.生理盐水","E.乳果糖溶液"],"answer":"C","explanation":"肝炎病人出现意识障碍、行为异常时禁用肥皂水灌肠，因肥皂水可以促进氨的产生和吸收，加重肝性脑病。"},{"n":440,"q":"子宫破裂最常见的原因是","options":["A.多次宫腔操作","B.子宫发育不良","C.缩宫素使用不当","D.产科手术损伤","E.瘢痕子宫"],"answer":"E","explanation":"瘢痕子宫及梗阻性难产是引起子宫破裂最常见的原因。"},{"n":441,"q":"下列有关产褥期产妇消化系统变化的描述，错误的是","options":["A.产后不易发生便秘","B.胃肠肌肌张力及蠕动力均减弱","C.产后食欲欠佳","D.产后容易发生肠胀气","E.产后1～2天常感口渴"],"answer":"A","explanation":"产后因卧床时间长，缺乏运动，腹直肌及盆底肌肌肉松弛，加之肠蠕动减弱，易发生便秘。"},{"n":442,"q":"以下有关健康促进的叙述错误的是","options":["A.改善人群的行为，应包括改变社会、经济和环境条件的活动","B.单纯的教育和健康干预只能提高人们的认知和技能","C.环境是指对健康教育能产生有效支持的自然环境","D.创造支持性环境与健康互相依存、密不可分","E.加强社区行动是健康促进的重要活动领域"],"answer":"C","explanation":"环境是指对健康教育能产生有效支持的自然环境、社会环境和政治环境的总和。"},{"n":443,"q":"下列属于肺源性心脏病发生的先决条件是","options":["A.肺动脉高压形成","B.肺血管管腔狭窄","C.血容量增多","D.右心室肥大","E.血液黏稠度增高"],"answer":"A","explanation":"引起右心室扩大、肥厚的因素很多，但先决条件是肺功能和结构的不可逆性改变，发生反复的气道感染和低氧血症，导致一系列体液因子和肺血管的变化，使肺血管阻力增加，肺动脉血管的结构重塑，产生肺动脉高压。"},{"n":444,"q":"火焰烧伤的病人应立即","options":["A.就地翻滚","B.逃离现场","C.呼救","D.边跑边呼救","E.扑打灭火"],"answer":"A","explanation":"火焰烧伤应尽快脱去燃着的衣裤，熄灭火焰。可用水浇、用被子等覆盖着火处，也可就地滚动灭火或跳进清洁的水池、河沟灭火。不可奔跑，以免风助火势加重损伤；不得用手扑打灭火以免造成手的深度烧伤；切勿高声呼喊，以免造成呼吸道吸入性损伤。"},{"n":445,"q":"反治法是","options":["A.顺从疾病的病因而治","B.逆其疾病的病因而治","C.逆其疾病的现象而治","D.顺从疾病的假象而治","E.顺从疾病的病机而治"],"answer":"D","explanation":"反治法又称为“从治”，是顺从病证的外在假象而治的一种治疗原则。"},{"n":446,"q":"急性肝炎转为慢性为病程超过","options":["A.2个月","B.3个月","C.4个月","D.5个月","E.6个月"],"answer":"E","explanation":"一般来说，判断急性肝炎与慢性肝炎的时间依据是以6个月为界。"},{"n":447,"q":"过敏性紫癜患儿的首发症状是","options":["A.腹痛、恶心呕吐或便血","B.膝、踝、肘关节肿痛","C.出现血尿、蛋白尿及管型","D.皮肤紫癜","E.突然惊厥、失语"],"answer":"D","explanation":"皮肤紫癜常为过敏性紫癜患儿的首发症状。"},{"n":448,"q":"婴儿神经系统和呼吸中枢发育尚不完善，不宜应用的镇静止惊药是","options":["A.吗啡","B.地西泮","C.苯巴比妥","D.异丙嗪","E.水合氯醛"],"answer":"A","explanation":"儿童高热、烦躁不安可使用镇静药使其得到休息，利于病情恢复。常用地西泮、苯巴比妥、水合氯醛等，不宜应用吗啡，以免发生呼吸抑制。"},{"n":449,"q":"偏瘫病人从床移至轮椅的操作步骤正确的是","options":["A.轮椅移至病人患侧","B.轮椅与床成145°角","C.轮椅背对床沿，打开刹擎","D.病人用健手支撑身体站立，身体重心移向患腿","E.调整坐的位置，用健手将患足放在脚踏板上"],"answer":"E","explanation":"首先，病人的身体姿势是平躺在床上。轮椅与床成45°的夹角放置在病人健侧。刹住轮椅手闸，脚踏板向两侧移动。病人用健侧手抓住轮椅远端的扶手，患侧手支撑在床上，患侧脚位于健侧脚后面。脚必须都在地面上，且和肩膀一样宽。病人向前倾斜躯干，健侧手用力支撑，抬起臀部，以脚为支撑点，转动身体，直到病人靠在轮椅上。确定双腿贴近轮椅后，慢慢坐在轮椅上，直到臀部完全接触轮椅，调整座椅姿势，踩下脚踏板。"},{"n":450,"q":"关于鼻饲的叙述，下列正确的是","options":["A.灌注鼻饲液前后应用温开水冲洗胃管","B.鼻饲液温度控制在32～35℃","C.胃管插入15cm时，将下颌托起","D.一般胃管每2周更换1次","E.成人胃管一般插入35～45cm"],"answer":"A","explanation":"鼻饲时，灌注少量温开水后再灌注鼻饲液，最后再注入少量温开水清洗胃管，故A选项正确。鼻饲液温度控制在38～40℃，B选项错误。胃管插入10～15cm至咽喉部，将病人头部托起，使下颌靠近胸骨柄，加大咽部通道的弧度，使管端沿咽后壁滑行，再徐徐插入所需长度至胃内，故C选项错误。一般胃管每周更换1次，故D选项错误。成人胃管一般插入45～55cm，故E选项错误。"},{"n":451,"q":"不属于全肺切除术后胸腔引流管护理措施的是","options":["A.每次放液量不宜过快","B.引流管呈钳闭状态","C.每次放液量不宜过多","D.快速大量引流易引起肺萎陷","E.维持气管、纵隔于中间位置"],"answer":"D","explanation":"快速多量放液易引起纵隔突然移位，导致心搏骤停。"},{"n":452,"q":"病人男，20岁。精神分裂症青春型诊断入院，病人在父母探视时从不主动打招呼或问候。病人这一症状是","options":["A.联想迟缓","B.矛盾思维","C.被动现象","D.情感淡漠","E.思维贫乏"],"answer":"D","explanation":"情感淡漠是对外界刺激缺乏相应的情感反应，表现为情感活动的减退或丧失，即使对自己有密切关系的事情也是如此。"},{"n":453,"q":"护士在预防接种过程中，下列措施不妥的是","options":["A.接种场所宽敞明亮、空气流通","B.做好解释工作，严格查对","C.小儿饭前进行，以免呕吐","D.严格无菌操作","E.及时记录及预约"],"answer":"C","explanation":"饭前预防接种容易引发异常反应：晕厥。"},{"n":454,"q":"关于全面质量管理含义的描述，下列不正确的是","options":["A.以“全面顾客满意”为核心","B.向顾客做质量保证","C.包括组织本身的满意","D.全体员工都应具有质量管理的责任","E.涉及组织运营的全过程"],"answer":"B","explanation":"全面质量管理的理念是组织应该以“全面顾客满意”为核心，涉及组织运行的全过程，组织的全体员工都应具有质量管理的责任。全面顾客满意不仅体现在产品整个生命周期中所有用户的满意，还应包括组织本身的满意，并能与自然、社会环境相适应。"},{"n":455,"q":"精神分裂症最常出现的幻觉是","options":["A.幻听","B.幻视","C.幻触","D.幻嗅","E.幻味"],"answer":"A","explanation":"精神分裂症最突出的感知觉障碍是幻觉，其中最常见的是幻听。"},{"n":456,"q":"护士观察心肌梗死病人溶栓治疗效果，有效指征是","options":["A.溶栓后30分钟后胸痛消失","B.溶栓后1小时后胸痛消失","C.溶栓后2小时后胸痛消失","D.心电图抬高ST段回降30%","E.心电图抬高ST段回降60%"],"answer":"C","explanation":"溶栓有效指征：溶栓后2小时胸痛消失、心电图抬高ST段回降≥50%、CK-MB峰值情况。"},{"n":457,"q":"足月新生儿消化系统的生理特点，不包括","options":["A.胃呈水平位","B.幽门括约肌不发达","C.消化蛋白质的能力较强","D.消化淀粉的能力相对较差","E.出生后24小时内有胎便排出"],"answer":"B","explanation":"新生儿胃呈水平位，贲门括约肌松弛，幽门括约肌发达。"},{"n":458,"q":"高钾血症病人出现心律失常时应首选","options":["A.10%葡萄糖酸钙","B.葡萄糖液+胰岛素","C.碳酸氢钠溶液","D.10%氯化钾","E.聚磺苯乙烯"],"answer":"A","explanation":"高钾血症病人出现心律失常时应首选10%葡萄糖酸钙，以钙离子对抗钾离子对心肌的抑制作用。"},{"n":459,"q":"冠状动脉旁路移植术的目的，不包括","options":["A.疏通狭窄的冠状动脉","B.重建血运通道","C.改善心肌供血、供氧","D.缓解、消除心绞痛","E.提高病人生活质量和延长生命"],"answer":"A","explanation":"冠状动脉旁路移植术的目的是通过血管旁路移植绕过狭窄的冠状动脉而不是疏通狭窄的冠状动脉。"},{"n":460,"q":"关于妊娠期母体循环系统的变化，下列错误的是","options":["A.妊娠晚期心脏向左、向上、向前移位","B.发生深静脉血栓的风险增加","C.心排血量增加","D.妊娠早期及中期，血压轻度升高","E.多数孕妇的心尖及肺动脉区可闻及柔和的吹风样收缩期杂音"],"answer":"D","explanation":"妊娠早期及中期，血压偏低；妊娠晚期，血压轻度升高。"},{"n":461,"q":"以下适用于关节不能或不宜活动时肌力练习的是","options":["A.桥式运动","B.等张收缩","C.等长收缩","D.博巴斯（Bobath）式握手","E.间接举重物练习"],"answer":"C","explanation":"等长收缩训练的优点是易于实施，不会产生肌肉及关节的长度位置变化，可在损伤后的早期实施，且具有良好的训练效果。缺点是对本体感觉、神经肌肉协调性的锻炼效果有限，且不会在训练过程中产生泵血功能，不利于血压的稳定。"},{"n":462,"q":"骨髓炎术后病人对患肢的护理措施包括","options":["A.绝对制动，防止病理性骨折","B.制动肢体可进行肌肉等张收缩练习","C.未制动部位可进行功能锻炼","D.避免肿胀肢体受压，局部禁止石膏托固定","E.怀疑下肢深静脉血栓形成时，增加活动量，促进吸收"],"answer":"C","explanation":"为防止疼痛、挛缩、畸形和病理性骨折，患肢制动，局部持续皮牵引或石膏托固定。但制动肢体可进行肌肉等长收缩，未制动部位进行功能锻炼，以免肌肉萎缩和关节僵硬。若怀疑下肢血栓形成，给予下肢制动，禁止按揉，禁止冷热敷，多饮水，早期遵医嘱进行溶栓治疗，必要时进行介入手术治疗。"},{"n":463,"q":"术后出血的临床表现，不包括","options":["A.中心静脉压大于5cmH2O","B.胸腔引流血性液体持续超过100ml/h","C.尿量少","D.输入足够液体和血液后，休克征象未缓解","E.伤口敷料被渗湿"],"answer":"A","explanation":"切口敷料被血液渗湿，可怀疑为手术切口出血，应打开敷料检查切口以明确出血状况和原因；胸腔手术后，若胸腔引流血性液体持续超过100ml/h，提示有内出血；未放置引流管者，可通过密切的临床观察评估有无低血容量性休克的早期表现，如烦躁、心率增快（常先于血压下降）、尿量少、中心静脉压低于5cmH"},{"n":464,"q":"肾结核病人早期出现尿频、尿急、尿痛的原因是","options":["A.肾结核导致肾炎","B.结核分枝杆菌并发细菌感染","C.结核分枝杆菌血行感染至膀胱结核","D.膀胱挛缩","E.带有结核分枝杆菌尿液的刺激"],"answer":"E","explanation":"肾结核病人带有结核分枝杆菌的尿液进入膀胱，刺激膀胱出现尿频、尿急、尿痛的症状。"},{"n":465,"q":"在不违背原则的前提下，为了实现组织目标而做出一些让步、牺牲、妥协、折中与变通等，所遵循的协调原则是","options":["A.目标导向","B.勤于沟通","C.利益一致","D.整体优化","E.原则性与灵活性相结合"],"answer":"E","explanation":"灵活性是指在不违背原则的前提下，为了实现组织目标而做出的一些让步、牺牲、妥协、折中与变通等。"},{"n":466,"q":"下列属于领导方式论中，民主型领导方式的特点的是","options":["A.所有决策由组织成员集体讨论决定","B.传递给下属的信息只有工作命令","C.领导者权力分散，只为下属提供信息","D.领导者依靠权力性影响力维护权威","E.管理的重心落在工作目标和任务上"],"answer":"A","explanation":"民主型领导方式的特点之一是所有决策由组织成员集体讨论决定，领导者采用鼓励和协商的态度。"},{"n":467,"q":"下列不属于健康教育的诊断步骤的是","options":["A.流行病学诊断","B.教育诊断","C.心理诊断","D.行为诊断","E.社会诊断"],"answer":"C","explanation":"健康教育诊断的基本步骤包括社会诊断、流行病学诊断、行为诊断、环境诊断、教育诊断、管理与政策诊断。"},{"n":468,"q":"儿童身体娇嫩，宜用性平、易消化的食物，老年人气血、阴阳虚弱，宜进食助阳或养血滋阴的食物。这种饮食调护的方法是根据","options":["A.因时制宜","B.因地制宜","C.因人制宜","D.因病制宜","E.因体质制宜"],"answer":"C","explanation":"护治原则里的三因制宜即因时、因地、因人制宜。因时制宜护理是根据不同季节的天时气候特点，来确定养生、用药和护理方法的原则。因地制宜护理是根据不同地区的地理环境特点，来制订不同的护理措施。因人制宜护理是根据病人年龄、性别、体质、生活习惯、精神状态的不同采用不同的护理方法。"},{"n":469,"q":"关于艾滋病的流行病学，正确的是","options":["A.从感染HIV到产生抗体大约需要2周","B.主要通过输血传播","C.病人是主要传染源","D.部分病人无症状感染期可达10年","E.女传男高于男传女"],"answer":"D","explanation":"艾滋病的潜伏期较长，一般认为2～10年可发展为艾滋病。"},{"n":470,"q":"下列有关产后出血的说法正确的是","options":["A.是指胎盘娩出后24小时内阴道出血量≥500ml","B.产后1～2周发病最常见","C.子宫收缩乏力是最常见原因","D.产后6小时是发生产后出血的高峰期","E.胎盘、胎膜残留导致的产后出血多发生于产后10天左右"],"answer":"C","explanation":"产后出血的最常见原因是子宫收缩乏力。"},{"n":471,"q":"下列属于腹腔镜检查禁忌证的是","options":["A.子宫内膜异位症","B.不孕症","C.腹腔脏器严重粘连","D.恶性肿瘤术后或化疗后的效果评价","E.原因不明的盆腔痛"],"answer":"C","explanation":"腹腔镜的禁忌证包括严重心肺功能不全者，腹腔内大出血者，弥漫性腹膜炎或怀疑盆腹腔广泛性粘连者，大的腹壁疝或膈疝者，凝血功能障碍者。"},{"n":472,"q":"2级高血压的诊断标准是","options":["A.收缩压130～139mmHg，舒张压85～89mmHg","B.收缩压140～159mmHg，舒张压90～99mmHg","C.收缩压160～179mmHg，舒张压100～109mmHg","D.收缩压≥180mmHg，舒张压≥110mmHg","E.收缩压≤120mmHg，舒张压≤80mmHg"],"answer":"C","explanation":"2级高血压（中度）的诊断标准：收缩压160～179mmHg和/或舒张压100～109mmHg。"},{"n":473,"q":"关于局部麻醉药物心血管毒性的表现，下列描述正确的是","options":["A.血管平滑肌兴奋","B.传导阻滞","C.心排血量增加","D.血压升高","E.心肌收缩力增强"],"answer":"B","explanation":"局部麻醉药物的心血管毒性表现在传导阻滞、血管平滑肌和心肌抑制，出现心律失常，心肌收缩力减弱、心排血量减少、血压下降直至心搏骤停。"},{"n":474,"q":"健康教育形成评价的方法不包括","options":["A.文献","B.档案","C.随机调查","D.专家咨询","E.专题小组讨论"],"answer":"C","explanation":"健康教育形成评价的主要方法有文献、档案、资料的回顾、专家咨询、专题小组讨论等。"},{"n":475,"q":"护理管理者在谈话时应开诚布公，体现谈话技巧的是","options":["A.善于运用倾听技巧","B.善于激发下属谈话愿望","C.善于启发下属讲真情实话","D.善于利用反馈机制","E.避免一味说教"],"answer":"B","explanation":""},{"n":476,"q":"甲亢术后甲状腺危象的主要原因是","options":["A.术后出血","B.感染","C.精神紧张","D.术前准备不充分","E.术中补液不够"],"answer":"D","explanation":""},{"n":477,"q":"关于人际传播中的谈话技巧，错误的是","options":["A.内容明确","B.重点突出","C.语速适中","D.避免对视","E.适当重复"],"answer":"D","explanation":""},{"n":478,"q":"肛瘘手术后肛门失禁是由于手术时损伤了","options":["A.随意的外括约肌","B.不随意的内括约肌","C.内、外括约肌","D.肛管直肠环","E.肛提肌"],"answer":"D","explanation":""},{"n":479,"q":"可防止性传播疾病传播的避孕方法是","options":["A.阴茎套","B.口服避孕药","C.宫内节育器","D.安全期避孕法","E.绝育术"],"answer":"A","explanation":""},{"n":480,"q":"甲状腺功能亢进症患者多饮水能","options":["A.补充出汗等丢失的水分","B.防止尿酸性肾病","C.减少出血性膀胱炎并发症","D.加速细菌、毒素及炎性分泌物排出","E.促进痰液稀释而容易排出"],"answer":"A","explanation":""},{"n":481,"q":"影响戒烟行为的促成因素是","options":["A.个人价值观","B.吸烟危害的知识","C.同学、父母的鼓励","D.法规如公共场所禁止吸烟","E.有关吸烟危害的态度、信念"],"answer":"D","explanation":""},{"n":482,"q":"进行健康教育的行为诊断时，区分重要行为与相对不重要行为的原则是","options":["A.经常发生的行为","B.形成时间已久的行为","C.深植于文化传统的行为","D.正处于发展时期的行为","E.既往无成功改变实例的行为"],"answer":"A","explanation":""},{"n":483,"q":"可行阴道灌洗的妇女是","options":["A.月经期妇女","B.妊娠晚期妇女","C.产褥期妇女","D.人工流产术后妇女","E.患阴道炎的妇女"],"answer":"E","explanation":""},{"n":484,"q":"对于全面质量管理的含义描述正确的是","options":["A.强烈地关注患者","B.持续不断地评估","C.改进组织中每项工作的质量","D.长久的度量","E.向顾客授权"],"answer":"C","explanation":""},{"n":485,"q":"关于“时空语”的理解，正确的是","options":["A.手势表示强调","B.借助气氛语义传递信息","C.适当语调变化调节气氛","D.举止稳重获得对方信任","E.与场合匹配的仪表服饰搭配"],"answer":"B","explanation":""},{"n":486,"q":"患者健康教育中，医护人员根据病情对患者进行口头教育和指导的形式属于","options":["A.候诊教育","B.随诊教育","C.咨询教育","D.病房教育","E.健康教育处方"],"answer":"B","explanation":""} L，其最可能的原因是","options":["A.胎儿期处于相对缺氧状态","B.孕母营养充足","C.胎儿期红细胞寿命长","D.血液黏稠","E.造血功能亢进"],"answer":"A","explanation":""},{"n":502,"q":"患儿男，6个月。因发热咳嗽3天，腹泻2天，尿量明显减少1天后入院。查体：呼吸深快，前囟明显凹陷，四肢凉。血清钠125mmol／L。下列处理不正确的是","options":["A.第一天补2／3张含钠液","B.累计损失量应于12小时内补完","C.应用碱性液纠正酸中毒","D.缓慢滴入液体，以免引起肺水肿","E.补液的速度取决于脱水的程度"],"answer":"D","explanation":""},{"n":503,"q":"患儿男，2岁。因近3日头痛、呕吐，今日抽搐1次并颈强直入院。护理查体：嗜睡，颈强直，心肺（-），脑膜刺激征（+）。该患儿最不可能的病因是","options":["A.颅内、外感染","B.颅内占位性病变","C.脑缺血缺氧","D.脑脊液循环异常","E.急性肾衰竭"],"answer":"E","explanation":""},{"n":504,"q":"病人女，32岁。体检发现多发肌壁间子宫肌瘤3年，该病人拟妊娠，可使肌瘤发生","options":["A.钙化","B.囊性变","C.红色变性","D.肉瘤样变","E.玻璃样变"],"answer":"C","explanation":""},{"n":505,"q":"患儿男，7岁。突然高热、惊厥1次。入院体温39.5℃，面色苍白，四肢厥冷，意识不清，粪检结果为脓细胞8～10个/HP。考虑的诊断为","options":["A.中毒型细菌性痢疾","B.腮腺炎脑炎","C.水痘并发脑炎","D.高热惊厥","E.麻疹脑炎"],"answer":"A","explanation":""},{"n":506,"q":"患儿女，3岁。诊断为肺炎，今晨突然面色苍白，心动过速，心律不齐，心电图显示ST段下移，T波倒置。判断该患儿发生了","options":["A.心力衰竭","B.心肌炎","C.脑水肿","D.肺源性心脏病","E.心房颤动"],"answer":"B","explanation":""},{"n":507,"q":"病人男，33岁。诊断为肺结核。注射链霉素的过程中出现发热、皮疹、荨麻疹。医嘱：静脉注射10%葡萄糖酸钙溶液。其目的是","options":["A.松弛支气管平滑肌","B.缓解皮肤瘙痒症状","C.发生络合反应，减轻毒性症状","D.降低体温","E.收缩血管，增加外周阻力"],"answer":"C","explanation":""},{"n":508,"q":"患者男，35岁。近6个月食欲旺盛，口干、消瘦，小便次数增多。其确诊需要做的检查是","options":["A.尿糖检测","B.FT3、F4、TSH","C.OGTT","D.皮质醇节律","E.尿常规"],"answer":"C","explanation":""},{"n":509,"q":"患者女，产后2周出现弛张热，下腹疼痛并且压痛明显，下肢肿胀疼、痛，皮肤紧张。其最可能的诊断是","options":["A.子宫肌炎","B.血栓性静脉炎","C.急性盆腔结缔组织炎","D.急性盆腔腹膜炎","E.产后关节炎"],"answer":"B","explanation":""},{"n":510,"q":"患者女，41岁。因“黑粪近2个月”入院。近日突发剧烈腹痛，不能行动。护士对其采取的措施不包括","options":["A.监测生命体征","B.予以禁食","C.给予强效镇痛剂","D.心理安抚","E.取舒适卧位"],"answer":"C","explanation":""},{"n":511,"q":"病人男，72岁。诊断为前列腺增生。昨晚发生急性尿潴留。下列护理措施最重要的是","options":["A.去除病因","B.引流尿液","C.术前准备","D.监测生命体征","E.保证液体的摄入量"],"answer":"B","explanation":""},{"n":512,"q":"患儿女，11个月。腹泻水样便2天，每天大便10余次，高热2天。出汗较多，极度口渴，尿量明显减少。护理查体：烦躁不安，四肢稍凉，皮肤干、弹性差。该患儿最可能的诊断是","options":["A.轻度等渗性脱水","B.轻度低渗性脱水","C.中度低渗性脱水","D.中度等渗性脱水","E.中度高渗性脱水"],"answer":"E","explanation":""},{"n":51 ion":""},{"n":624,"q":"患者男，67岁。出现进行性排尿困难2年，1周前因尿潴留给予导尿，共导出淡红色尿液1200ml，尿管拔除后患者仍不能自主排尿。首先应考虑患者患有","options":["A.前列腺增生症","B.前列腺癌","C.尿道狭窄","D.膀胱结石","E.尿道损伤"],"answer":"A","explanation":""},{"n":625,"q":"患儿男，3岁。上楼梯时，其父亲向上牵拉其右上肢，患儿哭叫，诉肘部疼痛，不肯用右手取物。该患儿最可能的诊断是","options":["A.肘关节脱位","B.桡骨头骨折","C.桡骨头半脱位","D.肌肉牵拉伤","E.尺骨鹰嘴撕脱伤"],"answer":"C","explanation":""},{"n":626,"q":"患者男，61岁。咳嗽3年，每年冬季发作，每次持续3个月，有吸烟史。该患者病情继续发展，最常见的并发症是","options":["A.肺部感染","B.阻塞性肺气肿","C.肺源性心脏病","D.自发性气胸","E.支气管哮喘"],"answer":"B","explanation":""},{"n":627,"q":"患者男，45岁。因交通事故致骨盆骨折第2天，24小时尿量200ml，以下不符合急性肾衰竭的是","options":["A.血浆肌酐76mmol／L","B.血钾5.6mmol／L","C.尿素氮32mmol／L","D.血镁1.4mmol／L","E.血磷1.86mmol／L，血钙0.95mmol／L"],"answer":"A","explanation":""},{"n":628,"q":"医疗事故鉴定组的工作原则不包括","options":["A.以客观事实为依据的原则","B.回避原则","C.协商原则","D.独立进行的原则","E.实行合议制的原则"],"answer":"C","explanation":""},{"n":629,"q":"初孕妇，29岁，孕24周。空腹血糖4.9mmol/L，该孕妇需进一步检查的项目是","options":["A.复查空腹血糖","B.尿糖检查","C.尿蛋白检查","D.糖耐量检查","E.羊膜腔穿刺"],"answer":"D","explanation":""},{"n":630,"q":"患者女，28岁。月经过期1周，结婚6个月，从未用过避孕药，既往月经正常、规律，宫颈软、着色，子宫正常大小，双附件（-）。下列诊断妊娠的最早方法是","options":["A.B超","B.放射免疫测定β-hCG","C.基础体温","D.听胎心","E.尿hCG测定"],"answer":"B","explanation":"超声检查（A 选项）一般在妊娠 5 周左右可见妊娠囊，不是最早的方法。 放射免疫测定 β-hCG 在受精后 7 天左右即可测出，是最早能诊断妊娠的方法。 基础体温（C 选项）可提示排卵及黄体功能，但不能明确诊断妊娠，且不是最早方法。 听胎心（D 选项）一般在妊娠 18～20 周左右才能听到。 尿 hCG 测定（E 选项）一般在受精后 14 天左右可测出，比放射免疫测定 β-hCG 晚。"},{"n":631,"q":"患儿女，3岁。诊断为支气管炎，咳嗽5天伴发热2天。不应采取的措施是","options":["A.减少患儿活动","B.经常变换体位","C.室内湿度40％","D.给予雾化吸入","E.遵医嘱使用抗生素"],"answer":"C","explanation":""},{"n":632,"q":"患儿男，5岁。平素食欲好，不爱活动，体态肥胖，智力正常，诊断为单纯性肥胖症，其治疗不包括","options":["A.控制饮食","B.少量多餐，杜绝过饱","C.适度运动","D.服用减肥药物","E.心理疏导"],"answer":"D","explanation":""},{"n":633,"q":"患者女，35岁。诊断慢性肾炎10年。目前尿蛋白（+++），明显水肿、尿少，血压正常。目前主要护理诊断是","options":["A.营养失调：低于机体需要量","B.有皮肤完整性受损的危险","C.生活自理缺陷","D.体液过多","E.知识缺乏"],"answer":"D","explanation":""},{"n":634,"q":"护理人员发现医嘱有明显错误时，正确的做法是","options":["A.继续执行","B.有权拒绝执行","C.保持沉默","D.交予他人执行","E.假装不知道"],"answer":"B","explanation":""},{"n":635,"q":"患者男，28岁。车 降低","C.全身凹陷性水肿，高血压，高胆固醇血症，低蛋白血症","D.大量蛋白尿，高血压，全身非凹陷性水肿，血尿","E.全身非凹陷性水肿，大量蛋白尿，氮质血症，血清补体降低"],"answer":"A","explanation":""},{"n":646,"q":"前庭神经损害的表现不包括","options":["A.眩晕","B.呕吐","C.眼球震颤","D.步态不稳","E.向健侧倾倒"],"answer":"E","explanation":""},{"n":647,"q":"患者男，55岁。诊断为冠心病。患者突然意识丧失，临床上疑为心搏骤停。此时，最迅速、准确的判断方法是","options":["A.瞳孔散大","B.呼吸停止","C.意识丧失","D.颈动脉搏动消失","E.血压测不到"],"answer":"D","explanation":""},{"n":648,"q":"患者男，40岁。诊断慢性肾小球肾炎2年。因“1周来颜面和双下肢反复水肿”入院。实验室检查：尿蛋白（+），红细胞（++）～（++++）。发生该病的主要机制是","options":["A.急性肾炎治疗不彻底","B.先天性免疫功能缺陷","C.免疫介导性炎症","D.肾小球滤过膜电荷屏障受损","E.细菌化脓性严重"],"answer":"C","explanation":""},{"n":649,"q":"患儿女，8岁。7天前无明显诱因出现发热、腮腺肿大，考虑为流行性腮腺炎。应采取的隔离措施是","options":["A.消化道隔离","B.接触隔离","C.呼吸道隔离","D.血液/体液隔离","E.保护性隔离"],"answer":"C","explanation":""},{"n":650,"q":"患者男，26岁。入院诊断为急性白血病。患者化疗缓解期突然出现头痛、恶心、呕吐、颈项强直等症状。该患者可能发生的是","options":["A.颅内出血","B.败血症","C.中枢神经系统白血病","D.上消化道出血","E.脑栓塞"],"answer":"C","explanation":""},{"n":651,"q":"输液时发生静脉痉挛致滴注不畅时应","options":["A.减慢输液速度","B.适当更换肢体位置","C.局部热敷","D.降低输液瓶位置","E.加压输液"],"answer":"C","explanation":""},{"n":652,"q":"孕妇，25岁。从分娩后第2天起，持续3天体温在38℃左右，子宫收缩好，无压痛，会阴伤口红肿、疼痛，恶露淡红色，无臭味，双乳软，无硬结。发热的原因最可能是","options":["A.会阴伤口感染","B.乳腺炎","C.产褥感染","D.上呼吸道感染","E.乳头皲裂"],"answer":"A","explanation":""},{"n":653,"q":"患者男，29岁。3年前因消化性溃疡，做过胃大部切除术。近3个月来频繁头晕、乏力、心悸和体力下降，诊断为缺铁性贫血。患者贫血最可能的原因是","options":["A.铁摄入不足","B.铁需要量增加","C.铁吸收不良","D.铁消耗过量","E.铁不能利用"],"answer":"C","explanation":"患者因胃大部切除术，胃的生理结构发生改变，可影响铁的吸收。铁主要在十二指肠及空肠上段被吸收，胃大部切除术后，胃酸分泌减少、胃排空加快等因素可导致铁的吸收不良，从而引起缺铁性贫血。"},{"n":654,"q":"患儿女，1岁。近2个月食欲差，辅食进入较少。皮肤、黏膜苍白，口唇、口腔黏膜、甲床最为明显。经实验室检查，诊断为营养性缺铁性贫血。发生贫血的主要原因是","options":["A.未及时添加含铁丰富的辅食","B.生长发育过快","C.慢性失血","D.慢性腹泻","E.癌症"],"answer":"A","explanation":""},{"n":655,"q":"输液反应中发热反应的原因不包括","options":["A.输液瓶灭菌不完善","B.输入的溶液制品不良","C.输液器消毒不严","D.未严格执行无菌操作","E.机体自身反应"],"answer":"E","explanation":""},{"n":656,"q":"患者男，45岁。左手、右足烧伤，有水泡、剧痛，创面基底潮红湿润。估计此患者烧伤总面积和深度为","options":["A.6％，深Ⅱ度","B.5％，深Ⅱ度","C.6％，浅Ⅱ度","D.5％，浅Ⅱ度","E.7％，浅Ⅱ度"],"answer":"C","explanation":""},{"n":657,"q":"患儿男，8岁。双下肢非凹陷性水肿，少尿3天入院。诊断为急性肾小球肾炎。现气促，发绀，咳粉红色泡沫样痰，首先考虑出现","options":["A.肺水肿","B.急性肺炎","C.高血压脑病","D.严重循环充血","E.窒息"],"answer":"D","explanation":""},{"n":658,"q":"患儿女，7天。足月顺产。出生后第3天出现黄疸。今日测血清胆红素201μmol／L。患儿一般情况良好，食欲正常。其黄疸消退的时间应为","options":["A.10天内","B.2周内","C.3周内","D.4周内","E.6周内"],"answer":"B","explanation":""},{"n":659,"q":"病人男，38岁。全麻术后心电图突然显示P-QRS-T波群完全消失，代之以连续的形状、振幅、间隔绝对不规则的小振动波。此时最有效的治疗方法为","options":["A.人工呼吸","B.静脉输液","C.除颤","D.胸外按压","E.气管插管"],"answer":"C","explanation":""},{"n":660,"q":"病人腹股沟韧带内侧下方突然出现半球形包块，疼痛、不能回纳，伴恶心、呕吐，肛门不排气。下列术前准备不正确的是","options":["A.禁食","B.输液，维持水、电解质平衡","C.备血","D.灌肠","E.胃肠减压"],"answer":"D","explanation":""},{"n":661,"q":"患者男，28岁。诊断为溃疡性结肠炎，典型的临床表现是","options":["A.腹痛","B.水泻","C.腹泻与便秘交替","D.黏液脓血便","E.发热"],"answer":"D","explanation":""},{"n":662,"q":"患者男，48岁。诊断为食管癌，该疾病预后最差的病理类型是","options":["A.蕈伞型","B.溃疡型","C.腔内型","D.髓质型","E.混合型"],"answer":"D","explanation":""},{"n":663,"q":"患者女，62岁。胃大部切除术后发生倾倒综合征，其护理措施是","options":["A.不限制饮水","B.普通饮食","C.宜进食高碳水化合物类、低蛋白饮食","D.避免过甜、过咸、过浓流质饮食","E.进餐后应取半卧位"],"answer":"D","explanation":""},{"n":664,"q":"患者女，57岁。有手术史。2日前开始出现腹部疼痛，阵发性加剧，呕吐物为胃内容物，腹胀，肠鸣音亢进。该患者的腹部X线检查最可能出现的影像学改变是","options":["A.多个阶梯状排列的气液平面","B.口服造影剂后出现充盈缺损","C.膈下游离气体","D.胃扩大，张力减低","E.出现“杯口”状阴影"],"answer":"A","explanation":""},{"n":665,"q":"患者女，64岁。诊断高血压病2年，近2月在家干家务活时发生胸骨体中段后压榨样疼痛3次，每次持续3～5分钟，休息后自行缓解。应考虑诊断为","options":["A.心血管神经症","B.稳定型心绞痛","C.不稳定型心绞痛","D.急性冠状动脉综合征","E.急性心肌梗死"],"answer":"B","explanation":""},{"n":666,"q":"患者男，56岁。双大腿发生挤压伤，测得血清钾浓度为6.9mmol/L，脉搏54次/min，伴有心律不齐。应立即注射的药物是","options":["A.5％葡萄糖注射液","B.0.9％氯化钠注射液","C.10％葡萄糖酸钙注射液","D.10％葡萄糖注射液+胰岛素","E.11.2％乳酸钠注射液"],"answer":"C","explanation":""},{"n":667,"q":"病人男，56岁。患慢性阻塞性肺气肿5年。今晨买菜回家后，突感左侧胸痛，呼吸困难，发绀。急查胸部X线：左侧肺透光度增强，内无肺纹理，肺被压向肺门，呈高密度影。该病人可能的诊断是","options":["A.自发性气胸","B.肺性脑病","C.肺不张","D.呼吸衰竭","E.哮喘发作"],"answer":"A","explanation":""},{"n":668,"q":"患儿男，12岁。患儿母亲是乙型肝炎病人，进行健康体检后，医生根据检查结果告知患儿母亲，目前乙肝病毒在其体内复制活跃，具有传染性。判定患儿目前的感染状态是","options":["A.病原体被清除","B.隐性感染","C.显性感染","D.病原携带状态","E.潜伏性感染"],"answer":"D","explanation":""},{"n":669,"q":"病人女，48岁。术前护士遵医嘱进行导尿术，排空膀胱。插入导尿管时，见尿再插入的长度为","options":["A.1cm左右","B.2cm左右","C.3cm左右","D.4cm左右","E.5cm左右"],"answer":"A","explanation":""},{"n":670,"q":"母亲带4个月婴儿来儿保门诊检查，应认为发育异常的情况是","options":["A.前囟1.5～2cm","B.乳牙未萌出","C.头尚不能抬起","D.不能伸手取物","E.拥抱反射消失"],"answer":"C","explanation":""},{"n":671,"q":"患者女，25岁。宫内妊娠40+周，G1P0，在门诊检查时主诉胎动减少1天，查胎心率140次/min。为了解胎儿在宫内的情况，首选的检查应是","options":["A.胎儿心电图","B.羊膜镜检查","C.胎儿头皮血pH测定","D.NST试验","E.CST试验"],"answer":"D","explanation":""},{"n":672,"q":"患者男，56岁。患尿毒症，精神萎靡。下腹无胀满，24小时尿量为60ml。患者的排尿状况属于","options":["A.正常","B.尿闭","C.少尿","D.尿潴留","E.尿量偏少"],"answer":"B","explanation":""},{"n":673,"q":"患者男，16岁。突然发病，四肢抽搐，意识丧失，口吐白沫伴有尿失禁。应首先考虑","options":["A.短暂性脑缺血发作","B.癫痫大发作","C.脑血栓形成","D.蛛网膜下腔出血","E.药物中毒"],"answer":"B","explanation":""},{"n":674,"q":"患者男，40岁。在工地劳动中被铁钉刺伤足底，1周后发生破伤风。给该患者冲洗伤口可以用","options":["A.生理盐水","B.3％过氧化氢溶液","C.50％硫酸镁溶液","D.10％硝酸银溶液","E.5％碳酸氢钠溶液"],"answer":"B","explanation":""},{"n":675,"q":"患儿女，8岁。因开水烫伤后2小时急诊入院。患儿双手、双前臂均为大小不一的水疱，创面红润、潮湿，疼痛剧烈。估计该患儿烫伤总面积和深度为","options":["A.9%，浅Ⅱ度","B.11%，深Ⅱ度","C.9%，深Ⅱ度","D.11%，浅Ⅱ度","E.18%，浅Ⅱ度"],"answer":"D","explanation":"根据中国新九分法（5、6、7――双手、双前臂、双上臂）计算为11%。有水疱，疼痛剧烈为浅Ⅱ度烧伤。"},{"n":676,"q":"病人男，38岁。诊断为原发免疫性血小板减少症。护理查体：体温38.8℃，牙龈出血，四肢皮肤多处瘀斑。实验室检查：红细胞计数3.0×1012/L，血红蛋白80g/L，白细胞计数6.0×109/L，血小板计数18×109/L。血小板计数测定达到何值时应警惕出血","options":["A.5×109/L以下","B.10×109/L以下","C.15×109/L以下","D.20×109/L以下","E.25×109/L以下"],"answer":"D","explanation":"当血小板减少至20×10"},{"n":677,"q":"患儿男，12个月。腹泻2周，口腔局部黏膜充血、水肿，部分形成糜烂面，表面有灰白色假膜，易拭去，但遗留溢血的创面，患儿经常哭闹。护理查体：T 39.5℃，颌下淋巴结肿大。关于该病，下列描述正确的是","options":["A.婴幼儿唾液腺分泌多，口腔黏膜湿润，利于微生物繁殖","B.多见于年长儿，且较常发生","C.急性感染致抵抗力下降","D.多为单纯疱疹病毒感染所致","E.多为白念珠菌感染所致"],"answer":"C","explanation":"患儿为溃疡性口炎，多见于婴幼儿。婴幼儿口腔黏膜干燥，利于微生物繁殖，易患口炎。此病多由于链球菌、金黄色葡萄球菌等感染所致，目前已很少见。急性感染、长期腹泻等致抵抗力下降时亦可致病。"},{"n":678,"q":"病人男，35岁。诊断为丙型肝炎。其使用过的不耐热化纤织物，最适宜的消毒灭菌方法是","options":["A.压力蒸汽灭菌","B.紫外线照射","C.环氧乙烷熏蒸","D.过氧乙酸浸泡","E.氯胺喷雾"],"answer":"C","explanation":"环氧乙烷气体消毒用于精密仪器、医疗器械、化纤织物、塑料制品等。"},{"n":679,"q":"初产妇，29岁，妊娠40周。今2时开始规律宫缩，23时宫口开大3cm，头先露，平棘，宫缩7～8min一次，持续20～30s，胎膜未破。目前该产妇的产程属于","options":["A.正常潜伏期","B.正常活跃期","C.潜伏期延长","D.活跃期延长","E.活跃期停滞"],"answer":"C","explanation":"从规律宫缩开始到活跃期起点（4～6cm）为潜伏期，初产妇一般不超过20小时。该产妇已超过20小时，故为潜伏期延长。"},{"n":680,"q":"患儿女，9岁。诊断为幼年特发性关节炎多关节型。对此患儿的治疗，下列描述不正确的是","options":["A.为保持关节活动、肌力强度，应尽早进行理疗和锻炼","B.可适当予以清晨热浴、中药热浴，以减轻病情及晨僵","C.如并发虹膜睫状体炎，可局部使用肾上腺皮质激素类眼药水滴眼","D.如视力严重影响，可予以小剂量泼尼松口服","E.避免使用夹板、支具等固定患肢，勤活动，以免加重关节损坏或畸形"],"answer":"E","explanation":"幼年特发性关节炎可应用水杨酸制剂与非甾体抗炎药、甲氨蝶呤、肾上腺皮质激素、免疫抑制剂等进行抗JIA治疗；所有病例都应尽早开始为保护关节活动及维持肌肉强度所设计的锻炼，如清晨热浴、中药热浴可减轻病情及晨僵，并根据具体情况选择锻炼方式或夹板固定等方法，防止发生或纠正关节残疾；如并发虹膜睫状体炎，可局部使用肾上腺皮质激素类眼药水滴眼，必要时可用小剂量泼尼松口服。"},{"n":681,"q":"要求在胎肩娩出前吸净胎儿鼻、咽部黏液是在羊水污染程度为","options":["A.Ⅰ度","B.Ⅱ度","C.Ⅲ度","D.Ⅳ度","E.Ⅴ度"],"answer":"C","explanation":""},{"n":682,"q":"病人男，40岁。体外循环术术后出现少尿，血钾升高、血肌酐和尿素氮升高，怀疑肾衰竭。下列护理措施错误的是","options":["A.停用肾毒性药物","B.术后及时复温、保暖","C.限制水和电解质摄入","D.给予高蛋白饮食","E.必要时行透析治疗"],"answer":"D","explanation":"体外循环术术后肾功能不全的护理措施：①术前维护好肾功能，不用损伤肾功能的药物；②术后及时复温、保暖，维持全身灌注良好，维持尿量在1ml/（kg？h）以上；③密切监测肾功能，停用肾毒性药物，如怀疑肾衰竭，应限制水和电解质摄入，如确诊为急性肾衰竭，应行透析治疗；④术后合理饮食，进低蛋白饮食，限制钠盐的摄入，远离加工食品。"},{"n":683,"q":"病人女，32岁。因异位妊娠破裂大出血给予输血400ml。在输入两袋血之间，应滴注","options":["A.5%葡萄糖溶液","B.10%葡萄糖溶液","C.0.9%氯化钠溶液","D.复方氯化钠溶液","E.5%碳酸氢钠溶液"],"answer":"C","explanation":"输入两袋以上血液时，两袋之间输入少量0.9%氯化钠溶液。"},{"n":684,"q":"病人女，44岁。因肝硬化多年，呕血200ml入院。下列治疗错误的是","options":["A.卧床休息，避免呕血时误吸引起窒息","B.禁食","C.建立有效静脉通道","D.快速补充血容量，保持血红蛋白80～90g/L","E.输新鲜血"],"answer":"D","explanation":"血红蛋白应保持不低于70g/L。"},{"n":685,"q":"病人女，34岁。妇科检查：阴道分泌物白色糊状，量少，宫颈糜烂样改变，无接触性出血；子宫正常大小、无压痛，两侧附件无增厚及压痛，未触及包块。下列处理原则正确的是","options":["A.无须处理","B.激光治疗","C.冷冻治疗","D.中药治疗","E.抗生素治疗"],"answer":"A","explanation":"该病人宫颈呈糜烂样改变，白带正常，无接触性出血，无须处理。"},{"n":686,"q":"新生儿，日龄2天。一般情况好，血红蛋白160g/L，红细胞计数5×1012/L，提示","options":["A.新生儿溶血","B.新生儿贫血","C.正常现象","D.生理性贫血","E.急性白血病"],"answer":"C","explanation":"由于胎儿期处于相对缺氧状态，促红细胞生成素合成增加，红细胞计数及血红蛋白量较高，出生时红细胞计数为（5.0～7.0）×10"},{"n":687,"q":"病人女，45岁。肾移植术后8天，诊断为急性排斥反应，其首选药物是","options":["A.甲泼尼龙","B.硫唑嘌呤","C.环孢素A","D.他克莫司","E.吗替麦考酚酯"],"answer":"A","explanation":"治疗排斥反应，目前较肯定的方法是采用大剂量糖皮质激素（如甲泼尼龙）的冲击疗法。"},{"n":688,"q":"病人女，50岁。遵医嘱口服磺胺类药，护士嘱病人服药后多饮水，其目的是","options":["A.避免药物结晶堵塞肾小管","B.增加药物疗效","C.维持血液药物浓度","D.避免损害免疫系统","E.减轻胃肠刺激"],"answer":"A","explanation":"磺胺类药由肾脏排出，尿少时易析出结晶，使肾小管堵塞，多饮水可帮助药物排出。"},{"n":689,"q":"患儿男，1岁。诊断为结核性脑膜炎。关于该病的治疗措施，下列描述正确的是","options":["A.强化治疗阶段需1个月","B.需抓住抗结核和降低颅内压两个重点环节","C.巩固治疗阶段需6个月","D.为防止结核扩散，应避免使用肾上腺皮质激素","E.快速降颅内压应使用山梨醇"],"answer":"B","explanation":"结核性脑膜炎的治疗措施包括：强化治疗，疗程3～4个月；需抓住两个重点环节，一是抗结核，二是降低颅内压；巩固治疗，9～12个月；使用肾上腺皮质激素可抑制炎症渗出，减轻中毒症状；快速降颅内压首选20%甘露醇。"},{"n":690,"q":"病人女，35岁。白带增多、呈脓性，性交后出血近1年，反复药物治疗效果不佳。妇科检查：子宫颈充血、水肿、呈糜烂样改变。下列治疗方法首选的是","options":["A.物理治疗","B.孕激素治疗","C.抗生素治疗","D.子宫颈锥形切除","E.中药治疗"],"answer":"A","explanation":"宫颈糜烂样改变者，如有性交后出血，反复药物治疗无效，应给予物理治疗。如为无症状的生理性柱状上皮异位，则无须处理。"},{"n":691,"q":"病人女，35岁。火灾事故中，双足、双小腿烧伤，创面有水疱，疱壁较厚，疼痛不明显。其烧伤等级为","options":["A.轻度烧伤","B.中度烧伤","C.重度烧伤","D.特重烧伤","E.中重度烧伤"],"answer":"B","explanation":"患者中年女性，火灾事故中双足、双小腿烧伤，创面出现水疱，且疱壁较厚，疼痛不明显，这是深Ⅱ°烧伤的典型表现。深Ⅱ°烧伤伤及真皮乳头层以下，但仍残留部分网状层，深浅不尽一致，也可有水疱，但去疱皮后，创面微湿，红白相间，痛觉较迟钝。根据烧伤严重程度分类，烧伤总面积在11%～30%之间或Ⅲ°烧伤面积在10%以下，或Ⅱ°、Ⅲ°烧伤面积虽不到上述百分比，但已发生休克等并发症、存在较重的吸入损伤和复合伤，属于中度烧伤。 选项A轻度烧伤是指Ⅱ°烧伤面积10%以下，与题意不符。 选项C重度烧伤是指烧伤总面积31%～50%，或Ⅲ°烧伤面积在11%～20%，或Ⅱ°、Ⅲ°烧伤面积虽不到上述百分比，但已发生休克等并发症、存在较重的吸入损伤和复合伤，不符合题意。 选项D特重烧伤是指烧伤总面积50%以上，或Ⅲ°烧伤20%以上，或已有严重并发症，故不选。 选项E中重度烧伤在烧伤分级中并不存在，故排除。"},{"n":692,"q":"病人女，51岁。诊断为肾病综合征。口服糖皮质激素治疗半年余。昨日突发高热，自觉尿急、尿频伴有下腹部不适。该病人出现上述症状的主要原因是","options":["A.泌尿系统肿瘤","B.括约肌收缩力弱","C.内分泌因素","D.肾实质损伤","E.泌尿系统感染"],"answer":"E","explanation":"长期服用糖皮质激素可导致机体抵抗力下降而易发生肾盂肾炎。"},{"n":693,"q":"病人女，30岁。腿部外伤后发展为气性坏疽，为其换药用的剪刀的最佳消毒灭菌方法是","options":["A.燃烧法","B.煮沸法","C.压力蒸汽灭菌法","D.微波消毒灭菌法","E.75%乙醇浸泡"],"answer":"C","explanation":"气性坏疽是由梭状芽孢杆菌所引起的一种严重急性特异性感染。病人用过的一切衣物、敷料、器械均应单独收集，进行消毒。刀剪最好采用压力蒸汽灭菌，换下的敷料应燃烧销毁，以防交叉感染。"},{"n":694,"q":"病人男，50岁。在冬季使用自己安装的煤炉生火取暖时，出现头痛、头晕、无力、胸闷、心悸、恶心等症状。现场抢救时的首要措施是","options":["A.立即口对口人工呼吸","B.立即将病人转移至室外空气新鲜处","C.高压氧治疗","D.物理降温","E.给予镇痛药"],"answer":"B","explanation":"抢救一氧化碳中毒病人，首要措施是立即脱离中毒环境，将病人转移至空气新鲜处。"},{"n":695,"q":"病人男，60岁。胃大部切除术后第2天。针对该病人术后疼痛的护理措施，错误的是","options":["A.手术前教会病人深呼吸","B.如病情稳定可给予半坐卧位","C.可按压伤口后再咳嗽","D.影响睡眠时可酌情使用镇痛药，并报告医生","E.首选阿片类镇痛药物"],"answer":"E","explanation":"阿片类药物主要用于重度和剧烈癌痛的病人，不作为术后疼痛病人的首选用药。"},{"n":696,"q":"病人女，36岁。甲亢术后24小时，烦躁不安，T 39℃，P 120次/min，大汗。病人发生上述症状的主要原因是","options":["A.术后出血","B.感染","C.精神紧张","D.术前准备不充分","E.术中补液不足"],"answer":"D","explanation":"本题该病人发生了甲状腺危象。甲状腺危象是甲状腺功能亢进症术后的严重并发症，多发生于术后12～36小时。其发生多与术前准备不充分、甲亢症状未能很好控制及手术应激有关。"},{"n":697,"q":"患儿男，8个月。室间隔缺损，伴有肺动脉高压，因患支气管肺炎入院治疗。彩超：室间隔缺损直径为1.1cm。下列处理方法正确的是","options":["A.强心、利尿、抗感染，应用扩血管药物，无须手术","B.立即手术","C.控制感染后再手术","D.控制感染后，强心、利尿、扩血管，观察室间隔缺损至1周岁如仍未闭合再手术","E.应用扩血管药物，控制肺部感染，争取早期手术"],"answer":"E","explanation":"中、大型室间隔缺损（VSD）可手术治疗，合并肺动脉高压者，应用扩血管药物，控制潜在肺部感染，争取早期手术。"},{"n":698,"q":"病人男，76岁。因腹部受伤入院。目前病人中心静脉压18cmH2O，血压75/34mmHg。关于该病人的处理原则，下列描述正确的是","options":["A.充分补液","B.适当补液","C.给予强心药","D.舒张血管","E.行补液试验"],"answer":"C","explanation":"中心静脉压高，血压低，提示心功能不全或血容量相对过多，应给予强心药，纠正酸中毒，舒张血管。"},{"n":699,"q":"患儿男，2岁。因生后2个月出现发绀，逐渐加重至今来院检查。患儿母亲诉患儿平素喜蹲踞。护理查体：杵状指，心前区隆起，胸骨左缘第2～4肋间闻及2～3级收缩期喷射样杂音。该患儿X线检查的表现应为","options":["A.肺纹理明显增多，肺门血管呈残根状","B.心影呈靴形，肺血管纹理增多","C.心影呈梨形，肺血管纹理增多","D.肺门血管增粗，可见肺门舞蹈征","E.心影呈靴形，肺血管纹理减少"],"answer":"E","explanation":"法洛四联症的X线检查：心影呈靴形，肺血管纹理减少，肺叶清晰。"},{"n":700,"q":"婴儿女，月龄2个月，11月出生。母乳喂养，体重4.8kg，生长发育良好。下列辅食该婴儿应添加的是","options":["A.鱼肝油","B.豆浆","C.蛋黄","D.菜泥","E.米糊"],"answer":"A","explanation":"母乳喂养可以满足6月龄小儿的营养需要，6个月后随着生长发育，纯母乳喂养不能满足其需要，才开始向固体食物转换。冬季出生的小儿可以适量添加鱼肝油。"},{"n":701,"q":"孕妇，28岁，妊娠10周。出现尿频、尿急，应采取的护理措施是","options":["A.给予留置导尿","B.嘱其少饮水","C.给予抗利尿药物","D.告知此现象为妊娠期正常的生理变化，无须处理","E.给予抗感染药物"],"answer":"D","explanation":"妊娠早期增大的子宫压迫膀胱出现尿频、尿急，是正常的生理变化。妊娠12周左右增大的子宫超出盆腔，尿频、尿急自行消失，无须干预。"},{"n":702,"q":"病人男，40岁。硬膜外麻醉下行肛周脓肿切除术，硬膜外置管给药数分钟后，出现低血压、意识丧失、心跳呼吸骤停，全部脊神经支配区域无痛觉。最可能的原因是","options":["A.局麻药毒性反应","B.穿刺部位感染","C.心肌梗死","D.全脊椎麻醉","E.局麻药注入血管"],"answer":"D","explanation":"低血压、意识丧失、心跳呼吸骤停，全部脊神经支配区域无痛觉，是明显的全脊椎麻醉的临床表现。"},{"n":703,"q":"病人男，25岁。骑摩托车肇事导致颅脑损伤，急救车送来急诊。当时呼唤睁眼，问话吐词不清，不能按指令活动、刺痛定位。按照格拉斯哥昏迷评分，该病人的分数是","options":["A.12分","B.11分","C.10分","D.9分","E.8分"],"answer":"B","explanation":"格拉斯哥昏迷评分（GCS）：睁眼反应（自动睁眼4，呼唤睁眼3，刺痛睁眼2，不能睁眼1）；语言反应（回答正确5，回答错误4，吐词不清3，只能发声2，不能发声1）；运动反应（遵嘱活动6，刺痛定位5，躲避刺痛4，刺痛肢屈3，刺痛肢伸2，不能活动1）。最高为15分代表意识清醒，总分低于8分即表现昏迷状态，分数越低表明意识障碍越严重。本题该病人睁眼反应3分、语言反应3分、运动反应5分，总共11分。"},{"n":704,"q":"病人男，45岁。上腹痛5年，常发生在空腹饥饿时，进食后缓解，近3天出现黑便。为明确诊断，应进行的检查是","options":["A.胃镜检查","B.X线钡餐检查","C.幽门螺杆菌检测","D.血液分析","E.粪便隐血实验"],"answer":"A","explanation":"病人规律性腹痛，怀疑消化性溃疡，故首选胃镜检查。"},{"n":705,"q":"病人女，53岁。绝经后阴道流血1月余。妇科检查：子宫前倾位，宫颈光滑，两侧附件未触及。为明确诊断，应进行的检查是","options":["A.分段诊断性刮宫","B.阴道镜检查","C.子宫活组织检查","D.B型超声","E.肿瘤标志物检测"],"answer":"A","explanation":"绝经后阴道流血为绝经后子宫内膜癌的主要症状，诊断性刮宫是早期诊断子宫内膜癌最常用且最有价值的诊断方法，因此该病人应进行分段诊断性刮宫。"},{"n":706,"q":"孕妇，27岁，妊娠38+3周。检查：规律宫缩，枕右前位，胎心率140次/min，宫口开大7cm。关于第一产程的护理措施，下列描述错误的是","options":["A.指导合理进食","B.休息时取左侧卧位","C.宫缩时不宜用腹压","D.每隔1～2h听诊胎心一次","E.鼓励每2～4h排尿一次"],"answer":"D","explanation":"第一产程中，潜伏期应每小时听诊胎心一次，活跃期应每30min听诊胎心一次。该产妇宫口已开大7cm进入活跃期，故应每30min听诊胎心一次。"},{"n":707,"q":"胆囊疾病可引起右肩部疼痛，用系统的基本属性解释，此现象反映系统的","options":["A.整体性","B.相关性","C.层次性","D.动态性","E.预决性"],"answer":"B","explanation":"相关性是指系统各要素之间是相互联系、相互制约的，其中任何一个要素发生了功能或作用的变化，都会引起其他各要素乃至于整体系统功能或作用的相应变化。胆囊疾病可引起右肩部疼痛，属于系统的相关性。"},{"n":708,"q":"一位即将接受第二次大手术的病人对护士说：“一想到上次术后我所经历的刀口疼痛，我就害怕得不得了。”该沟通层次属于","options":["A.一般性沟通","B.事务性沟通","C.分享性沟通","D.情感性沟通","E.共鸣性沟通"],"answer":"D","explanation":"处于情感性沟通层次时，沟通双方会在相互信任的基础上传递除信息以外的情感内容。"},{"n":709,"q":"患儿女，2岁。四肢散在瘀斑，诊断为免疫性血小板减少症。下列药物应禁用的是","options":["A.泼尼松","B.地塞米松","C.头孢地尼","D.阿司匹林","E.红霉素"],"answer":"D","explanation":"免疫性血小板减少症患儿头痛、发热时禁服阿司匹林等影响血小板功能的药物。"},{"n":710,"q":"病人男，36岁。因车祸致胸部严重外伤入院。按照马斯洛的人的基本需要层次论，护士应首先满足病人的","options":["A.生理的需要","B.安全的需要","C.社交的需要","D.尊重的需要","E.自我实现的需要"],"answer":"A","explanation":"马斯洛的人的基本需要层次论中，生理需要位于“金字塔”形需要层次的最底部，应首先给予满足。"},{"n":711,"q":"病人男，52岁。因车祸致腹部剧痛5小时入院。查体：BP 80/48mmHg，P 120次/min，脉搏细速，神志清，两肺呼吸音清而对称，腹稍膨隆，全腹肌紧张，压痛、反跳痛明显。针对该病人，首要的护理措施是","options":["A.立即静脉补液","B.遵医嘱合理使用抗生素","C.给予胃肠减压","D.注射破伤风抗毒素","E.给予吗啡镇痛"],"answer":"A","explanation":"病人处于休克状态，应立即给予抗休克治疗。"},{"n":712,"q":"病人男，16岁。自3m高处摔下，当即昏迷。现病人躁动；脑脊液检查有红细胞；CT扫描见左额顶叶低密度灶，其中有散在点状高密度影。观察该病人生命体征的顺序应为","options":["A.脉搏―呼吸―血压","B.血压―脉搏―呼吸","C.脉搏―血压―呼吸","D.呼吸―血压―脉搏","E.呼吸―脉搏―血压"],"answer":"E","explanation":"创伤病人急救时生命体征评估顺序为呼吸、脉搏、血压。"},{"n":713,"q":"病人女，36岁。诊断为胰腺炎。已采取肠外营养3周。今日出现高热、寒战。该病人可能发生的并发症是","options":["A.肠源性感染","B.导管败血症","C.血栓性静脉炎","D.导管堵塞","E.胆管系统损害"],"answer":"B","explanation":"出现导管败血症的第一征象是高热并且伴有寒战。"},{"n":714,"q":"初产妇，29岁。妊娠39周。左枕前位。规律宫缩8小时，子宫口开大6cm，S+1，胎心150次/min，胎膜已破。6小时后阴道检查：子宫口开大6cm，S+1，宫缩力弱。目前该产妇的产程属于","options":["A.正常潜伏期","B.正常活跃期","C.潜伏期延长","D.活跃期停滞","E.胎头下降停滞"],"answer":"D","explanation":"当破膜后宫颈扩张≥6cm后，若宫缩正常，宫颈口停止扩张≥4小时；若宫缩欠佳，宫颈口停止扩张≥6小时称为活跃期停滞。"},{"n":715,"q":"病人男，70岁。诊断为脑出血，呈持续昏迷状态。护士观察到病人因痰液黏稠致呼吸困难。下列吸痰操作不妥的是","options":["A.调节电动吸引器的负压至45kPa","B.反折吸痰管末端，插入病人口腔咽部","C.每次吸痰时间应大于15s，以达到抽吸效果","D.叩拍胸背，便于痰液排出","E.观察病人吸痰前后呼吸频率的改变"],"answer":"C","explanation":"每次吸痰时间不应超过15秒，以免缺氧。"},{"n":716,"q":"病人女，45岁。拟行胆囊造影，下列描述错误的是","options":["A.检查当日早餐禁食","B.检查前1天午餐进无脂肪、低蛋白的清淡饮食，晚餐进高脂肪饮食","C.检查前1天午餐进高脂肪饮食，晚餐进无脂肪、低蛋白的清淡饮食","D.检查当天第一次B超检查后如胆囊显影良好，则进高脂肪饮食，以了解胆囊收缩功能","E.检查完毕当天进低蛋白、低脂肪饮食"],"answer":"B","explanation":"A. 检查当日早餐禁食 - 正确。胆囊造影通常要求患者在检查当天禁食，以确保胆囊充盈，便于观察。 B. 检查前1天午餐进无脂肪、低蛋白的清淡饮食，晚餐进高脂肪饮食 - 错误。通常建议患者在检查前一天晚上避免高脂肪饮食，因为高脂肪饮食会刺激胆囊排空，可能影响第二天的检查结果。 C. 检查前1天午餐进高脂肪饮食，晚餐进无脂肪、低蛋白的清淡饮食 - 正确。这样的饮食安排有助于胆囊在检查前排空，然后在检查当天保持充盈状态。 D. 检查当天第一次B超检查后如胆囊显影良好，则进高脂肪饮食，以了解胆囊收缩功能 - 正确。在某些情况下，医生可能会要求患者在检查当天进食高脂肪餐，以评估胆囊的收缩功能。 E. 检查完毕当天进低蛋白、低脂肪饮食 - 正确。检查后，患者可能会被建议进食清淡饮食，以减轻胆囊的负担。"},{"n":717,"q":"患儿男，2岁。体重16kg。诊断为儿童单纯性肥胖。2岁儿童的正常体重为12kg左右，该患儿属于","options":["A.超重","B.肥胖","C.轻度肥胖","D.中度肥胖","E.重度肥胖"],"answer":"D","explanation":"儿童单纯性肥胖分为3度，以同性别、同身高/长正常小儿体重均值为标准，体重超过均值20%以上者为肥胖；超过20%～29%者为轻度肥胖；超过30%～49%者为中度肥胖；超过59%者为重度肥胖。此患儿体重16kg，超过标准体重33%，30%～49%为中度肥胖。"},{"n":718,"q":"病人男，50岁。诊断为肝硬化伴食管-胃底静脉曲张。入院后病人呕吐大量鲜血。护理查体：呼吸急促，脉搏细数，BP60/40mmHg，出冷汗。此时，护士应立即将病人安置的体位为","options":["A.平卧位","B.屈膝仰卧位","C.中凹卧位","D.侧卧位","E.头低足高位"],"answer":"C","explanation":"病人症状表现为休克，休克病人应选择中凹卧位，有利于气道通畅，改善缺氧症状，促进静脉回流，增加回心血量。"},{"n":719,"q":"护士对病人说：“今天的天气真好！”该沟通层次属于","options":["A.一般性沟通","B.事务性沟通","C.分享性沟通","D.情感性沟通","E.共鸣性沟通"],"answer":"A","explanation":"一般性沟通是沟通双方参与程度最差，彼此分享真实感受最少的沟通。双方往往只是表达一些表面式的社交性话题。"},{"n":720,"q":"小儿女，5岁。生长发育良好，尚未出恒牙。家长咨询原因，护士回答开始出恒牙的时间是","options":["A.4岁","B.5岁","C.6岁","D.7岁","E.8岁"],"answer":"C","explanation":"6岁开始出第一恒磨牙，12岁出第二恒磨牙。"},{"n":721,"q":"患儿男，6个月。发热4天，出现皮疹1天，有咳嗽、流涕症状，初步诊断为麻疹。下列治疗措施正确的是","options":["A.按呼吸道传染病进行隔离","B.关闭门窗，防止感冒","C.限制饮水，防止渗出过多引发循环衰竭","D.大量补充维生素B，利于疾病的恢复","E.应用利巴韦林预防细菌感染"],"answer":"A","explanation":"麻疹的治疗措施包括：按呼吸道传染病进行隔离，定期开窗通风，有效防止病毒传播，鼓励多饮水，补充丢失体液，多补充维生素A利于康复，利巴韦林是抗病毒药物。"},{"n":722,"q":"病人男，25岁。胸部外伤，多根多处肋骨骨折合并开放性气胸，神志清楚。查体：BP86/52mmHg，P 129次/min，R 27次/min。首先应采取的急救措施是","options":["A.输血、输液","B.吸氧","C.封闭胸壁伤口","D.清创缝合伤口","E.镇静、镇痛"],"answer":"C","explanation":"开放性气胸的急救为迅速封闭胸壁伤口。"},{"n":723,"q":"病人近1个月出现全身乏力，畏寒怕冷，属于气的哪个作用减弱","options":["A.推动","B.温煦","C.固摄","D.防御","E.气化"],"answer":"B","explanation":"温煦作用是指阳气温煦人体的作用，主要表现在维持机体相对恒定的体温。病人畏寒怕冷，说明是气的温煦作用减弱。"},{"n":724,"q":"患儿女，2岁。因发热2天，呕吐1天入院。诊断为病毒性脑炎。下列治疗措施不正确的是","options":["A.降温","B.预防抽搐","C.改善脑部微循环","D.穿刺放脑脊液","E.降低颅内压"],"answer":"D","explanation":"病毒性脑炎的治疗方法不包括穿刺放脑脊液。"},{"n":725,"q":"病人女，29岁。产后50天，诊断为产后抑郁。时常会讲述疾病的痛苦，首选的情志护理方法是","options":["A.以情胜情法","B.移情易性法","C.顺情从欲法","D.说理开导法","E.释疑解惑法"],"answer":"C","explanation":"顺情从欲法是指顺从病人的意志、意愿、情绪，满足其心身的需要，以解除病人心理病因的一种情志护理方法。"},{"n":726,"q":"病人女，48岁。1年来常感头晕、乏力、耳鸣，心悸、气促，夜间睡眠欠佳，痔疮出血已10余年。经检查初步诊断为缺铁性贫血。该病人最主要的处理原则是","options":["A.休息","B.输血","C.治疗痔疮","D.补充铁剂","E.调整饮食"],"answer":"C","explanation":"缺铁性贫血的关键是根治病因，因此应首先治疗原发病。"},{"n":727,"q":"病人女，20岁。食用不洁食物后出现全身不适，体温39～40℃，呈稽留热，脉搏60～70次/min，肝脾大，白细胞计数低下。病程第2周出现玫瑰疹。对该病人采取的隔离措施应为","options":["A.呼吸道隔离","B.肠道隔离","C.昆虫隔离","D.保护性隔离","E.接触隔离"],"answer":"B","explanation":"伤寒是由伤寒杆菌引起的经消化道传播的急性传染病，其临床特征为持续发热、全身中毒症状、相对缓脉、肝脾大、玫瑰疹及白细胞减少等。根据该病人的病史及表现，应考虑伤寒的可能性，对病人采取肠道隔离。"},{"n":728,"q":"病人女，65岁。因腹泻入院后给予补液治疗。输液过程中，病人突然出现呼吸困难、胸闷、咳嗽、咳粉红色泡沫样痰。下列急救措施不妥的是","options":["A.立即停止输液","B.给予20%～30%乙醇湿化吸氧","C.给予左侧卧位并头低足高","D.四肢轮流结扎","E.遵医嘱给予镇静、强心、利尿药"],"answer":"C","explanation":"本题中，病人出现急性肺水肿，应给予端坐位，两腿下垂，以减少静脉回流，减轻心脏负担。"},{"n":729,"q":"病人男，75岁。诊断为脑出血。根据马斯洛的人的基本需要层次论，下列护理问题中应首先解决的是","options":["A.语言沟通障碍","B.焦虑","C.有皮肤完整性受损的危险","D.营养失调：低于机体需要量","E.清理呼吸道无效"],"answer":"E","explanation":"按照马斯洛的人的基本需要层次论，应首先解决病人最迫切的需求，空气这一生理需要需立即并持续予以满足。因此，当前情况下应首先解决的护理问题是清理呼吸道无效。"},{"n":730,"q":"病人男，66岁。长期吸烟史。近1个月来刺激性咳嗽、痰不多，偶有血丝；近1周咳嗽加重，持续性，呈高音调金属音；声音嘶哑，消瘦，X线显示肺部有直径3～5cm圆形阴影，边缘有细毛刺影。诊断为小细胞肺癌。下列治疗措施正确的是","options":["A.手术切除原发灶","B.先治疗胸腔积液，再争取手术","C.先进行生物学治疗","D.进行全身化疗","E.只进行放疗"],"answer":"D","explanation":"小细胞肺癌首选及主要的治疗方法是化疗。"},{"n":731,"q":"病人女，40岁。因甲型肝炎住院治疗。下列护理措施不妥的是","options":["A.护理病人前后均应洗手","B.接触病人应穿隔离衣","C.病人的排泄物倒入马桶中冲洗排放","D.给予病人低脂饮食","E.病人剩余的食物用漂白粉混合搅拌后倒掉"],"answer":"C","explanation":"对甲型肝炎病人实行接触隔离，护理病人时应穿隔离衣、戴手套，病人的食物和排泄物消毒处理后再排放。"},{"n":732,"q":"女性，28岁。平素月经规律，现停经3个月，尿hCG试验阳性。若胚胎发育正常，B超检查的表现是","options":["A.观察到胎动","B.已能辨认性别","C.检测到胎心搏动","D.观察到肠道蠕动","E.观察到呼吸运动"],"answer":"C","explanation":"孕妇于妊娠18～20周时开始自觉胎动，胎动每小时3～5次；妊娠18～20周时用普通听诊仪可在孕妇腹壁听到胎心音；妊娠12周时用多普勒胎心听诊仪能检测到胎心音。"},{"n":733,"q":"病人男，45岁。肾移植术后4个月。近5天来出现发热、咳嗽、咳白色痰液，抗生素治疗3天后未见好转，急诊入院。现病人呼吸28次/min，脉搏血氧饱和度85%。该病人最有可能出现了","options":["A.慢性阻塞性肺疾病（COPD）","B.肺栓塞","C.急性呼吸窘迫综合征（ARDS）","D.哮喘","E.肺内感染"],"answer":"C","explanation":"ARDS的临床表现是在原发疾病症状的基础上出现进行性呼吸增快，可达30～50次/min，随着呼吸频率增快，呈呼吸窘迫。随着缺氧加重，病人出现烦躁不安、心率增快、发绀等。ARDS的缺氧症状使用常规鼻导管或面罩吸氧无法缓解。在疾病后期，多并发肺部感染，出现发热、畏寒、咳嗽和咳痰等症状。"},{"n":734,"q":"病人女，32岁。排便时及排便后肛门剧痛伴少量出血2年。首先应考虑为","options":["A.内痔","B.肛裂","C.外痔","D.直肠癌","E.直肠息肉"],"answer":"B","explanation":"肛裂最主要的症状是排便时及排便后肛门疼痛，疼痛的特点是有2次高峰。"},{"n":735,"q":"患儿男，10岁。主诉口腔疼痛难忍。护理查体：T 39.9℃，口腔糜烂。根据病情，应给予的饮食是","options":["A.普通饮食","B.软质饮食","C.半流质饮食","D.流质饮食","E.高蛋白饮食"],"answer":"D","explanation":"流质饮食适用于高热、口腔疾患的病人，流质饮食食物呈流体，易吞咽、易消化，无刺激性。"},{"n":736,"q":"患儿女，1岁。青紫10个月，诊断为法洛四联症。今患儿用力大便后突然出现昏厥，青紫加重，应考虑为","options":["A.心力衰竭","B.心律失常","C.缺氧发作","D.脑膜炎","E.脑血栓"],"answer":"C","explanation":"2岁以下的法洛四联症患儿多有缺氧发作，常在晨起吃奶时或大便、哭闹后出现阵发呼吸困难、烦躁、青紫加重，严重者可突然昏厥、抽搐，这是由于在肺动脉漏斗部狭窄的基础上，突然出现该处肌肉痉挛，引起一过性肺动脉狭窄梗阻，使脑缺氧加重所致。"},{"n":737,"q":"病人女，36岁。因再生障碍性贫血入院治疗。血常规：血红蛋白50g/L，血小板计数10×109/L。该病人的休息与活动计划是","options":["A.绝对卧床休息","B.适当进行户外活动","C.室内可进行剧烈活动","D.床上活动为主，增加休息时间","E.卧床休息为主，间断床边活动"],"answer":"A","explanation":"血小板计数<50×10"},{"n":738,"q":"某医院发生医疗纠纷，因医患双方对病人死因存在异议，对此医疗争议处理程序错误的是","options":["A.立即上报","B.封存病历","C.2周内进行尸检","D.对相关责任人进行查处","E.做好家属善后工作"],"answer":"C","explanation":"病人死亡，医患双方当事人不能确定死因或对死因有异议的，应在病人死亡后48小时内进行尸检；具备尸体冷冻保存条件的，可延长至7天。"},{"n":739,"q":"病人男，45岁。因昨晚饮白酒500ml后出现呕血急诊入院。护理查体：血压105/60mmHg，脉搏90次/min，肝脾未触及。既往有无规律上腹痛史。护士判断该病人可能的诊断是","options":["A.急性糜烂性胃炎","B.胃溃疡","C.十二指肠溃疡","D.反流性食管炎","E.食管-胃底静脉曲张破裂"],"answer":"A","explanation":"病人曾有无规律上腹痛，饮酒后出现呕血，考虑急性糜烂性胃炎的可能最大。"},{"n":740,"q":"病人男，46岁。长期吸烟史。近2个月来刺激性咳嗽、痰不多，偶有血丝；近日出现食欲减退，消瘦，Horner综合征。X线显示肺部有直径3cm圆形阴影，边缘有细毛刺影。诊断为肺癌，给予化疗药物治疗。下列护理措施不正确的是","options":["A.密切观察骨髓抑制情况","B.少量多餐，避免刺激性食物","C.保护并合理使用静脉血管","D.保护皮肤，避免出现脱发、甲床变形","E.做好口腔护理，避免真菌感染"],"answer":"D","explanation":"化疗药物的毒性作用会导致皮肤干燥、色素沉着、脱发和甲床变形，应向病人做好解释和安慰，消除其顾虑。"},{"n":741,"q":"患儿女，5岁。2天前出现发热、咽痛症状，今天周身出现针尖大小丘疹，有瘙痒，压之褪色，应考虑为","options":["A.急性扁桃体炎","B.麻疹","C.流行性腮腺炎","D.猩红热","E.中毒型细菌性痢疾"],"answer":"D","explanation":"患儿年龄为5岁，符合猩红热发病的年龄特点；发热、咽痛、针尖大小丘疹、有瘙痒，符合猩红热的临床特点；麻疹虽然也有皮疹的临床表现，但一般不痒，皮疹形态也与猩红热不同，其他疾病一般没有皮疹的临床表现。"},{"n":742,"q":"孕妇，33岁。既往患先天性心脏病，现妊娠10周，主诉轻微日常工作常感心悸、气促、胸闷，休息后好转。护理查体：HR 100次/min，R 18次/min，听诊肺底部无湿��音。下列处理正确的是","options":["A.密切监护，继续妊娠","B.控制心衰后行人工流产","C.一边控制心衰，一边紧急剖宫取胎","D.行人工流产","E.心衰纠正后继续维持妊娠"],"answer":"D","explanation":"该孕妇现妊娠10周，心功能Ⅲ级，但无心衰，不宜妊娠，应行人工流产。"},{"n":743,"q":"足月女婴，出生5天。因阴道有少量血性分泌物就诊，下列处理正确的是","options":["A.给予止血药","B.局部冷敷","C.无须处理","D.纱布压迫止血","E.盆腔B超检查"],"answer":"C","explanation":"部分女婴在出生的最初几天，可出现少量的阴道流血，持续1～3天后自行停止，称为假月经，是由于母体激素通过胎盘进入胎儿体内，出生后突然下降、消失所引起，无须处理。"},{"n":744,"q":"病人女，25岁。因腹痛、腹泻3天，以急性肠炎收入院。护理查体：精神萎靡，T 39.8℃，粪便呈水样。护士收集的下列资料中，属于主观资料的是","options":["A.T","B.粪便稀黄，含有少量脓血","C.腹部脐周阵发性隐痛4小时","D.呕吐物呈酸臭味","E.精神萎靡"],"answer":"C","explanation":"主观资料，即护理对象的主诉，是其对经历、感觉、思考及担心的内容进行的诉说，如“我感觉不舒服”“我担心自己的病治不好了”等。"},{"n":745,"q":"病人女，75岁。独居，因厌世服毒，社区工作人员发现后将其送入医院抢救。在不知其服何种毒物的情况下，护士应采取的措施是","options":["A.抽吸胃液，送化验室检测，待查明毒物名称后再处理","B.吸氧，待病人清醒后处理","C.用生理盐水灌肠，减轻毒物吸收","D.鼻饲牛奶或蛋清水，保护胃黏膜","E.协助其平卧位，头偏向一侧，用温水洗胃"],"answer":"E","explanation":"当毒物性质不明时，洗胃溶液可选用温开水或生理盐水。"},{"n":746,"q":"病人女，35岁。急性阑尾炎术后，意识尚未完全清醒，主诉畏寒，T 36.5℃。护士为其在足底放置热水袋保暖，热水袋的温度应为","options":["A.45℃","B.55℃","C.65℃","D.75℃","E.85℃"],"answer":"A","explanation":"成人使用热水袋的温度为60～70℃；昏迷病人、老人、婴幼儿、感觉迟钝、循环不良的病人，水温应低于50℃。"},{"n":747,"q":"病人男，30岁。因急性胃肠炎入院，每天排便次数至少6次。该病人宜采用的饮食为","options":["A.高蛋白、高纤维素饮食","B.高脂肪、高糖饮食","C.高脂肪、高纤维素饮食","D.低盐、低脂肪饮食","E.低脂肪、少渣饮食"],"answer":"E","explanation":"腹泻病人宜采用低脂肪、少渣饮食。"},{"n":748,"q":"病人女，34岁。突发高热，体温39.6℃，自诉周身不适，恶心，并有尿频、尿急、尿痛及下腹不适。此时应指导病人不应采取的体位是","options":["A.平卧位","B.侧卧位","C.站立位","D.仰卧位","E.半坐卧位"],"answer":"C","explanation":"肾盂肾炎急性期应卧床休息，避免站立或坐立，因直立时肾脏受到牵拉，会加重疼痛。"},{"n":749,"q":"病人男，28岁。汽油烧伤头、面、颈部，右上肢，口鼻周围、颈部和上肢都有大小不一的水疱，痛觉迟钝。急救护理过程中应特别注意","options":["A.口腔护理","B.静脉补液","C.创面护理","D.保持呼吸道通畅","E.早用TAT，预防破伤风"],"answer":"D","explanation":"头、面、颈部的烧伤应警惕吸入性损伤，保持呼吸道通畅。"},{"n":750,"q":"病人男，45岁。慢性咳嗽20年，现有呼吸困难、发绀、发热。血气分析：pH 7.41，PaCO2 70mmHg，PaO2 40mmHg。有神经精神症状。该病人可能出现了","options":["A.气胸","B.弥散性血管内凝血（DIC）","C.代谢性酸中毒","D.肺性脑病","E.心力衰竭"],"answer":"D","explanation":"该患者有慢性咳嗽 20 年病史，目前出现呼吸困难、发绀、发热，血气分析提示二氧化碳分压（PaCO₂）升高（70mmHg），氧分压（PaO₂）降低（40mmHg），且有神经精神症状。 肺性脑病是由于呼吸功能衰竭所致缺氧、二氧化碳潴留而引起的神经精神障碍综合征，常继发于慢性阻塞性肺疾病等慢性呼吸系统疾病。患者的临床表现和血气分析结果符合肺性脑病的特点。 A 项气胸主要表现为突发的胸痛和胸闷、呼吸困难等，与该患者的慢性病史及神经精神症状不相符。 B 项弥散性血管内凝血（DIC）主要表现为出血、休克、栓塞等，与该患者的症状不符。 C 项代谢性酸中毒常表现为呼吸深快、乏力、恶心等，该患者血气分析中 pH7.41 基本正常，不支持代谢性酸中毒。 E 项心力衰竭主要表现为呼吸困难、乏力、水肿等，一般无明显的神经精神症状。"},{"n":751,"q":"患者男，36岁。患者有消化道溃疡病史。两天前受凉后出现咽干、咽痛、打喷嚏、鼻塞、流涕、食欲减退等症状。下列药物患者禁用的是","options":["A.金刚烷胺","B.阿司匹林","C.利巴韦林","D.氯苯那敏","E.银翘解毒片"],"answer":"B","explanation":""},{"n":752,"q":"患者25岁，急产。胎儿娩出后产妇突然发生呼吸困难，有濒死感，迅速出现循环衰竭、休克及昏迷。该患者最有可能是","options":["A.休克","B.子痫","C.虚脱","D.心力衰竭","E.羊水栓塞"],"answer":"E","explanation":""},{"n":753,"q":"医院护理部组织护理专家，将一项新的护理技术的操作步骤和动作规范标准化，并据此培训护士以提高工作效率。护理部依据的管理理论是","options":["A.科学管理理论","B.管理过程理论","C.群体力学理论","D.X理论和Y理论","E.人际关系理论"],"answer":"A",

<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f7"><title>护理刷题·极简版</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f}.app{max-width:680px;margin:auto;padding:env(safe-area-inset-top) 16px calc(90px + env(safe-area-inset-bottom))}.top{position:sticky;top:0;background:rgba(245,245,247,.9);backdrop-filter:blur(18px);padding:14px 0 10px;z-index:5}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:#6e6e73;font-size:14px}.bar{height:5px;background:#ddd;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#1d1d1f}.card{background:white;border-radius:20px;padding:20px;margin-top:12px;box-shadow:0 2px 12px #0000000a}.q{font-size:20px;line-height:1.55;font-weight:650;white-space:pre-wrap}.opt{width:100%;text-align:left;border:1px solid #ddd;background:#fff;border-radius:14px;padding:14px;margin-top:10px;font-size:17px;line-height:1.4}.opt.sel{border:2px solid #1d1d1f}.opt.correct{background:#eaf7ed;border-color:#48a85b}.opt.wrong{background:#fff0f0;border-color:#e45b5b}.actions{display:flex;gap:10px;margin-top:16px}.btn{border:0;border-radius:14px;padding:13px 14px;font-size:16px;font-weight:600;flex:1}.primary{background:#1d1d1f;color:#fff}.secondary{background:#e8e8ed;color:#1d1d1f}.answer{display:none;margin-top:16px;border-top:1px solid #eee;padding-top:16px;line-height:1.6}.answer.show{display:block}.ans{font-size:19px;font-weight:700}.exp{margin-top:8px;white-space:pre-wrap}.bottom{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:8}.bottom .btn{max-width:325px;margin:auto}.mini{border:0;background:#e8e8ed;border-radius:10px;padding:8px 10px;font-weight:600}.fav{background:#1d1d1f;color:white}.status{font-size:13px;color:#6e6e73;margin-top:10px;text-align:center}.switch{font-size:13px;color:#1d1d1f;text-decoration:none;background:#e8e8ed;padding:7px 9px;border-radius:9px}</style></head><body><div class="app"><div class="top"><div class="row"><b>护理刷题</b><a class="switch" href="./">功能版</a></div><div class="row" style="margin-top:8px"><span></span><span id="count" class="muted"></span></div><div class="bar"><i id="prog"></i></div></div><div class="card"><div id="q" class="q"></div><div id="opts"></div><div class="actions"><button id="reveal" class="btn primary">翻牌查看答案</button><button id="wrongBtn" class="mini">错题 ☆</button></div><div id="answer" class="answer"><div id="ans" class="ans"></div><div id="exp" class="exp"></div></div><div id="status" class="status"></div></div></div><div class="bottom"><button id="prev" class="btn secondary">上一题</button><button id="random" class="mini">随机</button><button id="next" class="btn primary">下一题</button></div><script src="./questions.js"></script><script>
const Q=window.Q;let idx=+(localStorage.nq_idx||0);if(idx>=Q.length)idx=0;let selected=null;let wrong=new Set(JSON.parse(localStorage.nq_wrong||'[]'));const $=x=>document.getElementById(x);function save(){localStorage.nq_idx=idx;localStorage.nq_wrong=JSON.stringify([...wrong])}function $$(id,sel){return [...$(id).querySelectorAll(sel)]}
function render(){let x=Q[idx];selected=null;$('q').textContent=(idx+1)+'. '+x.q;$('count').textContent=(idx+1)+' / '+Q.length;$('prog').style.width=((idx+1)/Q.length*100)+'%';$('opts').innerHTML='';x.options.forEach(o=>{let b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{$$('opts','.opt').forEach(z=>z.classList.remove('sel'));b.classList.add('sel');selected=o[0]};$('opts').appendChild(b)});$('answer').className='answer';$('reveal').textContent='翻牌查看答案';$('ans').textContent='正确答案：'+x.answer;$('exp').textContent=x.explanation?('解析：'+x.explanation):'';$('wrongBtn').textContent=wrong.has(x.n)?'错题 ★':'错题 ☆';$('wrongBtn').className=wrong.has(x.n)?'mini fav':'mini';$('status').textContent='进度已自动保存在本机';save()}
$('reveal').onclick=()=>{let show=!$('answer').classList.contains('show');$('answer').classList.toggle('show',show);$('reveal').textContent=show?'隐藏答案':'翻牌查看答案';if(show){$$('opts','.opt').forEach(b=>{let l=b.textContent[0];if(l===Q[idx].answer)b.classList.add('correct');if(selected&&l===selected&&selected!==Q[idx].answer)b.classList.add('wrong')});if(selected&&selected!==Q[idx].answer)wrong.add(Q[idx].n);save();$('wrongBtn').textContent=wrong.has(Q[idx].n)?'错题 ★':'错题 ☆'}};
$('wrongBtn').onclick=()=>{let n=Q[idx].n;wrong.has(n)?wrong.delete(n):wrong.add(n);save();render()};$('prev').onclick=()=>{idx=(idx-1+Q.length)%Q.length;render()};$('next').onclick=()=>{idx=(idx+1)%Q.length;render()};$('random').onclick=()=>{idx=Math.floor(Math.random()*Q.length);render()};render();</script></body></html>
